<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者文档 - TGX Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9fa] text-gray-900 font-sans antialiased min-h-screen">
    <header class="bg-white px-4 py-4 sticky top-0 z-10 border-b border-gray-100 flex items-center">
        <a href="./index.html" class="text-gray-500 mr-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-lg font-bold tracking-tight">开发者文档</h1>
    </header>

    <main class="px-4 py-6 max-w-2xl mx-auto">
        <!-- 头部欢迎 -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">API 接入指南</h2>
            <p class="text-sm text-gray-500 leading-relaxed">提供稳定、高速的数字商品自动化接入接口，支持批量采购与实时库存查询。</p>
        </div>

        <!-- 文档卡片网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 节点文档 -->
            <a href="./doc-node.html" class="block bg-white p-5 rounded-xl border border-gray-200 hover:border-black transition group">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600 mb-4 group-hover:bg-black group-hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-gray-900 mb-1">节点 API</h3>
                <p class="text-xs text-gray-500">获取订阅链接、拉取节点列表、流量查询接口文档。</p>
            </a>

            <!-- 支付文档 -->
            <a href="./doc-pay.html" class="block bg-white p-5 rounded-xl border border-gray-200 hover:border-black transition group">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600 mb-4 group-hover:bg-black group-hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-gray-900 mb-1">支付接口</h3>
                <p class="text-xs text-gray-500">统一下单、支付回调、订单状态主动查询。</p>
            </a>

            <!-- 账号查询 -->
            <a href="./doc-query.html" class="block bg-white p-5 rounded-xl border border-gray-200 hover:border-black transition group">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600 mb-4 group-hover:bg-black group-hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-gray-900 mb-1">订单/账号查询</h3>
                <p class="text-xs text-gray-500">根据订单号自动获取分配的账号密码及状态。</p>
            </a>

            <!-- 账号文档 -->
            <a href="./doc-account.html" class="block bg-white p-5 rounded-xl border border-gray-200 hover:border-black transition group">
                <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-600 mb-4 group-hover:bg-black group-hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-gray-900 mb-1">账号类接口</h3>
                <p class="text-xs text-gray-500">TG、Gmail 等账号池的批量调用与库存监控。</p>
            </a>
        </div>
    </main>
</body>
</html>
