<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 340px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
        
        /* 磨砂弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 300px; text-align: center; transform: scale(0.95); transition: transform 0.2s; opacity: 0; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-overlay.active .modal-box { transform: scale(1); opacity: 1; }
    </style>
</head>
<body>
    <div class="card text-center">
        <h1 class="text-[22px] font-bold text-slate-800 mb-2">欢迎回来</h1>
        <p class="text-[13px] text-slate-500 mb-8">登录您的 SOCKS5 账号</p>
        <div class="space-y-4 mb-6 text-left">
            <div>
                <label class="text-[12px] text-slate-500 mb-1 block">邮箱</label>
                <input type="text" id="login-email" class="input-flat" placeholder="请输入邮箱" value="boss@lynli.me">
            </div>
            <div>
                <label class="text-[12px] text-slate-500 mb-1 block">密码</label>
                <input type="password" id="login-pass" class="input-flat" placeholder="请输入密码" value="123456">
            </div>
        </div>
        <button onclick="doLogin()" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl text-[15px] active:opacity-80 transition shadow-sm">登录</button>
    </div>

    <!-- 专属报错弹窗 -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[17px] font-bold text-slate-800 mb-2" id="error-title">提示</h3>
            <p class="text-[14px] text-slate-500 mb-6" id="error-msg">请输入账号和密码。</p>
            <button onclick="closeErrorModal()" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl active:opacity-80 transition-colors">我知道了</button>
        </div>
    </div>

    <script>
        function doLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            
            if(!email || !pass) { 
                document.getElementById('error-msg').innerText = '请输入完整的账号和密码。';
                document.getElementById('error-modal').classList.add('active');
                return; 
            }

            if (email === 'boss@lynli.me') {
                localStorage.setItem('user_id', '10001');
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_role', 'boss');
            } else {
                localStorage.setItem('user_id', '10002');
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_role', 'user');
            }
            window.location.href = '/profile.html';
        }

        function closeErrorModal() {
            document.getElementById('error-modal').classList.remove('active');
        }
    </script>
</body>
</html>
