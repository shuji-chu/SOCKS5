<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; justify-content: center; position: relative; }
        
        .header { text-align: center; margin-top: 30px; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; border: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; font-weight: 700; color: #0f172a; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }
        
        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; width: 100%; max-width: 380px; margin: 0 auto; }
        
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; color: #64748b; }
        .options label { display: flex; align-items: center; gap: 6px; }
        .options input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2563eb; }
        .options a { color: #2563eb; text-decoration: none; cursor: pointer; }
        
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary:active { background: #1d4ed8; transform: scale(0.98); }
        
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        
        /* 底部区域 */
        .footer { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .footer .email { font-size: 12px; color: #94a3b8; }
        .footer-links { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #94a3b8; }
        .footer-links button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; }
        .footer-links button:hover { color: #64748b; }
        
        /* 弹窗样式 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-body { font-size: 13px; color: #475569; line-height: 1.6; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <img src="/logo.jpg">
        <h2>欢迎回来</h2>
        <p>登录以继续使用 SOCKS5 服务</p>
    </div>

    <div class="card">
        <form id="login-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group"><input type="password" id="password" required placeholder="密码"></div>
            <div class="options">
                <label><input type="checkbox" id="remember-me" checked> 记住密码</label>
                <a onclick="openModal('forget')">忘记密码？</a>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">安全登录</button>
        </form>
        <div class="link-text"><a href="/register.html">没有账号？立即注册</a></div>
    </div>

    <!-- 底部客服邮箱与协议 -->
    <div class="footer">
        <div class="email">客服邮箱：boss@lynli.me</div>
        <div class="footer-links">
            <button onclick="openModal('terms')">《用户协议》</button>
            <span>|</span>
            <button onclick="openModal('privacy')">《隐私政策》</button>
        </div>
    </div>

    <!-- 协议弹窗 -->
    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size:18px;font-weight:700;">标题</h3>
                <button onclick="closeModal()" style="border:none;background:none;font-size:20px;color:#94a3b8;">✕</button>
            </div>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>

    <script>
        // 【免密秒进】一打开页面，只要有 Token，直接进主页！
        if (localStorage.getItem('socks5_token')) {
            window.location.href = '/index.html';
        }

        // 登录逻辑
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = '登录中...'; btn.disabled = true;
            const email = document.getElementById('email').value;
            
            try {
                const res = await fetch('https://api.lynli.me/api/v1/auth/direct-register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (res.ok && data.data) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data.token);
                    window.location.href = '/index.html';
                } else { 
                    alert('系统异常'); btn.innerText = '安全登录'; btn.disabled = false;
                }
            } catch (err) { 
                alert('网络错误'); btn.innerText = '安全登录'; btn.disabled = false;
            }
        });

        // --- 弹窗逻辑 ---
        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。我们致力于维持您对我们的信任，恪守以下原则保护您的个人信息：权责一致原则、目的明确原则、选择同意原则、最少够用原则、确保安全原则、主体参与原则、公开透明原则等。未经您的同意，我们绝不会向任何第三方提供您的个人信息。' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务。本协议是您与 SOCKS5 之间关于您使用本服务所订立的协议。您在使用本服务时，必须遵守相关法律法规，不得利用本服务从事任何违法违规活动。对于任何违反规定的账号，我们有权进行封禁处理。' },
            'forget': { title: '找回密码', text: '请直接发送邮件至客服邮箱 boss@lynli.me 进行密码重置申请。' }
        };
        function openModal(type) {
            const data = modalContent[type]; if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body-content').innerText = data.text;
            document.getElementById('info-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('info-modal').classList.remove('active');
        }
    </script>
</body>
</html>
