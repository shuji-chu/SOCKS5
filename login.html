<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; }
        .header { text-align: center; margin-top: 30px; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; border: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; font-weight: 700; color: #0f172a; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }
        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; width: 100%; max-width: 380px; margin: 0 auto; }
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: all 0.2s; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; color: #64748b; }
        .options label { display: flex; align-items: center; gap: 6px; }
        .options input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2563eb; }
        .options a { color: #2563eb; text-decoration: none; cursor: pointer; }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary:active { background: #1d4ed8; transform: scale(0.98); }
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .footer { text-align: center; margin-top: auto; padding-top: 40px; margin-bottom: 16px; }
        .footer img { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 12px; opacity: 0.4; }
        .footer p.brand { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 1.5px; margin-bottom: 16px; }
        .footer-links { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: #94a3b8; }
        .footer-links button { background: none; border: none; color: #94a3b8; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; margin: 0 auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-body { font-size: 14px; color: #475569; line-height: 1.6; }
        /* 高级 Toast 样式 */
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.95); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 99999; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
        #toast.show { top: 30px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div class="header"><img src="/logo.jpg"><h2>欢迎回来</h2><p>登录以继续使用 SOCKS5 服务</p></div>
    <div class="card">
        <form id="login-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group"><input type="password" id="password" required placeholder="密码"></div>
            <div class="options">
                <label><input type="checkbox" id="remember-me"> 记住密码</label>
                <a onclick="showToast('请联系官方客服处理')">忘记密码？</a>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">安全登录</button>
        </form>
        <div class="link-text"><a href="/register.html">没有账号？立即注册</a></div>
    </div>
    <div class="footer">
        <img src="/logo.jpg"><p class="brand">Powered by SOCKS5 Secure</p>
        <div class="footer-links">
            <button onclick="openModal('privacy')">隐私政策</button> | <button onclick="openModal('terms')">用户协议</button> | <button onclick="openModal('about')">关于我们</button>
        </div>
    </div>
    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modal-title" style="font-size:18px;font-weight:700;">标题</h3><button onclick="closeModal()" style="border:none;background:none;font-size:20px;color:#94a3b8;">✕</button></div>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>

    <script>
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<img src="/logo.jpg" style="width:16px;height:16px;border-radius:4px;"> ${msg}`;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        window.onload = function() {
            const savedEmail = localStorage.getItem('remembered_email');
            const savedPwd = localStorage.getItem('remembered_pwd');
            if (savedEmail && savedPwd) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPwd;
                document.getElementById('remember-me').checked = true;
            }
        };

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = '登录中...'; btn.disabled = true;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-me').checked;

            try {
                const res = await fetch('https://api.lynli.me/s5api/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (remember) {
                        localStorage.setItem('remembered_email', email);
                        localStorage.setItem('remembered_pwd', password);
                    } else {
                        localStorage.removeItem('remembered_email');
                        localStorage.removeItem('remembered_pwd');
                    }
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else { 
                    showToast(data.message || '邮箱或密码错误'); 
                    btn.innerText = '安全登录'; btn.disabled = false;
                }
            } catch (err) { 
                showToast('网络连接失败，请检查网络'); 
                btn.innerText = '安全登录'; btn.disabled = false;
            }
        });

        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性...' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务...' },
            'about': { title: '关于我们', text: 'SOCKS5 致力于为您提供全球领先的虚拟资产...' }
        };
        function openModal(type) {
            document.getElementById('modal-title').innerText = modalContent[type].title;
            document.getElementById('modal-body-content').innerText = modalContent[type].text;
            document.getElementById('info-modal').classList.add('active');
        }
        function closeModal() { document.getElementById('info-modal').classList.remove('active'); }
    </script>
</body>
</html>
