<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f4f8">
  <meta name="description" content="创建 Lynli 账户，开始使用服务。">
  <title>创建账户 · Lynli</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <main class="auth-page auth-page-register">
    <a class="auth-brand" href="./shop.html" aria-label="返回商城">
      <span class="auth-brand-mark">L</span>
      <span class="auth-brand-copy"><strong id="siteName">Lynli</strong><small>ACCOUNT CENTER</small></span>
    </a>

    <section class="auth-card auth-card-register" aria-labelledby="pageTitle">
      <div class="auth-card-top">
        <span class="auth-eyebrow"><i></i> CREATE YOUR ACCOUNT</span>
        <div class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M19 8v6m-3-3h6"/></svg>
        </div>
      </div>

      <h1 id="pageTitle">创建账户</h1>
      <p class="auth-subtitle">验证您的邮箱，几步即可完成注册。</p>
      <div class="auth-notice" id="configNotice" role="status" hidden></div>

      <form id="registerForm" novalidate>
        <label class="auth-field">
          <span>邮箱地址</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="请输入常用邮箱" required>
        </label>

        <label class="auth-field">
          <span>邮箱验证码</span>
          <div class="auth-code-row">
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="输入 6 位验证码" required>
            <button class="auth-code-button" id="sendCodeButton" type="button">发送验证码</button>
          </div>
        </label>

        <label class="auth-field">
          <span>设置密码</span>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位密码" required>
        </label>

        <label class="auth-field">
          <span>确认密码</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" required>
        </label>

        <label class="auth-field">
          <span>邀请码 <em>选填</em></span>
          <input id="inviteCode" name="invite_code" type="text" autocomplete="off" placeholder="如有邀请码，请填写">
        </label>

        <p class="auth-error" id="formError" role="alert" aria-live="polite"></p>
        <button class="auth-primary" id="submitButton" type="submit">
          <span>创建账户</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <div class="auth-switch">已经拥有账户？ <a href="./login.html">返回登录</a></div>
      <div class="auth-security"><span aria-hidden="true">⌑</span> 验证码有效期 5 分钟，请勿向他人透露</div>
    </section>

    <footer class="auth-footer">© <span id="year"></span> <span id="footerSiteName">Lynli</span>. All rights reserved.</footer>
  </main>

  <script src="./js/api.js"></script>
  <script>
    (function () {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const form = $('registerForm');
      const submitButton = $('submitButton');
      const sendButton = $('sendCodeButton');
      const errorBox = $('formError');
      let countdownTimer = null;
      let countdownActive = false;
      let registrationOpen = true;
      $('year').textContent = new Date().getFullYear();

      function showError(message) {
        errorBox.textContent = message || '操作失败，请稍后重试';
      }

      function setSendButtonIdle() {
        countdownActive = false;
        sendButton.disabled = !registrationOpen;
        sendButton.textContent = '发送验证码';
      }

      function startCountdown() {
        let remaining = 60;
        countdownActive = true;
        sendButton.disabled = true;
        sendButton.textContent = remaining + ' 秒后重试';
        clearInterval(countdownTimer);
        countdownTimer = setInterval(function () {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            setSendButtonIdle();
          } else {
            sendButton.textContent = remaining + ' 秒后重试';
          }
        }, 1000);
      }

      async function loadConfig() {
        const config = await window.LynliAuthAPI.getConfig();
        const name = String(config.siteName || 'Lynli');
        $('siteName').textContent = name;
        $('footerSiteName').textContent = name;
        document.title = '创建账户 · ' + name;
        registrationOpen = config.registerOpen !== false && config.registerOpen !== 0;
        if (!registrationOpen) {
          $('configNotice').hidden = false;
          $('configNotice').textContent = '当前暂未开放新用户注册。';
          sendButton.disabled = true;
          submitButton.disabled = true;
        } else if (config.maintenance) {
          $('configNotice').hidden = false;
          $('configNotice').textContent = '系统维护提示：注册服务可能暂时受到影响，请稍后重试。';
        }
      }

      sendButton.addEventListener('click', async function () {
        errorBox.textContent = '';
        if (!registrationOpen || countdownActive || sendButton.disabled) return;
        const email = $('email').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('请先输入有效的邮箱地址');

        sendButton.disabled = true;
        sendButton.textContent = '发送中…';
        try {
          await window.LynliAuthAPI.sendCode(email);
          startCountdown();
          showError('');
        } catch (error) {
          // HTTP 429 must not start the local 60-second timer.
          // Re-enable immediately and show the exact backend message.
          clearInterval(countdownTimer);
          countdownTimer = null;
          setSendButtonIdle();
          showError(error.message || '验证码发送失败，请稍后重试');
        }
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        errorBox.textContent = '';
        if (!registrationOpen) return showError('当前暂未开放新用户注册');

        const email = $('email').value.trim();
        const code = $('code').value.trim();
        const password = $('password').value;
        const confirmPassword = $('confirmPassword').value;
        const inviteCode = $('inviteCode').value.trim().toUpperCase();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('请输入有效的邮箱地址');
        if (!/^\d{6}$/.test(code)) return showError('请输入 6 位邮箱验证码');
        if (password.length < 6) return showError('密码至少需要 6 位');
        if (password !== confirmPassword) return showError('两次输入的密码不一致');

        submitButton.disabled = true;
        submitButton.classList.add('is-loading');
        submitButton.querySelector('span:first-child').textContent = '正在创建账户…';
        try {
          await window.LynliAuthAPI.register({
            email: email,
            code: code,
            password: password,
            invite_code: inviteCode
          });
          // Registration creates the session directly; do not route through login.
          window.location.href = './user.html';
        } catch (error) {
          showError(error.message || '注册失败，请稍后重试');
          submitButton.disabled = false;
          submitButton.classList.remove('is-loading');
          submitButton.querySelector('span:first-child').textContent = '创建账户';
        }
      });

      loadConfig();
    })();
  </script>
</body>
</html>
