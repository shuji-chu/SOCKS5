<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>域名中心 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 20px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">免费域名中心</h1>
    </header>

    <main class="p-4">
        <!-- 头部操作区 -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="showGlobalAlert('提示', '注册新域名需要消耗解锁额度')" class="bg-blue-500 text-white rounded-xl py-3 font-bold text-sm shadow-sm flex justify-center items-center gap-1">
                <span class="text-lg leading-none">+</span> 注册新域名
            </button>
            <a href="/invite.html" class="bg-white text-blue-500 border border-blue-500 rounded-xl py-3 font-bold text-sm flex justify-center items-center gap-1 shadow-sm">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                邀请好友
            </a>
        </div>

        <!-- 解锁任务面板 -->
        <div class="bg-white rounded-xl border border-slate-100 p-4 mb-4 shadow-sm">
            <h2 class="font-bold text-slate-800 mb-3 text-sm flex items-center gap-2"><span class="w-1.5 h-3.5 bg-blue-500 rounded-full"></span>解锁免费域名额度</h2>
            <div class="space-y-3 text-sm text-slate-600">
                <div class="flex justify-between items-center">
                    <span>下 1 单 + 加入 TG 签到群</span>
                    <span class="text-xs text-green-500 bg-green-50 px-2 py-0.5 rounded">已达成 (1/1)</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>邀请 5 名真实用户绑定 TG 群</span>
                    <span class="text-xs text-blue-500 font-bold">去邀请 (2/5)</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>每消费 200 元赠送 1 个</span>
                    <span class="text-xs text-slate-400">当前进度 (¥169.81/200)</span>
                </div>
            </div>
        </div>

        <!-- 我的域名列表 -->
        <h2 class="font-bold text-slate-800 mb-3 ml-1 text-[15px] flex justify-between items-end">
            我的域名
            <span class="text-xs font-normal text-slate-400">Asia/Singapore (UTC+8)</span>
        </h2>
        
        <div class="relative mb-4">
            <input type="text" placeholder="输入域名关键字搜索" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none text-sm shadow-sm">
            <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div class="bg-white rounded-xl border border-slate-100 p-5 shadow-sm mb-3">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg></div>
                <h3 class="font-bold text-blue-600 text-[16px]">lynli.kz.ci</h3>
            </div>
            
            <div class="mb-3">
                <p class="text-xs text-slate-400 mb-1">状态</p>
                <span class="bg-green-50 text-green-600 border border-green-200 text-xs px-2 py-0.5 rounded-full inline-flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>正常</span>
            </div>

            <div class="mb-3 flex justify-between border-b border-dashed border-slate-200 pb-3">
                <div>
                    <p class="text-xs text-slate-400 mb-1">注册时间</p>
                    <p class="text-sm text-slate-700">2026-10-13 22:29</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-slate-400 mb-1">到期时间</p>
                    <p class="text-sm text-slate-700">2027-10-13 22:29</p>
                </div>
            </div>

            <div class="flex gap-3">
                <button class="w-12 h-12 border border-orange-200 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center text-xl shadow-sm">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </button>
                <a href="/domain-manage.html" class="flex-1 border border-blue-500 text-blue-500 font-bold rounded-xl flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    管理域名
                </a>
            </div>
        </div>
    </main>

    <!-- 全局自定义弹窗 -->
    <div id="custom-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative" id="custom-modal-content">
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center justify-center gap-2"><img src="/logo.jpg" class="w-5 h-5 rounded"> <span id="modal-title">提示</span></h3>
                <p id="modal-desc" class="text-sm text-slate-500 mb-6 leading-relaxed text-left bg-slate-50 p-4 rounded-lg">内容</p>
                <button onclick="closeGlobalAlert()" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm">我知道了</button>
            </div>
        </div>
    </div>
    <script>
        function showGlobalAlert(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeGlobalAlert() { document.getElementById('custom-modal').classList.remove('active'); }
    </script>
</body>
</html>
