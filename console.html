<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务查询 - TGX Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9fa] text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white px-4 py-4 sticky top-0 z-10 border-b border-gray-100 flex items-center justify-between">
        <div class="flex items-center">
            <a href="./index.html" class="text-gray-500 mr-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <h1 class="text-lg font-bold tracking-tight">控制台 / 查询</h1>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full">
        <!-- 提示卡片 -->
        <div class="bg-blue-50 text-blue-800 rounded-xl p-4 mb-6 text-sm leading-relaxed border border-blue-100">
            请在下方输入您的 <strong>订单号</strong> 或 <strong>API Key</strong> 进行查询。节点业务请前往用户中心获取订阅链接。
        </div>

        <!-- 查询表单 -->
        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">查询凭证</label>
            <div class="relative mb-4">
                <input type="text" id="query-input" placeholder="输入订单号 / 卡密 / API Key" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 text-[15px] focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition">
            </div>
            <button onclick="doQuery()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 rounded-lg transition-colors">
                立即查询
            </button>
        </div>

        <!-- 结果展示区 (默认隐藏) -->
        <div id="result-box" class="hidden bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
            <h3 class="text-sm font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">查询结果</h3>
            <div id="result-content" class="text-sm text-gray-600 break-all space-y-2">
                <!-- 动态填充 -->
            </div>
        </div>
    </main>

    <script>
        function doQuery() {
            const val = document.getElementById('query-input').value.trim();
            if (!val) return alert('请输入查询内容');
            
            const btn = event.target;
            btn.innerText = '查询中...';
            btn.disabled = true;

            // 模拟请求 (将来替换为真实的 /api/query 接口)
            setTimeout(() => {
                document.getElementById('result-box').classList.remove('hidden');
                document.getElementById('result-content').innerHTML = `
                    <div class="flex justify-between border-b border-gray-50 pb-2">
                        <span class="text-gray-500">查询状态</span>
                        <span class="font-medium text-green-600">查询成功</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-50 pb-2 pt-2">
                        <span class="text-gray-500">凭证内容</span>
                        <span class="font-mono text-gray-900">${val}</span>
                    </div>
                    <div class="pt-2">
                        <span class="text-gray-500 block mb-1">提取结果</span>
                        <div class="bg-gray-50 p-3 rounded font-mono text-xs text-gray-800">
                            tg://proxy?server=8.210.xx.xx&port=443&secret=xxxxxx
                        </div>
                    </div>
                `;
                btn.innerText = '立即查询';
                btn.disabled = false;
            }, 800);
        }
    </script>
</body>
</html>
