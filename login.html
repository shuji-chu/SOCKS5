<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <style>
        /* 纯原生 CSS，不依赖任何外网 CDN，秒开不闪烁 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; padding-bottom: 32px; }
        
        .header { text-align: center; margin-top: 24px; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }

        .card { background: #ffffff; padding: 24px; border-radius: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; width: 100%; max-width: 380px; margin: 0 auto; z-index: 10; position: relative; }
        
        .input-group { margin-bottom: 14px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; font-size: 15px; outline: none; transition: all 0.2s; color: #1e293b; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
        .btn-primary:active { background: #1d4ed8; transform: scale(0.98); }
        
        .link-text { text-align: center; margin-top: 20px; margin-bottom: 32px; }
        .link-text a { font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 500; }

        .divider { position: relative; margin-bottom: 24px; text-align: center; }
        .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid #f1f5f9; z-index: 1; }
        .divider span { position: relative; z-index: 2; background: #fff; padding: 0 12px; font-size: 11px; color: #94a3b8; letter-spacing: 1px; }

        .auth-icons { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .auth-icons button { width: 44px; height: 44px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; overflow: hidden; padding: 0; transition: transform 0.1s; }
        .auth-icons button:active { transform: scale(0.9); }
        .auth-icons button img { width: 100%; height: 100%; object-fit: cover; }

        .footer { text-align: center; margin-top: 48px; margin-bottom: 16px; }
        .footer img { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 12px; opacity: 0.4; filter: grayscale(100%); object-fit: cover; }
        .footer p.brand { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
        .footer-links { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 11px; color: #94a3b8; }
        .footer-links button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 11px; }
        .footer-links button:hover { color: #475569; }

        /* 底部弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-header h3 { font-size: 18px; font-weight: 700; color: #1e293b; }
        .modal-close { background: none; border: none; font-size: 20px; color: #94a3b8; cursor: pointer; padding: 4px; }
        .modal-body { font-size: 13px; color: #475569; line-height: 1.6; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <img src="/logo.jpg">
        <h2>欢迎回来</h2>
        <p>登录以继续使用 SOCKS5 服务</p>
    </div>

    <div class="card">
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="email" required placeholder="工作邮箱">
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder="密码">
            </div>
            <button type="submit" class="btn-primary">安全登录</button>
        </form>
        
        <div class="link-text">
            <a href="/register.html">没有账号？立即注册</a>
        </div>

        <div class="divider">
            <span>快捷授权登录</span>
        </div>

        <div class="auth-icons">
            <button onclick="window.location.href='https://t.me/gsdlvpnbot'">
                <img src="/tg.jpg">
            </button>
            <button onclick="window.location.href='https://sfw.bar/'">
                <img src="/safew.jpg">
            </button>
            <button onclick="window.location.href='https://m.mivra.im/'">
                <img src="/mivra.jpg">
            </button>
        </div>
    </div>

    <div class="footer">
        <img src="/logo.jpg">
        <p class="brand">Powered by SOCKS5 Secure</p>
        <div class="footer-links">
            <button onclick="openModal('privacy')">隐私政策</button>
            <span>|</span>
            <button onclick="openModal('terms')">用户协议</button>
            <span>|</span>
            <button onclick="openModal('about')">关于我们</button>
        </div>
    </div>

    <!-- 协议弹窗 -->
    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">标题</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-content"></div>
        </div>
    </div>

    <script>
        // 登录逻辑
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('https://api.shuji.cc.cd/s5api/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else { alert(data.message || '登录失败'); }
            } catch (err) { alert('网络错误'); }
        });

        // 协议弹窗逻辑
        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。我们致力于维持您对我们的信任，恪守以下原则保护您的个人信息：权责一致原则、目的明确原则、选择同意原则等。' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务。本协议是您与 SOCKS5 之间关于您使用本服务所订立的协议。您在使用本服务时，必须遵守相关法律法规，不得利用本服务从事任何违法违规活动。' },
            'about': { title: '关于我们', text: 'SOCKS5 致力于为您提供全球领先的虚拟资产与安全网络服务。我们拥有专业的技术团队，采用银行级加密技术保障您的每一次交易和数据传输。' }
        };

        function openModal(type) {
            const data = modalContent[type]; if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-content').innerText = data.text;
            document.getElementById('info-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('info-modal').classList.remove('active');
        }
    </script>
</body>
</html>
