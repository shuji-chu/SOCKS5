<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG 账号 - SOSKS5 Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="../../assets/logo.png"><link rel="apple-touch-icon" href="../../assets/logo.png"><link rel="stylesheet" href="/css/global-video-bg.css"></head>
<body class="bg-[#f8f9fa] text-gray-900 font-sans antialiased pb-16">
    <header class="bg-white px-4 py-4 sticky top-0 z-10 border-b border-gray-100 flex items-center">
        <a href="./index.html" class="text-gray-500 mr-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-lg font-bold">TG 账号</h1>
    </header>

    <main class="px-4 py-4">
        <div id="product-list" class="grid grid-cols-1 gap-3">
            <div class="text-center py-10 text-gray-400 text-sm">正在加载商品...</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch("https://lynli.kz.ci/api/products");
                const data = await res.json();
                let products = Array.isArray(data) ? data : (data.data || []);
                
                // 过滤出 TG 账号
                products = products.filter(p => p.category === 'TG账号' || p.title.toLowerCase().includes('tg') || p.title.toLowerCase().includes('telegram'));

                const list = document.getElementById('product-list');
                if (products.length === 0) {
                    list.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">暂无 TG 商品</div>';
                    return;
                }

                list.innerHTML = products.map(p => `
                    <a href="./product-detail.html?id=${p.id}" class="block bg-white rounded-xl border border-gray-200 p-4 active:bg-gray-50 transition">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-[15px] font-semibold text-gray-900 leading-snug line-clamp-2 pr-4">${p.title}</h3>
                            <span class="text-[11px] text-gray-400 whitespace-nowrap mt-0.5">库存 ${p.stock}</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            ${(p.tags || []).map(t => `<span class="text-[10px] bg-gray-50 text-gray-500 px-1.5 py-0.5 rounded border border-gray-100">${t}</span>`).join('')}
                        </div>
                        <div class="flex items-end justify-between mt-2 pt-3 border-t border-gray-50">
                            <div class="flex items-baseline">
                                <span class="text-[18px] font-bold text-gray-900">¥${p.price}</span>
                            </div>
                            <span class="text-[12px] font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded">立即购买</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                const list = document.getElementById('product-list'); if (list) list.innerHTML = '<div role="alert" style="max-width:560px;margin:22px auto;padding:28px 20px;text-align:center;border:1px solid rgba(71,145,220,.2);border-radius:22px;background:linear-gradient(145deg,#fff,#eef7ff);color:#334b66;box-shadow:0 16px 42px rgba(44,117,190,.12)"><img src="../../assets/icons/network.svg" alt="" aria-hidden="true" style="display:block;width:42px;height:42px;margin:0 auto 14px"><strong style="display:block;color:#0A192F;font-size:18px">商品暂时无法加载</strong><p style="color:#4a6078">商品服务暂时没有响应，请检查网络后重新加载。</p><button type="button" onclick="location.reload()" style="min-width:180px;padding:13px 20px;border:0;border-radius:12px;background:linear-gradient(110deg,#087bff,#0055d9);color:#fff;font-weight:900">重新加载</button></div>'; // Raw request details are intentionally not exposed.
            }
        });
    </script>
<script id="safe-ui-notice-policy">
(function(){
 function clean(v){return String(v??'操作未完成').replace(/Bearer\s+\S+/gi,'[凭据已隐藏]').replace(/\b(access[_-]?token|refresh[_-]?token|api[_-]?key|secret|password|authorization)\s*[:=]\s*["']?[^,\s"';&]+/gi,'$1=[凭据已隐藏]').replace(/(?:\b[0-9a-f]{1,4}:){2,}[0-9a-f:.]{1,}/gi,'[IP地址已隐藏]').replace(/https?:\/\/[^\s"'<>]+/gi,'[链接已隐藏]').replace(/\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}(?::\d+)?\b/gi,'[地址已隐藏]').replace(/\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?\b/g,'[地址已隐藏]').replace(/(?:^|\n)\s*at\s+[^\n]+/g,'').replace(/\s{2,}/g,' ').trim().slice(0,240)||'操作未完成，请稍后重试。'}
 window.safeUiMessage=clean;
 window.alert=function(message){var n=document.getElementById('safe-ui-notice');if(!n){n=document.createElement('div');n.id='safe-ui-notice';n.setAttribute('role','status');n.setAttribute('aria-live','polite');n.style.cssText='position:fixed;z-index:100001;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;border-radius:12px;background:#142b43;color:#fff;box-shadow:0 12px 36px #0005';document.body.appendChild(n)}n.textContent=clean(message);n.hidden=false;clearTimeout(window.__safeUiNoticeTimer);window.__safeUiNoticeTimer=setTimeout(function(){n.hidden=true},4200)};
 var nativeConfirm=window.confirm.bind(window);window.confirm=function(message){return nativeConfirm(clean(message))};
})();
</script>
<script src="/js/global-video-bg.js" defer></script></body>
</html>
