<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>API 文档 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="bg-white p-4 flex items-center gap-3 sticky top-0 z-50 shadow-sm">
        <a href="/api-config.html" class="text-slate-600 font-bold text-xl px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">API 对接文档</h1>
    </div>
    <div class="p-4 text-sm text-slate-600 space-y-4">
        <p><strong>接口地址：</strong> <code>https://api.lynli.me/v1</code></p>
        <p><strong>鉴权方式：</strong> 请在请求头 Headers 中携带 <code>Authorization: Bearer [你的APP Secret]</code></p>
        <p><strong>1. 获取商品列表</strong><br>GET <code>/products</code></p>
        <p><strong>2. 创建订单</strong><br>POST <code>/order/create</code><br>参数: <code>{"product_id": 1}</code></p>
        <p><strong>3. 获取订单状态</strong><br>GET <code>/order/status?id=xxxx</code></p>
    </div>
</body>
</html>
