<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在线充值 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.97); }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; font-size: 16px; outline: none; transition: border 0.2s; font-weight: bold; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; width: 100%; max-width: 340px; border-radius: 20px; padding: 24px; text-align: center; }
    </style>
</head>
<body class="pb-12">
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/console.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-[17px] font-bold text-slate-800">在线充值</h1>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto">
        <!-- 余额展示 -->
        <div class="text-center mb-8">
            <p class="text-[13px] text-slate-500 mb-1">当前账户余额 (CNY)</p>
            <p class="text-[36px] font-bold text-slate-800">¥ 120.00</p>
        </div>

        <div class="card p-5 space-y-6">
            <!-- 选择支付方式 -->
            <div>
                <label class="text-[14px] font-bold text-slate-700 mb-3 block">选择支付方式</label>
                <div class="grid grid-cols-2 gap-3">
                    <div onclick="selectPayType('alipay')" id="btn-alipay" class="border-2 border-blue-500 bg-blue-50 p-4 rounded-xl cursor-pointer text-center transition">
                        <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full mx-auto flex items-center justify-center mb-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                        </div>
                        <span class="text-[14px] font-bold text-blue-600">支付宝</span>
                    </div>
                    <div onclick="selectPayType('usdt')" id="btn-usdt" class="border border-slate-200 p-4 rounded-xl cursor-pointer text-center transition">
                        <div class="w-8 h-8 bg-slate-100 text-slate-500 rounded-full mx-auto flex items-center justify-center mb-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6h2zm0 8h-2v2h2z"/></svg>
                        </div>
                        <span class="text-[14px] font-bold text-slate-600">USDT (TRC20)</span>
                    </div>
                </div>
            </div>

            <!-- 输入金额 -->
            <div>
                <label class="text-[14px] font-bold text-slate-700 mb-2 flex justify-between">
                    <span>输入充值金额</span>
                    <span class="text-[12px] text-slate-400 font-normal">1 USDT = 8 RMB</span>
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold" id="unit-symbol">¥</span>
                    <input type="number" id="recharge-amount" class="input-flat pl-10" placeholder="最低 10 元" value="100" oninput="calcEstimate()">
                </div>
                <p class="text-[12px] text-blue-500 mt-2 text-right" id="estimate-text">预估到账: 12.50 USDT</p>
            </div>

            <!-- 快捷金额 -->
            <div class="grid grid-cols-4 gap-2">
                <button onclick="setAmount(50)" class="py-2 bg-slate-50 border border-slate-200 rounded-lg text-[13px] font-bold text-slate-600 active:bg-slate-100">50</button>
                <button onclick="setAmount(100)" class="py-2 bg-slate-50 border border-slate-200 rounded-lg text-[13px] font-bold text-slate-600 active:bg-slate-100">100</button>
                <button onclick="setAmount(500)" class="py-2 bg-slate-50 border border-slate-200 rounded-lg text-[13px] font-bold text-slate-600 active:bg-slate-100">500</button>
                <button onclick="setAmount(1000)" class="py-2 bg-slate-50 border border-slate-200 rounded-lg text-[13px] font-bold text-slate-600 active:bg-slate-100">1000</button>
            </div>

            <!-- 提交按钮 -->
            <button onclick="submitRecharge()" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl text-[16px] active:opacity-80 transition shadow-md shadow-blue-500/20 mt-4">立即充值</button>
        </div>
    </main>

    <!-- 扫码支付弹窗 -->
    <div id="pay-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[18px] font-bold text-slate-800 mb-1">扫码支付</h3>
            <p class="text-[13px] text-slate-500 mb-4" id="pay-tip">请使用支付宝扫码付款</p>
            
            <div class="w-48 h-48 bg-slate-50 mx-auto rounded-xl flex items-center justify-center mb-4 border border-slate-100">
                <img id="pay-qrcode" src="" class="w-full h-full object-contain hidden">
            </div>
            
            <p class="text-[12px] text-slate-400 mb-1">需支付金额</p>
            <p class="text-[24px] font-bold text-red-500 mb-4" id="pay-amount">¥ 100.00</p>

            <!-- USDT 地址 -->
            <div id="usdt-box" class="hidden bg-slate-50 border border-slate-200 rounded-lg p-3 mb-4 text-left">
                <p class="text-[11px] text-slate-500 mb-1">TRC20 收款地址 (长按复制)</p>
                <p class="text-[12px] font-mono text-slate-700 break-all select-all">TYu8x9ZqP3vK2mN4wL5jR6tB7cV8bA9sD0</p>
            </div>
            
            <button onclick="closeModal()" class="w-full py-3 bg-slate-100 text-slate-600 font-bold rounded-xl text-[15px]">我已完成支付</button>
        </div>
    </div>

    <script>
        let currentType = 'alipay';
        const rate = 8;

        function selectPayType(type) {
            currentType = type;
            const alipay = document.getElementById('btn-alipay');
            const usdt = document.getElementById('btn-usdt');
            const unit = document.getElementById('unit-symbol');

            if (type === 'alipay') {
                alipay.className = 'border-2 border-blue-500 bg-blue-50 p-4 rounded-xl cursor-pointer text-center transition';
                alipay.querySelector('span').className = 'text-[14px] font-bold text-blue-600';
                usdt.className = 'border border-slate-200 p-4 rounded-xl cursor-pointer text-center transition';
                usdt.querySelector('span').className = 'text-[14px] font-bold text-slate-600';
                unit.innerText = '¥';
            } else {
                usdt.className = 'border-2 border-blue-500 bg-blue-50 p-4 rounded-xl cursor-pointer text-center transition';
                usdt.querySelector('span').className = 'text-[14px] font-bold text-blue-600';
                alipay.className = 'border border-slate-200 p-4 rounded-xl cursor-pointer text-center transition';
                alipay.querySelector('span').className = 'text-[14px] font-bold text-slate-600';
                unit.innerText = '$';
            }
            calcEstimate();
        }

        function calcEstimate() {
            const val = parseFloat(document.getElementById('recharge-amount').value) || 0;
            const est = document.getElementById('estimate-text');
            if (currentType === 'alipay') {
                est.innerText = `预估到账: ${(val / rate).toFixed(2)} USDT`;
            } else {
                est.innerText = `预估到账: ${(val * rate).toFixed(2)} RMB`;
            }
        }

        function setAmount(amt) {
            document.getElementById('recharge-amount').value = amt;
            calcEstimate();
        }

        function submitRecharge() {
            const val = parseFloat(document.getElementById('recharge-amount').value) || 0;
            if (val < 10) { alert('最低充值 10 元'); return; }

            const modal = document.getElementById('pay-modal');
            const tip = document.getElementById('pay-tip');
            const amtText = document.getElementById('pay-amount');
            const qrImg = document.getElementById('pay-qrcode');
            const usdtBox = document.getElementById('usdt-box');

            if (currentType === 'alipay') {
                tip.innerText = '请使用支付宝扫码付款';
                amtText.innerText = `¥ ${val.toFixed(2)}`;
                usdtBox.classList.add('hidden');
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=alipay_mock_' + val;
            } else {
                tip.innerText = '请转账至以下 TRC20 地址';
                amtText.innerText = `${val.toFixed(2)} USDT`;
                usdtBox.classList.remove('hidden');
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TYu8x9ZqP3vK2mN4wL5jR6tB7cV8bA9sD0';
            }
            qrImg.classList.remove('hidden');
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('pay-modal').classList.remove('active');
            window.location.href = '/console.html';
        }
    </script>
<script src="/notice.js"></script>
<script src="/ai-widget.js"></script>
</body>
</html>
