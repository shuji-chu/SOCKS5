async function api(path,method='GET',body){const headers={Accept:'application/json','Content-Type':'application/json'};if(token())headers.Authorization='Bearer '+token();let r;try{r=await fetch(API_V1+path,{method,headers,signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined,...(body!==undefined?{body:JSON.stringify(body)}:{})})}catch(e){throw Error(e.name==='TimeoutError'||e.name==='AbortError'?'请求超时，请检查网络后重试':'网络连接失败，请检查网络后重试')}let d;try{d=await r.json()}catch{throw Error('服务端返回的 JSON 格式不正确，请稍后重试')}const hs=d&&d.http_status!==undefined?Number(d.http_status):null;if(!r.ok||hs!==null&&hs!==200||d?.success===false||d?.status==='fail'||d?.error)throw Error(d?.message||d?.msg||d?.detail||d?.error||('HTTP '+(hs!==null&&hs!==200?hs:r.status)));return d}
function categoryOf(p,source){const raw=String(p.category||p.product_type||p.product_category||p.type||p.kind||p.tag||'').toLowerCase();if(/traffic|flow|引流|流量包|traffic_pack/.test(raw)||source==='traffic')return '流量包';if(/node|proxy|vpn|节点|线路|订阅|vless|vmess|trojan|hysteria/.test(raw)||source==='node')return '节点';if(/account|账号|帐号|chatgpt|telegram|google/.test(raw)||source==='account')return '账号';return p.category||p.product_type||'其他'}

function markdown(md){const lines=String(md||'暂无教程内容').split(String.fromCharCode(10));let out='',listOpen=false;for(const raw of lines){const line=raw.trim();if(!line){if(listOpen){out+='</ul>';listOpen=false}out+='<p></p>';continue}let level=0;while(level<6&&line[level]==='#')level++;if(level>0&&line[level]===' '){if(listOpen){out+='</ul>';listOpen=false}out+='<h'+level+'>'+inlineMd(line.slice(level+1))+'</h'+level+'>';continue}if(line.startsWith('- ')||line.startsWith('* ')){if(!listOpen){out+='<ul>';listOpen=true}out+='<li>'+inlineMd(line.slice(2))+'</li>';continue}if(listOpen){out+='</ul>';listOpen=false}out+='<p>'+inlineMd(line)+'</p>'}if(listOpen)out+='</ul>';return '<div class="markdown">'+out+'</div>'}

function protocolBadges(p){if(!p||p._kind!=='节点')return '';const items=[['VLESS','vless','#55e8ff'],['VMess','vmess','#a78bfa'],['Trojan','trojan','#fb7185'],['Hysteria2','hysteria2','#fbbf24'],['Shadowsocks','shadowsocks','#5be2b1']];return '<div class="protocol-badges" aria-label="支持协议">'+items.map(([name,key,color])=>'<span class="protocol-badge" style="--protocol-color:'+color+'"><img src="./assets/icons/protocol-'+key+'.svg" alt="" aria-hidden="true">'+name+'</span>').join('')+'</div>'}

function renderProducts(){const root=document.getElementById('products');const rows=liveProducts.filter(p=>(activeKind==='全部'||p._kind===activeKind)&&(p._title+' '+p._desc+' '+p._kind+' '+(p.tags||'')+' '+(p.protocol||'')).toLowerCase().includes(searchTerm.toLowerCase()));document.getElementById('resultCount').textContent='共 '+rows.length+' 件商品';if(!rows.length){root.innerHTML=liveProducts.length?'<div class="empty-space"><div><div style="font-size:32px;color:var(--cyan);margin-bottom:8px">⌕</div><b>没有匹配的商品</b><p>试试其他关键词或分类。</p><button class="btn" onclick="document.getElementById(\'globalSearch\').value=\'\';searchTerm=\'\';activeKind=\'全部\';document.querySelectorAll(\'[data-kind]\').forEach(x=>x.className=x.dataset.kind===\'全部\'?\'btn primary\':\'btn ghost\');renderProducts()">清除筛选</button></div></div>':'<div class="empty-space"><div><div class="planet"></div><b style="font-size:18px;color:#eaf8ff">暂无商品</b><p>深空目录暂时没有可展示的商品，请稍后刷新。</p><button class="btn" onclick="loadCatalogs()">重新加载</button></div></div>';return}root.innerHTML=rows.map(p=>'<article class="card product-card" tabindex="0" role="button" aria-label="查看'+escHtml(p._title)+'" onclick="openDetail(\''+escHtml(p._key)+'\')"><div class="cover">'+productImage(p)+'<span class="pill" style="position:absolute;left:12px;top:12px;z-index:1">'+escHtml(p._kind)+'</span></div><div class="product-body"><div class="muted" style="font-size:11px">'+escHtml(p.vendor||p.brand||p.source||p._source.toUpperCase())+'</div><h3>'+escHtml(p._title)+'</h3>'+protocolBadges(p)+'<div class="price">¥'+p._price.toFixed(2)+'</div><div class="product-meta"><span>销量 '+escHtml(p._sales??'—')+'</span><span>库存 '+escHtml(p._stock??'—')+'</span></div><button class="btn primary" style="width:100%" onclick="event.stopPropagation();openDetail(\''+escHtml(p._key)+'\')">查看详情 ↗</button></div></article>').join('')}
async function loadCatalogs(){const root=document.getElementById('products');root.setAttribute('aria-busy','true');root.innerHTML=Array.from({length:6},()=>'<div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:62%"></div><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:78%;height:34px"></div></div>').join('');document.getElementById('networkError').hidden=true;try{const results=await Promise.all(STATIC_CATALOGS.map(async c=>{let r;try{r=await fetch(c.url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined})}catch(e){throw Error(e.name==='TimeoutError'||e.name==='AbortError'?'请求超时，请检查网络后重试':'网络连接失败，请检查网络后重试')}if(!r.ok)throw Error('商品目录请求失败（HTTP '+r.status+'）');let d;try{d=await r.json()}catch{throw Error('商品目录返回的 JSON 格式不正确')}const list=listify(d);if(!Array.isArray(list))throw Error('商品目录数据格式不正确');return list.map((p,i)=>{if(!p||typeof p!=='object'||Array.isArray(p))throw Error('商品目录包含无效数据');return normalize(p,i,c.source)})}));liveProducts=results.flat();renderProducts()}catch(e){
const demoRows=[
{id:'demo-node-01',name:'星际轻量节点 · 月度预览',category:'节点',description:'演示商品：展示节点商品卡片、详情弹窗与套餐布局。非真实服务，不会创建订单。',price_yuan:19.9,stock:'演示',sales:'—',protocol:'VLESS',protocols:['VLESS','VMess','Trojan','Hysteria2','Shadowsocks'],icon:'✦',tutorial:'## 演示说明\n- 此商品仅用于预览界面\n- 不提供真实节点或连接配置',notice:'演示数据，不可购买'},
{id:'demo-node-02',name:'全球高速线路 · 体验预览',category:'节点',description:'演示商品：用于检查手机端商品卡片与详情交互。',price_yuan:29.9,stock:'演示',sales:'—',protocol:'Hysteria2',protocols:['VLESS','VMess','Trojan','Hysteria2','Shadowsocks'],icon:'◈',tutorial:'## 使用说明\n此为 UI 演示内容，不包含真实订阅。',notice:'演示数据，不可购买'},
{id:'demo-account-01',name:'数字账号权益 · 预览版',category:'账号',description:'演示商品：账号商品版式预览，不包含账号凭据或实际权益。',price_yuan:9.9,stock:'演示',sales:'—',icon:'◎',tutorial:'## 注意\n请勿将演示商品视为真实可售商品。',notice:'演示数据，不可购买'},
{id:'demo-account-02',name:'会员工具包 · 界面预览',category:'账号',description:'演示商品：用于检查搜索、分类和详情弹窗。',price_yuan:15,stock:'演示',sales:'—',icon:'⌘',tutorial:'仅用于界面测试。',notice:'演示数据，不可购买'}
];
liveProducts=demoRows.map((p,i)=>({...normalize(p,i,p.category==='节点'?'node':'account'),_demo:true}));
let banner=document.getElementById('demoCatalogBanner');if(!banner){banner=document.createElement('div');banner.id='demoCatalogBanner';banner.className='panel';banner.style.cssText='margin:0 0 16px;border-color:rgba(255,210,124,.45);color:#ffd27c';banner.textContent='演示模式 · 当前目录来自本地示例数据，仅用于视觉与交互预览；不代表真实库存、价格或服务状态。';root.parentElement.insertBefore(banner,root)}
renderProducts();document.getElementById('resultCount').textContent='演示目录 · '+liveProducts.length+' 件';document.getElementById('networkError').hidden=true;
}finally{root.removeAttribute('aria-busy')}}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{activeKind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.className='btn ghost');b.className='btn primary';renderProducts()}));
document.getElementById('globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.trim();renderProducts()});
function nodeConfigPanel(p){if(!p||p._kind!=='节点')return '';const base=Number(p._price)||0;const rows=[['VLESS','vless',p.vless_price??p.price_vless??base],['Trojan','trojan',p.trojan_price??p.price_trojan??base*1.08],['Hysteria2','hysteria2',p.hysteria2_price??p.price_hysteria2??base*1.15]];return '<section class="node-config-panel"><div class="archive-head"><div><div class="eyebrow">PROTOCOL CONFIGURATION</div><h4>协议与接入配置</h4></div><span class="archive-stamp">可选配置</span></div><div class="protocol-price-grid">'+rows.map(([name,key,price])=>'<div class="protocol-price"><img src="./assets/icons/protocol-'+key+'.svg" alt="" aria-hidden="true"><span>'+name+'</span><b>¥'+Number(price).toFixed(2)+'</b><small>'+(p[key+'_price']!=null||p['price_'+key]!=null?'目录价格':'展示参考价')+'</small></div>').join('')+'</div><div class="field"><label for="nodeProtocol">选择接入协议</label><select class="input" id="nodeProtocol">'+rows.map(([name,key])=>'<option value="'+key+'">'+name+'</option>').join('')+'</select></div><div class="field"><label>接入方式</label><div class="access-choice"><label><input type="radio" name="nodeAccessMode" value="domain" checked> 绑定专属域名</label><label><input type="radio" name="nodeAccessMode" value="ip"> 使用独立 IP</label></div></div><div class="field" id="nodeDomainField"><label for="nodeDomain">专属域名</label><input class="input" id="nodeDomain" placeholder="例如 node.example.com" autocomplete="off"></div><div class="field" id="nodeIpField" hidden><label for="nodeIp">独立 IP</label><input class="input" id="nodeIp" placeholder="输入已分配的独立 IP" inputmode="url" autocomplete="off"></div><p class="archive-note">接入配置将在创建订单时提交；域名或 IP 的实际可用性由服务端校验。</p></section>'}function mockArchive(p){if(p._kind!=='账号')return '';const seed=String(p._key||p._title).split('').reduce((a,ch)=>a+ch.charCodeAt(0),0);const years=[2019,2020,2021,2022];const regions=['全球','北美','欧洲','亚太'];const year=years[seed%years.length],region=regions[Math.floor(seed/7)%regions.length];const id='CAT-'+String(seed).padStart(5,'0')+'-DEMO';return '<section class="archive-panel"><div class="archive-head"><div><div class="eyebrow">CATALOG DOSSIER · MOCK</div><h4>数字资产档案</h4></div><span class="archive-stamp">演示数据</span></div><div class="archive-grid"><div class="archive-item"><span>商品档案编号</span><b>'+id+'</b></div><div class="archive-item"><span>建档年份</span><b>'+year+' 年</b></div><div class="archive-item"><span>服务地区</span><b>'+regions[Math.floor(seed/7)%regions.length]+'</b></div><div class="archive-item"><span>交付方式</span><b>平台订单交付</b></div><div class="archive-item"><span>售后保障</span><b>按商品规则执行</b></div><div class="archive-item"><span>记录状态</span><b class="archive-ok">演示档案 · 未连接实物数据</b></div></div><p class="archive-note">本参数面板为前端 Mock 展示，不代表真实账号属性或可交付状态。</p></section>'}
function openDetail(key){const p=liveProducts.find(x=>x._key===key);if(!p)return;document.getElementById('detailTitle').textContent=p._title;document.getElementById('detailContent').innerHTML='<div class="cover" style="border-radius:14px;margin:16px 0;height:200px">'+productImage(p)+'</div><div class="price">¥'+p._price.toFixed(2)+'</div><p>'+escHtml(p._desc||'暂无详细介绍')+'</p>'+protocolBadges(p)+nodeConfigPanel(p)+mockArchive(p)+'<div class="panel" style="margin:12px 0"><b>使用教程</b>'+markdown(p._tutorial)+'<b>注意事项</b><p class="muted">'+escHtml(p._notice||'请以商品详情与服务条款为准。')+'</p><div class="product-meta"><span>销量 '+escHtml(p._sales??'—')+'</span><span>库存 '+escHtml(p._stock??'—')+'</span></div></div><button class="btn primary" id="buyNow" style="width:100%">立即购买</button>';document.getElementById('buyNow').onclick=()=>purchase(p);document.getElementById('detailModal').classList.add('show')}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
async function loadPayments(){try{const d=unpack(await api('/config'));const src=d.payment_methods||d.payments||d.payment||d.pay_method||d.methods||[];paymentMethods=(Array.isArray(src)?src:Object.keys(src||{}).map(k=>typeof src[k]==='object'?{key:k,...src[k]}:{key:k,value:src[k]})).map(x=>typeof x==='string'?{value:x,label:x}:{value:x.value??x.code??x.id??x.key??x.name,label:x.label??x.title??x.name??x.key??x.value}).filter(x=>x.value!=null)}catch(e){paymentMethods=[]}}
async function purchase(p){if(p&&p._demo){toast('演示商品不可购买；请连接真实目录后再试');return}if(!token()){toast('请先登录后再购买');location.href='./login.html?redirect='+encodeURIComponent('./shop.html');return}if(!paymentMethods.length)await loadPayments();if(!paymentMethods.length){toast('暂时无法读取服务器支付方式');return}const root=document.getElementById('detailContent');root.insertAdjacentHTML('beforeend','<div class="field" id="payChoice"><label>支付方式</label><select class="input" id="payMethod">'+paymentMethods.map((m,i)=>'<option value="'+i+'">'+escHtml(m.label)+'</option>').join('')+'</select></div><div class="field"><label>套餐周期</label><select class="input" id="payPeriod">'+periodOptionsFor(p).map(x=>'<option value="'+escHtml(x.value)+'">'+escHtml(x.label)+' · ¥'+(x.price/100).toFixed(2)+'</option>').join('')+'</select></div><button class="btn primary" id="createOrderBtn" style="width:100%">创建订单并获取支付</button>');const b=document.getElementById('createOrderBtn');b.onclick=async()=>{b.disabled=true;b.textContent='正在创建订单…';try{const method=paymentMethods[Number(document.getElementById('payMethod').value)];const nodeProtocol=document.getElementById('nodeProtocol')?.value||p.protocol||p.node_protocol||'';const accessMode=document.querySelector('input[name="nodeAccessMode"]:checked')?.value||'';const accessValue=accessMode==='domain'?document.getElementById('nodeDomain')?.value.trim()||'':accessMode==='ip'?document.getElementById('nodeIp')?.value.trim()||'':'';if(p._kind==='节点'&&!accessValue){toast(accessMode==='domain'?'请填写专属域名':'请填写独立 IP');b.disabled=false;b.textContent='创建订单并获取支付';return}const order=unpack(await api('/user/order/save','POST',{plan_id:p.id??p.product_id??p.uuid,period:document.getElementById('payPeriod').value,payment:method.value,protocol:nodeProtocol,access_mode:accessMode,custom_domain:accessMode==='domain'?accessValue:'',dedicated_ip:accessMode==='ip'?accessValue:''}));const trade=typeof order==='string'?order:order.trade_no||order.tradeNo||order.order_no||order.orderNo;if(!trade)throw Error(order.message||order.msg||'订单接口未返回订单号');b.textContent='正在获取支付二维码…';const pay=unpack(await api('/user/order/checkout','POST',{trade_no:trade}));const payUrl=typeof pay==='string'?pay:pay.pay_url||pay.payment_url||pay.checkout_url||pay.url||'';const qr=pay.qrcode||pay.qr_code||pay.qrCode||pay.qr_url||'';document.getElementById('detailContent').innerHTML='<div class="panel"><b>订单已创建</b><p>订单号：'+escHtml(trade)+'</p>'+(qr&&/^https?:\/\//i.test(qr)?'<img src="'+escHtml(qr)+'" alt="支付二维码" style="display:block;width:220px;height:220px;object-fit:contain;background:white;padding:8px;border-radius:12px;margin:16px auto">':'')+(qr&&!/^https?:\/\//i.test(qr)?'<div id="payQr" style="width:220px;height:220px;background:white;padding:8px;margin:16px auto;border-radius:12px"></div>':'')+(payUrl?'<a class="btn primary" style="display:block;text-align:center" href="'+escHtml(payUrl)+'" target="_blank" rel="noopener noreferrer">打开支付页面</a>':'')+'<p class="muted">支付状态以服务端订单记录为准。</p></div>';if(qr&&!/^https?:\/\//i.test(qr)&&window.QRCode)new QRCode(document.getElementById('payQr'),{text:String(qr),width:204,height:204});else if(qr&&!/^https?:\/\//i.test(qr))document.getElementById('payQr').textContent=String(qr)}catch(e){toast(e.message||'创建订单失败');b.disabled=false;b.textContent='重试'}}}
function periodOptionsFor(p){const keys=[['month_price','月付'],['quarter_price','季付'],['half_year_price','半年付'],['year_price','年付'],['two_year_price','两年付'],['three_year_price','三年付'],['onetime_price','一次性'],['reset_price','流量重置']];const out=keys.filter(([k])=>p[k]!=null&&p[k]!==''&&Number(p[k])>=0).map(([k,l])=>({value:k,label:l,price:Number(p[k])}));if(!out.length)out.push({value:p.period||'month_price',label:'默认套餐',price:Number(p.price??p.amount??0)});return out}
document.addEventListener('change',e=>{if(e.target&&e.target.name==='nodeAccessMode'){const domain=document.getElementById('nodeDomainField'),ip=document.getElementById('nodeIpField');if(domain&&ip){domain.hidden=e.target.value!=='domain';ip.hidden=e.target.value!=='ip'}}});setTimeout(()=>{loadCatalogs();loadPayments()},0);
