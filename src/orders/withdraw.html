<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>佣金提现 - SOCKS5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
    .affiliate-primary{background:linear-gradient(110deg,#087bff,#0055ff 58%,#1746c8)!important;color:#fff!important;border:0!important;box-shadow:0 9px 22px rgba(0,85,255,.2)}
    </style>
    <link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="../../assets/logo.png"><link rel="apple-touch-icon" href="../../assets/logo.png"><link rel="stylesheet" href="../../css/global-video-bg.css"></head>
<body class="pb-12 bg-[#f8f9fa]">
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <button onclick="window.history.back()" class="text-slate-600 text-xl font-bold px-2">←</button>
        <h1 class="text-[17px] font-bold text-slate-800">佣金提现</h1>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto">
        <section class="card p-6 text-center" role="status" aria-live="polite">
            <p class="text-[18px] font-bold text-slate-800 mb-3">提现服务暂未开放</p>
            <p class="text-[13px] text-slate-500 leading-relaxed mb-4">提现服务端接口尚未接入。为避免误导或收集无法处理的收款资料，当前不接受提现申请，也不展示未经核实的最低额度或到账时效。</p>
            <a href="./commission.html" class="affiliate-primary inline-block px-5 py-3 font-bold rounded-lg text-[14px]">返回返佣中心</a>
        </section>
    </main>ain>

    <!-- 提示弹窗 -->
    <script>
        let currentType = 'alipay';
        
        function switchTab(type) {
            currentType = type;
            const tabAlipay = document.getElementById('tab-alipay');
            const tabUsdt = document.getElementById('tab-usdt');
            const formAlipay = document.getElementById('form-alipay');
            const formUsdt = document.getElementById('form-usdt');

            if (type === 'alipay') {
                tabAlipay.className = 'border-2 border-blue-500 bg-gray-50 text-black font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                tabUsdt.className = 'border border-gray-200 text-slate-600 font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                formAlipay.classList.remove('hidden');
                formUsdt.classList.add('hidden');
            } else {
                tabUsdt.className = 'border-2 border-blue-500 bg-gray-50 text-black font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                tabAlipay.className = 'border border-gray-200 text-slate-600 font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                formUsdt.classList.remove('hidden');
                formAlipay.classList.add('hidden');
            }
        }

        function submitWithdraw() {
            alert('提现提交接口尚未配置，未提交申请；请联系管理员完成后端接入。');
        }
    </script>

<script src="../js/affiliate-pages.js"></script>
<script src="../js/ai-widget.js"></script>

<script src="../js/notice.js"></script>
<script src="../../js/global-video-bg.js" defer></script></body>
</html>
