<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 / 注册 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.08); }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
        
        /* 磨砂弹窗通用 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; transform: scale(0.95); transition: transform 0.2s; opacity: 0; text-align: left; }
        .modal-overlay.active .modal-box { transform: scale(1); opacity: 1; }

        /* 协议长文本样式 */
        .legal-content { max-height: 50vh; overflow-y: auto; font-size: 13px; color: #475569; line-height: 1.7; padding-right: 4px; }
        .legal-content h4 { color: #1e293b; font-weight: bold; margin: 12px 0 4px 0; font-size: 14px; }
        .legal-content p { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card text-center relative overflow-hidden">
        <!-- 品牌 Logo 占位 -->
        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-5 shadow-lg shadow-blue-500/30">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        
        <h1 class="text-[24px] font-extrabold text-slate-800 mb-1">SOCKS5 平台</h1>
        <p class="text-[13px] text-slate-500 mb-8" id="page-subtitle">登录您的账号以继续</p>

        <!-- 登录/注册切换 Tab -->
        <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-[14px] font-bold bg-white text-blue-600 rounded-lg shadow-sm transition-all">登录</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all">注册</button>
        </div>

        <!-- 表单区 -->
        <div class="space-y-4 mb-6 text-left">
            <div>
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">邮箱地址</label>
                <input type="email" id="auth-email" class="input-flat" placeholder="请输入邮箱" value="boss@lynli.me">
            </div>
            
            <!-- 注册时才显示的验证码输入框 -->
            <div id="code-box" class="hidden">
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">邮箱验证码</label>
                <div class="flex gap-2">
                    <input type="text" id="auth-code" class="input-flat flex-1" placeholder="6位数字验证码">
                    <button onclick="sendCode()" id="btn-send-code" class="px-4 bg-slate-100 text-slate-600 text-[13px] font-bold rounded-xl whitespace-nowrap active:bg-slate-200 transition">获取验证码</button>
                </div>
            </div>

            <div>
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">密码</label>
                <input type="password" id="auth-pass" class="input-flat" placeholder="请输入密码" value="123456">
            </div>
            
            <div class="flex justify-between items-center text-[12px]">
                <label class="flex items-center gap-1.5 text-slate-500 cursor-pointer">
                    <input type="checkbox" checked class="w-3.5 h-3.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    记住我
                </label>
                <a href="#" class="text-blue-600 active:opacity-60">忘记密码？</a>
            </div>
        </div>

        <button onclick="doAuth()" id="btn-submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl text-[16px] active:opacity-80 transition shadow-md shadow-blue-500/20 mb-6">立即登录</button>

        <!-- 底部合规协议 (删除了第三方登录) -->
        <div class="mt-8 text-center">
            <p class="text-[11px] text-slate-400">
                登录或注册即表示同意 
                <span onclick="openLegal('agreement')" class="text-blue-600 font-bold cursor-pointer active:opacity-60">用户协议</span> 
                与 
                <span onclick="openLegal('privacy')" class="text-blue-600 font-bold cursor-pointer active:opacity-60">隐私政策</span>
            </p>
        </div>
    </div>

    <!-- 报错提示弹窗 -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-box text-center">
            <h3 class="text-[17px] font-bold text-slate-800 mb-2" id="error-title">提示</h3>
            <p class="text-[14px] text-slate-500 mb-6" id="error-msg">请输入账号和密码。</p>
            <button onclick="closeModal('error-modal')" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl active:opacity-80 transition-colors">我知道了</button>
        </div>
    </div>

    <!-- 协议与隐私弹窗 -->
    <div id="legal-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[17px] font-bold text-slate-800 mb-3 text-center" id="legal-title">用户协议</h3>
            <div class="legal-content" id="legal-body"></div>
            <button onclick="closeModal('legal-modal')" class="mt-5 w-full py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl active:bg-slate-200 transition-colors">我已阅读并知晓</button>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const subtitle = document.getElementById('page-subtitle');
            const codeBox = document.getElementById('code-box');
            const btnSubmit = document.getElementById('btn-submit');

            if (mode === 'login') {
                tabLogin.className = 'flex-1 py-2 text-[14px] font-bold bg-white text-blue-600 rounded-lg shadow-sm transition-all';
                tabRegister.className = 'flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all';
                subtitle.innerText = '登录您的账号以继续';
                codeBox.classList.add('hidden');
                btnSubmit.innerText = '立即登录';
            } else {
                tabRegister.className = 'flex-1 py-2 text-[14px] font-bold bg-white text-blue-600 rounded-lg shadow-sm transition-all';
                tabLogin.className = 'flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all';
                subtitle.innerText = '注册一个全新的账号';
                codeBox.classList.remove('hidden');
                btnSubmit.innerText = '立即注册';
            }
        }

        function sendCode() {
            const email = document.getElementById('auth-email').value;
            if(!email) { showError('请先输入邮箱地址'); return; }
            const btn = document.getElementById('btn-send-code');
            btn.disabled = true;
            let count = 60;
            btn.innerText = `${count}s 后重发`;
            const timer = setInterval(() => {
                count--;
                if(count <= 0) {
                    clearInterval(timer);
                    btn.innerText = '获取验证码';
                    btn.disabled = false;
                } else {
                    btn.innerText = `${count}s 后重发`;
                }
            }, 1000);
        }

        function doAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            
            if(!email || !pass) { showError('请输入完整的邮箱和密码'); return; }

            if (currentMode === 'register') {
                const code = document.getElementById('auth-code').value;
                if(!code) { showError('请输入验证码'); return; }
                localStorage.setItem('user_id', '1000' + Math.floor(Math.random()*100));
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_role', 'user');
                window.location.href = '/profile.html';
            } else {
                // 纯前端演示：统一当普通用户处理，真实权限由后端校验
                localStorage.setItem('user_id', '10002');
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_role', 'user');
                window.location.href = '/profile.html';
            }
        }

        function showError(msg) {
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-modal').classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ================= 长文本协议内容 =================
        const legalData = {
            agreement: {
                title: '用户服务协议',
                content: `
                    <h4>一、总则</h4>
                    <p>1.1 本协议是您与 SOCKS5 平台（以下简称“本平台”）之间就注册、登录及使用本平台各项服务所订立的协议。</p>
                    <p>1.2 您在注册或使用本平台服务前，应认真阅读本协议全部内容。您点击“同意”或实际使用本平台服务，即视为您已充分理解并同意本协议的全部条款。</p>
                    
                    <h4>二、账号注册与安全</h4>
                    <p>2.1 您在注册时应提供真实、准确、完整的个人或企业信息，并在信息变更时及时更新。</p>
                    <p>2.2 您的账号所有权归本平台所有，您仅享有使用权。未经本平台同意，禁止以任何形式赠与、借用、出租、转让或售卖账号。</p>
                    <p>2.3 您应妥善保管账号及密码，因您保管不善造成的任何损失或法律责任，由您自行承担。如发现账号被非法使用，请立即通知本平台。</p>

                    <h4>三、服务内容与规范</h4>
                    <p>3.1 本平台提供包括但不限于数字资产分发、数据接口调用、代理网络服务等。具体服务以平台实际提供为准。</p>
                    <p>3.2 您承诺在使用本平台服务时，严格遵守所在国家/地区的法律法规，不得利用本平台从事任何违法违规活动，包括但不限于：电信诈骗、洗钱、黑客攻击、侵犯他人隐私、恶意爬虫等。</p>
                    <p>3.3 若您违反上述规定，本平台有权立即封禁您的账号、收回相关资源（如域名、节点），并保留移交司法机关的权利，且不予退款。</p>

                    <h4>四、知识产权</h4>
                    <p>4.1 本平台所有的产品、技术、软件、程序、页面设计等知识产权均归本平台所有。</p>
                    <p>4.2 未经本平台书面许可，任何人不得擅自复制、修改、传播或用于商业用途。</p>

                    <h4>五、免责声明</h4>
                    <p>5.1 因不可抗力、黑客攻击、网络故障、政策调整等非本平台可控原因导致的服务中断或数据丢失，本平台不承担任何法律责任。</p>
                    <p>5.2 本平台不对您使用第三方服务（如支付通道、上游接码商）产生的纠纷承担责任。</p>

                    <h4>六、协议修改与终止</h4>
                    <p>6.1 本平台有权根据业务发展需要不时修改本协议，修改后的协议将在平台上公布。</p>
                    <p>6.2 若您不同意修改后的协议，应立即停止使用本平台服务。继续使用则视为接受修改后的协议。</p>
                `
            },
            privacy: {
                title: '隐私政策',
                content: `
                    <h4>一、引言</h4>
                    <p>SOCKS5 平台（以下简称“我们”）深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。我们致力于维持您对我们的信任，恪守以下原则保护您的个人信息：权责一致原则、目的明确原则、选择同意原则、最少够用原则、确保安全原则、主体参与原则、公开透明原则等。</p>
                    
                    <h4>二、我们如何收集和使用您的信息</h4>
                    <p>2.1 <b>账号信息：</b>当您注册时，我们会收集您的邮箱地址、密码（加密存储）、注册IP等，用于创建账号及保障账号安全。</p>
                    <p>2.2 <b>业务日志：</b>当您使用 API 接口、节点代理或接码服务时，我们会记录您的调用时间、请求参数、返回状态及 IP 地址。这些数据用于计费、故障排查及防欺诈风控。</p>
                    <p>2.3 <b>资金流水：</b>当您进行充值或提现时，我们会记录您的交易订单号、金额及第三方支付渠道返回的流水号，以保障资金安全及核对。</p>

                    <h4>三、我们如何共享、转让、公开披露您的信息</h4>
                    <p>3.1 <b>共享：</b>我们不会向任何第三方共享您的个人信息，除非获得您的明确同意，或为完成支付必须向支付机构传递必要信息。</p>
                    <p>3.2 <b>披露：</b>根据法律法规规定，或应行政、司法机关的合法要求，我们将依法提供您的相关信息。</p>

                    <h4>四、我们如何保护您的信息</h4>
                    <p>4.1 我们采用符合业界标准的安全防护措施，包括建立严格的内部数据访问权限、使用 HTTPS 加密传输协议、密码单向哈希加盐存储等。</p>
                    <p>4.2 尽管有上述安全措施，但请注意在信息网络上不存在“完善的安全措施”。我们将尽力确保您的信息安全性。</p>

                    <h4>五、您的权利</h4>
                    <p>5.1 您有权随时访问、修改您在平台的个人资料。</p>
                    <p>5.2 您有权要求注销账号。注销后，我们将删除您的个人信息，但法律法规要求保留的交易记录、反洗钱数据除外。</p>

                    <h4>六、未成年人保护</h4>
                    <p>本平台服务仅面向 18 周岁以上的成年人。若您为未成年人，请在监护人的陪同下阅读本政策，并确保在取得监护人同意后使用本平台服务。</p>

                    <h4>七、联系我们</h4>
                    <p>如您对本隐私政策有任何疑问、意见或建议，请通过官方 TG 客服或邮箱 boss@lynli.me 与我们联系。</p>
                `
            }
        };

        function openLegal(type) {
            const data = legalData[type];
            document.getElementById('legal-title').innerText = data.title;
            document.getElementById('legal-body').innerHTML = data.content;
            document.getElementById('legal-modal').classList.add('active');
        }
    </script>
<script src="/notice.js"></script>
</body>
</html>
