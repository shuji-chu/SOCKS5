<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/style.css?v=25">
</head>
<body class="bg-slate-50 flex flex-col justify-between min-h-screen p-6 pb-4 relative overflow-hidden">
    
    <div class="text-center mt-10 mb-8">
        <img src="/logo.jpg" class="w-16 h-16 rounded-[1.25rem] mx-auto mb-4 object-cover shadow-sm border border-slate-200">
        <h2 class="text-[22px] font-bold text-slate-900 tracking-tight">欢迎回来</h2>
        <p class="text-[13px] text-slate-500 mt-1.5">登录以继续使用 SOCKS5 服务</p>
    </div>

    <!-- 核心登录面板 -->
    <div class="max-w-sm w-full mx-auto bg-white p-6 md:p-8 rounded-[2rem] card-shadow border border-slate-100 z-10 relative">
        
        <!-- 邮箱密码登录 -->
        <form id="login-form" class="space-y-3.5">
            <input type="email" id="email" required placeholder="工作邮箱" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-[15px] transition-all">
            <input type="password" id="password" required placeholder="密码" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-[15px] transition-all">
            <button type="submit" class="btn-primary w-full py-3.5 rounded-2xl font-bold text-[15px] mt-2">安全登录</button>
        </form>
        
        <div class="text-center mt-5 mb-8">
            <a href="/register.html" class="text-[13px] font-medium text-blue-600 hover:text-blue-700">没有账号？立即注册</a>
        </div>

        <!-- 底部：官方原版图标快捷登录 -->
        <div class="relative mb-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
            <div class="relative flex justify-center text-[11px]"><span class="px-3 bg-white text-slate-400 tracking-wider">快捷授权登录</span></div>
        </div>

        <div class="flex items-center justify-center gap-6">
            <!-- Telegram 官方图标 -->
            <button onclick="handlePlatformLogin('tg')" class="w-14 h-14 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90 overflow-hidden">
                <!-- 如果你还没准备 tg.png，会显示裂图。请务必放入图片 -->
                <img src="/tg.png" class="w-9 h-9 object-contain">
            </button>

            <!-- SafeW 官方图标 (你发的第二张图) -->
            <button onclick="handlePlatformLogin('safew')" class="w-14 h-14 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90 overflow-hidden">
                <img src="/safew.png" class="w-9 h-9 object-contain">
            </button>

            <!-- Mivra 官方图标 (你发的第一张图) -->
            <button onclick="handlePlatformLogin('mivra')" class="w-14 h-14 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90 overflow-hidden">
                <img src="/mivra.png" class="w-9 h-9 object-contain">
            </button>
        </div>
    </div>

    <!-- 底部 Logo 标识与协议链接 -->
    <div class="text-center mt-8 mb-4 flex flex-col items-center justify-center z-10 relative">
        <img src="/logo.jpg" class="w-7 h-7 rounded-lg mb-3 grayscale opacity-40 object-cover">
        <p class="text-[10px] font-semibold text-slate-400 tracking-widest uppercase mb-4">Powered by SOCKS5 Secure</p>
        
        <div class="flex items-center justify-center gap-3 text-[11px] text-slate-400">
            <button onclick="openModal('privacy')" class="hover:text-slate-600 transition-colors">隐私政策</button>
            <span class="text-slate-300">|</span>
            <button onclick="openModal('terms')" class="hover:text-slate-600 transition-colors">用户协议</button>
            <span class="text-slate-300">|</span>
            <button onclick="openModal('about')" class="hover:text-slate-600 transition-colors">关于我们</button>
        </div>
    </div>

    <!-- 弹窗遮罩与内容区 (默认隐藏) -->
    <div id="info-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-end justify-center" style="backdrop-filter: blur(4px);">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 pb-10 relative max-h-[80vh] flex flex-col" style="animation: slideUp 0.3s ease-out;">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800" id="modal-title">标题</h3>
                <button onclick="closeModal()" class="text-slate-400 p-2 hover:text-slate-700">✕</button>
            </div>
            <div class="overflow-y-auto text-[13px] text-slate-600 leading-relaxed space-y-3 pr-2" id="modal-content"></div>
        </div>
    </div>

    <style>@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }</style>
    <script src="/app.js?v=25"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else { alert(data.message || '登录失败'); }
            } catch (err) { alert('网络错误'); }
        });

        function handlePlatformLogin(platform) {
            if (platform === 'mivra') { window.location.href = 'https://m.mivra.im/'; } 
            else if (platform === 'safew') { window.location.href = 'https://sfw.bar/'; } 
            else { alert('请前往 Telegram 机器人内点击专属按钮打开，或使用邮箱登录。'); }
        }

        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。我们致力于维持您对我们的信任，恪守以下原则保护您的个人信息：权责一致原则、目的明确原则、选择同意原则、最少够用原则、确保安全原则等。' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务。本协议是您与 SOCKS5 之间关于您使用本服务所订立的协议。您在使用本服务时，必须遵守相关法律法规，不得利用本服务从事任何违法违规活动。对于任何违反规定的账号，我们有权进行封禁处理。' },
            'about': { title: '关于我们', text: 'SOCKS5 致力于为您提供全球领先的虚拟资产与安全网络服务。我们拥有专业的技术团队，采用银行级加密技术保障您的每一次交易和数据传输。如遇问题，请通过系统内客服渠道联系我们。' }
        };

        function openModal(type) {
            const data = modalContent[type]; if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-content').innerText = data.text;
            document.getElementById('info-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('info-modal').classList.add('hidden'); }
    </script>
</body>
</html>
