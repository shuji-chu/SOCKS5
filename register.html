<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - SOCKS5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css?v=41">
</head>
<body class="bg-slate-50 flex flex-col justify-center min-h-screen p-6">
    <div class="text-center mb-8">
        <img src="/logo.jpg" class="w-16 h-16 rounded-2xl mx-auto mb-4 object-cover shadow-sm border border-slate-200">
        <h2 class="text-2xl font-bold text-slate-800">创建新账号</h2>
        <p class="text-sm text-slate-500 mt-2">请使用真实邮箱完成验证</p>
    </div>
    <form id="reg-form" class="bg-white p-6 md:p-8 rounded-[2rem] border border-slate-100 shadow-sm space-y-4 max-w-sm w-full mx-auto">
        <div>
            <input type="email" id="email" required placeholder="工作邮箱" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none">
        </div>
        <div>
            <div class="flex gap-2">
                <input type="text" id="code" required placeholder="验证码" class="flex-1 px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none">
                <button type="button" id="send-code-btn" class="w-28 shrink-0 bg-slate-800 text-white rounded-2xl text-sm font-medium">获取验证码</button>
            </div>
        </div>
        <div>
            <input type="password" id="password" required placeholder="设置密码" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none">
        </div>
        <button type="submit" class="btn-primary w-full py-3.5 rounded-2xl font-bold mt-2">立即注册</button>
    </form>
    <div class="text-center mt-6">
        <a href="/login.html" class="text-sm font-medium text-blue-600">已有账号？返回登录</a>
    </div>
    <script>
        document.getElementById('send-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            if(!email || !email.includes('@')) { alert('请输入正确邮箱'); return; }
            this.disabled = true; this.innerText = '发送中...';
            try {
                const res = await fetch('https://api.lynli.me/s5api/api/v1/passport/auth/send-code', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('验证码已发送，请查收邮箱');
                    let cd = 60; const btn = this;
                    const timer = setInterval(() => { cd--; btn.innerText = `${cd}s`; if(cd <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; } }, 1000);
                } else { alert(data.message || '发送失败'); this.disabled = false; this.innerText = '获取验证码'; }
            } catch (e) { alert('网络错误'); this.disabled = false; this.innerText = '获取验证码'; }
        });
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('https://api.lynli.me/s5api/api/v1/passport/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value, code: document.getElementById('code').value })
                });
                if (res.ok) { alert('注册成功，请登录'); window.location.href = '/login.html'; } else { const data = await res.json(); alert(data.message || '注册失败'); }
            } catch (err) { alert('网络错误'); }
        });
    </script>
</body>
</html>
