<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>域名解析管理 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; } body { background-color: #f1f5f9; }</style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/domain.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">域名解析管理</h1>
    </header>
    <main class="p-4">
        <div class="bg-blue-500 text-white p-4 rounded-xl shadow-sm mb-4">
            <h2 class="text-lg font-bold mb-1">lynli.kz.ci</h2>
            <p class="text-xs text-blue-100">状态正常 | 剩余 365 天</p>
        </div>
        <h3 class="font-bold text-slate-800 mb-3 ml-1 text-[15px]">DNS 记录列表</h3>
        <div class="bg-white rounded-xl border border-slate-100 overflow-hidden text-sm">
            <div class="grid grid-cols-3 bg-slate-50 p-3 font-bold text-slate-600 border-b border-slate-100">
                <span>类型</span><span>主机记录</span><span>记录值</span>
            </div>
            <div class="grid grid-cols-3 p-3 border-b border-slate-50 text-slate-700 items-center">
                <span><span class="bg-orange-100 text-orange-600 text-[10px] px-1.5 py-0.5 rounded">A</span></span>
                <span class="font-mono">@</span>
                <span class="font-mono">8.210.61.146</span>
            </div>
            <div class="grid grid-cols-3 p-3 text-slate-700 items-center">
                <span><span class="bg-green-100 text-green-600 text-[10px] px-1.5 py-0.5 rounded">CNAME</span></span>
                <span class="font-mono">www</span>
                <span class="font-mono">lynli.me</span>
            </div>
        </div>
        <button class="w-full mt-6 py-3.5 bg-blue-500 text-white font-bold rounded-xl text-[15px] shadow-sm">+ 添加新记录</button>
    </main>
</body>
</html>
