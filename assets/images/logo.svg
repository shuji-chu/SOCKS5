    </filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#050B14" stroke="url(#s5-grad)" stroke-width="3" filter="url(#glow)"/>
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="url(#s5-grad)" filter="url(#glow)">S5</text>
