<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S5 · 晴天社区 - Global Accounts</title><link rel="icon" type="image/svg+xml" href="../../assets/images/logo.svg"><link rel="apple-touch-icon" href="../../assets/images/logo.svg"><link rel="apple-touch-icon" href="../../assets/images/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#2563eb' } } }
        }
    </script>
    <!-- 引入 Alpine.js 处理弹窗和状态 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
<link rel="stylesheet" href="./css/footer-ecosystem.css"></head>
<body class="bg-[#f8fafc] text-slate-700 font-sans antialiased" x-data="appStore()" x-cloak>

    <!-- ================= 1. 顶部导航栏 (Navbar) ================= -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Logo -->
            <a href="/" class="flex items-center gap-2">
                <img src="../../assets/images/logo.svg" alt="Logo" class="w-8 h-8 rounded-lg">
                <span class="font-bold text-xl text-slate-900 tracking-tight">S5<span class="text-primary">Account</span></span>
            </a>

            <!-- 搜索框 (PC端) -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <input type="text" placeholder="Search accounts..." class="w-full bg-[#f8fafc] border border-gray-200 rounded-full py-2 px-4 text-sm text-slate-900 focus:outline-none focus:border-primary transition">
            </div>

            <!-- 右侧：用户区域 -->
            <div class="flex items-center gap-4">
                <!-- 未登录状态 -->
                <template x-if="!isLoggedIn">
                    <div class="flex items-center gap-3 text-sm font-medium">
                        <button @click="openLogin()" class="text-slate-700 hover:text-slate-900 transition">Sign In</button>
                        <button @click="openRegister()" class="bg-primary text-slate-900 px-4 py-2 rounded-lg hover:bg-blue-600 transition shadow-lg shadow-primary/30">Register</button>
                    </div>
                </template>

                <!-- 已登录状态 (用户抽屉触发点) -->
                <template x-if="isLoggedIn">
                    <div class="relative" @click.outside="isDrawerOpen = false">
                        <button @click="isDrawerOpen = !isDrawerOpen" class="flex items-center gap-2 hover:opacity-80 transition">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-primary to-blue-400 flex items-center justify-center text-slate-900 font-bold" x-text="user.username.charAt(0).toUpperCase()"></div>
                            <span class="text-sm text-slate-900 font-medium hidden sm:block" x-text="user.username"></span>
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>

                        <!-- 下拉抽屉 (小抽屉) -->
                        <div x-show="isDrawerOpen" x-transition.opacity.duration.200ms class="absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-xl shadow-2xl overflow-hidden z-50">
                            <!-- 用户信息头部 -->
                            <div class="p-4 border-b border-gray-200 bg-gray-50">
                                <p class="text-sm text-gray-500 mb-1">Welcome back,</p>
                                <p class="text-base font-bold text-slate-900 truncate" x-text="user.username"></p>
                                <div class="mt-3 bg-[#f8fafc] rounded-lg p-2 flex justify-between items-center border border-gray-200">
                                    <span class="text-xs text-gray-500">Wallet Balance</span>
                                    <span class="text-green-600 font-bold" x-text="'$' + user.balance.toFixed(2)"></span>
                                </div>
                            </div>
                            <!-- 菜单列表 -->
                            <div class="p-2 space-y-1 text-sm">
                                <a href="/dashboard" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Dashboard</a>
                                <a href="/orders" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">My Orders</a>
                                <a href="/affiliate" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Affiliate Program</a>
                                <a href="/wallet" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Wallet</a>
                                <a href="/tickets" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Support Tickets</a>
                            </div>
                            <!-- 底部退出 -->
                            <div class="p-2 border-t border-gray-200">
                                <button @click="logout()" class="w-full text-left px-3 py-2 text-red-400 hover:bg-red-500/10 rounded-lg transition">Logout</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </nav>

    <!-- ================= 2. 页面主体内容 ================= -->
    <div class="max-w-7xl mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold text-slate-900 mb-6">Hot Products</h1>
        
        <!-- 测试权限拦截的按钮 -->
        <button @click="checkAuthAndAction('/checkout')" class="bg-primary text-slate-900 px-6 py-3 rounded-lg mb-8 hover:bg-blue-600">
            Go to Checkout (Requires Auth)
        </button>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="hot-products">
            <!-- 商品JS渲染区 -->
        </div>
    </div>

    <!-- ================= 3. 登录弹窗 (Modal) ================= -->
    <div x-show="isLoginOpen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" x-transition.opacity>
        <div @click.outside="isLoginOpen = false" class="bg-white w-full max-w-sm rounded-2xl shadow-2xl border border-gray-200 p-6 relative">
            <button @click="isLoginOpen = false" class="absolute top-4 right-4 text-gray-500 hover:text-slate-900">&times;</button>
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Sign In</h2>
            
            <form @submit.prevent="handleLogin()" class="space-y-4">
                <div>
                    <input type="text" x-model="loginForm.username" placeholder="Username / Email" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                </div>
                <div class="relative">
                    <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" placeholder="Password" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                    <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3 text-xs text-gray-500">Show</button>
                </div>
                
                <div class="flex items-center gap-2">
                    <input type="checkbox" x-model="loginForm.remember" class="rounded bg-[#f8fafc] border-gray-200 text-primary focus:ring-primary">
                    <span class="text-sm text-gray-500">Remember Me</span>
                </div>

                <!-- 错误提示 -->
                <div x-show="loginError" x-text="loginError" class="text-red-500 text-sm text-center bg-red-500/10 py-2 rounded"></div>

                <button type="submit" :disabled="isLoggingIn" class="w-full bg-primary text-slate-900 font-bold py-2.5 rounded-lg hover:bg-blue-600 transition disabled:opacity-50 flex justify-center items-center gap-2">
                    <span x-show="isLoggingIn" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                    <span x-text="isLoggingIn ? 'Signing In...' : 'Sign In'"></span>
                </button>
            </form>
            
            <p class="text-center text-sm text-gray-500 mt-4">Don't have an account? <button @click="openRegister()" class="text-primary hover:underline">Register</button></p>
        </div>
    </div>

    <!-- ================= 4. 注册弹窗 (Modal) ================= -->
    <div x-show="isRegisterOpen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" x-transition.opacity>
        <div @click.outside="isRegisterOpen = false" class="bg-white w-full max-w-sm rounded-2xl shadow-2xl border border-gray-200 p-6 relative">
            <button @click="isRegisterOpen = false" class="absolute top-4 right-4 text-gray-500 hover:text-slate-900">&times;</button>
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Create Account</h2>
            
            <form @submit.prevent="handleRegister()" class="space-y-4">
                <input type="email" x-model="regForm.email" placeholder="Email" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                <div class="flex gap-2">
                    <input type="text" x-model="regForm.code" placeholder="6-digit verification code" class="flex-1 bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                    <button type="button" @click="sendRegCode()" x-text="regCodeBtn" class="px-4 bg-gray-100 text-gray-600 text-sm font-bold rounded-lg whitespace-nowrap hover:bg-gray-200 transition"></button>
                </div>
                <input type="password" x-model="regForm.password" placeholder="Password (min 8 chars)" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                <input type="password" x-model="regForm.confirm" placeholder="Confirm Password" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg py-2.5 px-3 text-slate-900 focus:border-primary outline-none">
                
                <div class="flex items-start gap-2">
                    <input type="checkbox" x-model="regForm.agree" class="mt-1 rounded bg-[#f8fafc] border-gray-200 text-primary focus:ring-primary">
                    <span class="text-xs text-gray-500">I agree to Terms of Service</span>
                </div>

                <div x-show="regError" x-text="regError" class="text-red-500 text-sm text-center bg-red-500/10 py-2 rounded"></div>

                <button type="submit" :disabled="isRegistering" class="w-full bg-primary text-slate-900 font-bold py-2.5 rounded-lg hover:bg-blue-600 transition disabled:opacity-50 flex justify-center items-center gap-2">
                    <span x-show="isRegistering" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                    <span x-text="isRegistering ? 'Registering...' : 'Register'"></span>
                </button>
            </form>
            
            <p class="text-center text-sm text-gray-500 mt-4">Already have an account? <button @click="openLogin()" class="text-primary hover:underline">Sign In</button></p>
        </div>
    </div>

    <!-- ================= 5. Alpine.js 状态逻辑 ================= -->
    <script>
        function appStore() {
            return {
                // 状态
                isLoggedIn: localStorage.getItem('sosks5_token') ? true : false,
                user: { username: 'Guest', balance: 0 },
                
                isDrawerOpen: false,
                isLoginOpen: false,
                isRegisterOpen: false,
                showPassword: false,

                // 登录表单
                loginForm: { username: '', password: '', remember: false },
                loginError: '',
                isLoggingIn: false,

                // 注册表单
                regForm: { username: '', email: '', code: '', password: '', confirm: '', agree: false },
                regError: '',
                isRegistering: false,
                regCodeBtn: 'Get Code',

                init() {
                    // 页面加载时，如果有token，拉取真实用户信息
                    if(this.isLoggedIn) {
                        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('sosks5_token') } })
                            .then(r => r.json()).then(data => {
                                if (data.ok && data.user) {
                                    this.user = data.user;
                                    localStorage.setItem('sosks5_user', JSON.stringify(data.user));
                                } else {
                                    this.logout();
                                }
                            }).catch(() => {});
                    }
                },

                // 打开登录弹窗
                openLogin() {
                    this.isRegisterOpen = false;
                    this.isLoginOpen = true;
                    this.loginError = '';
                },

                // 打开注册弹窗
                openRegister() {
                    this.isLoginOpen = false;
                    this.isRegisterOpen = true;
                    this.regError = '';
                },

                sendRegCode() {
                    const email = this.regForm.email;
                    if(!email || !email.includes('@')) { this.regError = 'Please enter email first'; return; }
                    fetch('/api/auth/send-code', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: email })
                    }).then(r => r.json()).then(data => {
                        if (data.ok) {
                            this.regError = '';
                            let cd = 60;
                            this.regCodeBtn = cd + 's';
                            const t = setInterval(() => {
                                cd--;
                                if(cd <= 0) { clearInterval(t); this.regCodeBtn = 'Get Code'; }
                                else { this.regCodeBtn = cd + 's'; }
                            }, 1000);
                        } else {
                            this.regError = data.message || 'Send failed';
                        }
                    }).catch(() => { this.regError = 'Network error'; });
                },

                // 处理登录
                handleLogin() {
                    this.loginError = '';
                    if(!this.loginForm.username || !this.loginForm.password) {
                        this.loginError = 'Please fill in all fields';
                        return;
                    }
                    this.isLoggingIn = true;
                    const email = this.loginForm.username;
                    fetch('/api/auth/login', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: email, password: this.loginForm.password })
                    }).then(r => r.json()).then(data => {
                        if (data.ok && data.token) {
                            localStorage.setItem('sosks5_token', data.token);
                            localStorage.setItem('sosks5_user', JSON.stringify(data.user));
                            this.isLoggedIn = true;
                            this.user = data.user;
                            this.isLoginOpen = false;
                        } else {
                            this.loginError = data.message || 'Invalid username or password';
                        }
                        this.isLoggingIn = false;
                    }).catch(() => { this.loginError = 'Network error'; this.isLoggingIn = false; });
                },

                // 处理注册
                handleRegister() {
                    this.regError = '';
                    if(!this.regForm.email || !this.regForm.password || !this.regForm.code) {
                        this.regError = 'All fields are required'; return;
                    }
                    if(this.regForm.password.length < 8) {
                        this.regError = 'Password must be at least 8 characters'; return;
                    }
                    if(this.regForm.password !== this.regForm.confirm) {
                        this.regError = 'Passwords do not match'; return;
                    }
                    if(!this.regForm.agree) {
                        this.regError = 'You must agree to the Terms'; return;
                    }

                    this.isRegistering = true;
                    fetch('/api/auth/register', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: this.regForm.email, code: this.regForm.code, password: this.regForm.password })
                    }).then(r => r.json()).then(data => {
                        if (data.ok && data.token) {
                            localStorage.setItem('sosks5_token', data.token);
                            localStorage.setItem('sosks5_user', JSON.stringify(data.user));
                            this.isLoggedIn = true;
                            this.user = data.user;
                            this.isRegisterOpen = false;
                        } else {
                            this.regError = data.message || 'Registration failed';
                        }
                        this.isRegistering = false;
                    }).catch(() => { this.regError = 'Network error'; this.isRegistering = false; });
                },

                // 退出登录
                logout() {
                    localStorage.removeItem('sosks5_token');
                    this.isLoggedIn = false;
                    this.isDrawerOpen = false;
                    this.user = { username: 'Guest', balance: 0 };
                },

                // 全局权限拦截测试
                checkAuthAndAction(url) {
                    if(!this.isLoggedIn) {
                        alert('Please Sign In first to continue.');
                        this.openLogin();
                    } else {
                        window.location.href = url;
                    }
                }
            }
        }
    </script>
<script id="safe-ui-notice-policy">
(function(){
 function clean(v){return String(v??'操作未完成').replace(/Bearer\s+\S+/gi,'[凭据已隐藏]').replace(/\b(access[_-]?token|refresh[_-]?token|api[_-]?key|secret|password|authorization)\s*[:=]\s*["']?[^,\s"';&]+/gi,'$1=[凭据已隐藏]').replace(/(?:\b[0-9a-f]{1,4}:){2,}[0-9a-f:.]{1,}/gi,'[IP地址已隐藏]').replace(/https?:\/\/[^\s"'<>]+/gi,'[链接已隐藏]').replace(/\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}(?::\d+)?\b/gi,'[地址已隐藏]').replace(/\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?\b/g,'[地址已隐藏]').replace(/(?:^|\n)\s*at\s+[^\n]+/g,'').replace(/\s{2,}/g,' ').trim().slice(0,240)||'操作未完成，请稍后重试。'}
 window.safeUiMessage=clean;
 window.alert=function(message){var n=document.getElementById('safe-ui-notice');if(!n){n=document.createElement('div');n.id='safe-ui-notice';n.setAttribute('role','status');n.setAttribute('aria-live','polite');n.style.cssText='position:fixed;z-index:100001;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;border-radius:12px;background:#142b43;color:#fff;box-shadow:0 12px 36px #0005';document.body.appendChild(n)}n.textContent=clean(message);n.hidden=false;clearTimeout(window.__safeUiNoticeTimer);window.__safeUiNoticeTimer=setTimeout(function(){n.hidden=true},4200)};
 var nativeConfirm=window.confirm.bind(window);window.confirm=function(message){return nativeConfirm(clean(message))};
})();
</script>
