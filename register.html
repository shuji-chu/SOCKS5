<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>注册 · 晴天节点</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./css/style.css"></head>
<body data-page="register"><header class="topbar"><a class="brand" href="./index.html"><img src="./logo.png" alt=""><span>晴天节点</span></a><a class="text-link" href="./index.html">返回首页</a></header>
<main class="auth-shell"><section class="auth-card"><a class="brand auth-brand" href="./index.html"><img src="./logo.png" alt=""><span>晴天节点</span></a><span class="eyebrow">CREATE ACCOUNT</span><h1>创建账户</h1><p class="auth-intro">注册后即可选购高速节点套餐。</p><form id="registerForm"><label>邮箱地址<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></label><label>邮箱验证码<div class="input-with-action"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" required><button class="button button-outline" id="sendCode" type="button">发送验证码</button></div></label><label>设置密码<input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位" required></label><label>邀请码 <span class="optional">选填</span><input id="inviteCode" type="text" placeholder="如有邀请码请填写"></label><p id="formMessage" class="form-message" role="alert"></p><button class="button button-wide" type="submit">创建账户 <span>→</span></button></form><p class="auth-switch">已有账户？ <a href="./login.html">立即登录</a></p></section></main><script src="./js/api.js"></script><script src="./js/main.js"></script></body></html>
