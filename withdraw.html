<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>申请提现 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; } body { background-color: #f1f5f9; }</style>
</head>
<body class="pb-10">
    <div class="bg-white p-4 flex items-center gap-3 sticky top-0 z-50 shadow-sm">
        <a href="/invite.html" class="text-slate-600 font-bold text-xl px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">申请提现</h1>
    </div>

    <div class="p-4">
        <div class="bg-white rounded-xl shadow-sm p-4">
            <div class="bg-slate-50 rounded-lg p-3 flex justify-between items-center mb-6">
                <span class="text-sm text-slate-500">当前佣金余额：</span>
                <span class="text-lg font-bold text-red-500">¥0.00</span>
            </div>

            <div class="mb-6">
                <label class="block text-xs text-slate-500 mb-2">提现类型</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-1 text-sm"><input type="radio" name="w-type" checked class="accent-blue-500"> 佣金提现</label>
                    <label class="flex items-center gap-1 text-sm"><input type="radio" name="w-type" class="accent-blue-500"> 佣金转余额</label>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs text-slate-500 mb-2">提现金额</label>
                <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden">
                    <button class="px-4 py-2 bg-slate-50 text-slate-500 border-r border-slate-200" onclick="changeAmount(-10)">-</button>
                    <input type="number" id="w-amount" value="10.00" class="flex-1 text-center py-2 outline-none text-sm font-bold">
                    <button class="px-4 py-2 bg-slate-50 text-slate-500 border-l border-slate-200" onclick="changeAmount(10)">+</button>
                </div>
                <p class="text-[10px] text-slate-400 mt-2">• 最低提现金额：¥10.00</p>
            </div>

            <div class="mb-8">
                <label class="block text-xs text-slate-500 mb-2">提现地址</label>
                <textarea id="w-address" placeholder="请输入USDT-TRC20收款地址" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm outline-none resize-none" rows="3" maxlength="200"></textarea>
            </div>

            <div class="flex gap-3">
                <a href="/invite.html" class="flex-1 py-3 text-center border border-slate-300 text-slate-600 font-bold rounded-lg">取消</a>
                <button onclick="submitWithdraw()" class="flex-1 py-3 bg-blue-500 text-white font-bold rounded-lg">确认提现</button>
            </div>
        </div>
    </div>

    <script>
        function changeAmount(val) {
            const input = document.getElementById('w-amount');
            let current = parseFloat(input.value) || 0;
            current += val;
            if (current < 10) current = 10;
            input.value = current.toFixed(2);
        }
        function submitWithdraw() {
            const address = document.getElementById('w-address').value;
            if(!address || address.length < 10) return alert('请输入正确的USDT收款地址');
            alert('提现申请已提交，等待管理员审核');
            window.location.href = '/invite.html';
        }
    </script>
<script src="/ai-widget.js"></script>
</body>
</html>
