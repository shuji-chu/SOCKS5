<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css?v=6">
</head>
<body class="bg-slate-50 flex flex-col justify-center min-h-screen p-6">
    <div class="text-center mb-8">
        <img src="/logo.jpg" class="w-16 h-16 rounded-2xl mx-auto mb-4 object-cover shadow-sm">
        <h2 class="text-2xl font-bold text-slate-800">欢迎回来</h2>
        <p class="text-sm text-slate-500 mt-1">登录以继续使用 SOCKS5</p>
    </div>
    <form id="login-form" class="bg-white p-6 rounded-2xl card-shadow border border-slate-100 space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">工作邮箱</label>
            <input type="email" id="email" required placeholder="name@company.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
            <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-xl font-bold mt-2">安全登录</button>
    </form>
    <div class="text-center mt-6">
        <a href="/register.html" class="text-sm text-blue-600 font-medium">还没有账号？立即注册</a>
    </div>
    <div class="text-center mt-4">
        <a href="/index.html" class="text-sm text-slate-400">返回商城</a>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/profile.html'; // 登录成功去个人中心
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (err) { alert('网络错误'); }
        });
    </script>
</body>
</html>
