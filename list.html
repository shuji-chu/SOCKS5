<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>商品列表 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #ffffff; color: #1e293b; }
        .seamless-item { border-bottom: 1px solid #f1f5f9; }
        .dropdown-menu { display: none; }
        .dropdown-menu.active { display: block; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="bg-white border-x border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 id="page-title" class="text-lg font-bold text-slate-800">接码服务</h1>
    </header>

    <main>
        <!-- ======== 接码专属 UI ======== -->
        <div id="sms-ui" class="hidden">
            <!-- 黄底提示 -->
            <div class="mx-4 mt-4 mb-3 p-3 bg-yellow-50 rounded-lg border border-yellow-100 text-[12px] text-yellow-800 leading-relaxed">
                <p class="mb-1">*中文搜索不到的服务可以尝试用拼音或者英文搜索，例如：拼多多 搜索为 pinduoduo；微信 搜索为 weixin 或者 wechat。</p>
                <p>*搜索服务 <b>[Any other]</b> 可以接收任何服务的验证码。</p>
            </div>

            <!-- 国家选择下拉框 (高仿) -->
            <div class="px-4 mb-4 relative z-40">
                <button onclick="toggleDropdown()" class="w-full bg-white border border-blue-400 text-slate-700 px-4 py-3 rounded-lg flex justify-between items-center shadow-sm">
                    <span id="selected-country-text" class="font-medium text-[15px]">搜索国家</span>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <!-- 下拉列表 -->
                <div id="country-dropdown" class="dropdown-menu absolute left-4 right-4 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto z-50">
                    <div class="p-2 border-b border-slate-100">
                        <input type="text" id="country-search" placeholder="搜索国家..." oninput="filterCountries()" class="w-full bg-slate-50 px-3 py-2 text-sm rounded outline-none">
                    </div>
                    <ul id="country-list" class="py-1">
                        <!-- JS 动态渲染 -->
                    </ul>
                </div>
            </div>

            <!-- 服务列表区 -->
            <div id="sms-service-list" class="px-4 pb-10">
                <!-- JS 动态渲染服务卡片 -->
            </div>
        </div>

        <!-- ======== 其他商品通用 UI ======== -->
        <div id="default-ui">
            <!-- 粘性搜索框 -->
            <div class="px-4 py-3 bg-white sticky top-[56px] z-30 border-b border-slate-100">
                <div class="flex-1 bg-slate-50 rounded-lg flex items-center px-3 py-2 border border-slate-100">
                    <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-input" oninput="renderDefaultProducts()" placeholder="搜索当前分类商品..." class="bg-transparent outline-none text-[14px] w-full text-slate-700 placeholder-slate-400">
                </div>
            </div>

            <div id="default-product-list" class="px-4 pb-10">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pageType = urlParams.get('type') || '默认分类';
        
        // 如果进来的是接码，显示接码UI
        if (pageType === '接码') {
            document.getElementById('page-title').innerText = '接码服务';
            document.getElementById('sms-ui').classList.remove('hidden');
            document.getElementById('default-ui').classList.add('hidden');
            initSmsUI();
        } else {
            document.getElementById('page-title').innerText = pageType;
            document.getElementById('sms-ui').classList.add('hidden');
            document.getElementById('default-ui').classList.remove('hidden');
            renderDefaultProducts();
        }

        // ==========================================
        // 接码逻辑
        // ==========================================
        
        // 模拟国家数据
        const countries = [
            { code: 'US', name: '美国', en: 'United States' },
            { code: 'HK', name: '香港', en: 'Hong Kong' },
            { code: 'ID', name: '印度尼西亚', en: 'Indonesia' },
            { code: 'VN', name: '越南', en: 'Vietnam' },
            { code: 'GB', name: '英国', en: 'United Kingdom' },
            { code: 'PH', name: '菲律宾', en: 'Philippines' },
            { code: 'LA', name: '老挝', en: 'Laos' },
            { code: 'HT', name: '海地', en: 'Haiti' },
            { code: 'ZA', name: '南非', en: 'South Africa' }
        ];

        // 模拟服务数据 (国家代码 -> 服务列表)
        const servicesByCountry = {
            'HK': [
                { name: 'Microsoft', price: '0.08', stock: 150 },
                { name: 'WeChat', price: '0.15', stock: 88 },
                { name: 'Telegram', price: '0.50', stock: 42 }
            ],
            'US': [
                { name: 'Telegram', price: '0.50', stock: 320 },
                { name: 'WhatsApp', price: '0.80', stock: 110 },
                { name: 'Google', price: '0.25', stock: 500 }
            ],
            'ID': [
                { name: 'Telegram', price: '0.15', stock: 800 },
                { name: 'TikTok', price: '0.10', stock: 400 }
            ]
        };

        let currentCountry = 'HK'; // 默认选香港

        function initSmsUI() {
            renderCountries();
            document.getElementById('selected-country-text').innerText = `🇭🇰 香港 (Hong Kong)`;
            renderServices();
        }

        function toggleDropdown() {
            document.getElementById('country-dropdown').classList.toggle('active');
        }

        function renderCountries() {
            const listEl = document.getElementById('country-list');
            listEl.innerHTML = '';
            countries.forEach(c => {
                const li = document.createElement('li');
                li.className = "px-4 py-3 hover:bg-slate-50 cursor-pointer flex justify-between items-center text-[14px] seamless-item";
                li.innerHTML = `<span>${c.name}</span><span class="text-slate-400 text-xs">${c.code} · ${c.en}</span>`;
                li.onclick = () => {
                    currentCountry = c.code;
                    document.getElementById('selected-country-text').innerText = `${c.name} (${c.en})`;
                    document.getElementById('country-dropdown').classList.remove('active');
                    renderServices();
                };
                listEl.appendChild(li);
            });
        }

        function filterCountries() {
            const keyword = document.getElementById('country-search').value.toLowerCase();
            const items = document.getElementById('country-list').children;
            for(let i=0; i<items.length; i++) {
                const text = items[i].innerText.toLowerCase();
                items[i].style.display = text.includes(keyword) ? 'flex' : 'none';
            }
        }

        function renderServices() {
            const listEl = document.getElementById('sms-service-list');
            listEl.innerHTML = '';
            
            const list = servicesByCountry[currentCountry] || [];
            
            if(list.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">该国家暂无可用服务</div>';
                return;
            }

            // 渲染服务卡片 (像截图里那样的形式)
            const fragment = document.createDocumentFragment();
            list.forEach(s => {
                const div = document.createElement('div');
                div.className = "bg-white rounded-xl p-4 shadow-sm border border-slate-100 mb-3";
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="text-[16px] font-bold text-slate-800">${s.name}</h3>
                            <p class="text-[13px] text-slate-500 mt-0.5">${countries.find(c=>c.code===currentCountry).name}</p>
                        </div>
                        <button onclick="getNumber('${s.name}')" class="bg-blue-500 text-white text-sm px-5 py-1.5 rounded-md font-medium shadow-sm">取号</button>
                    </div>
                    <div class="text-[18px] font-bold text-slate-900 mt-2">$ ${s.price}</div>
                    <div class="text-xs text-slate-400 mt-1">库存: ${s.stock}</div>
                `;
                fragment.appendChild(div);
            });
            listEl.appendChild(fragment);
        }

        function getNumber(serviceName) {
            if(!localStorage.getItem('socks5_token')) { window.location.href = '/login.html'; return; }
            alert(`正在为您获取 [${serviceName}] 的号码...\n(对接后端API后此处会弹出接码面板)`);
        }

        // ==========================================
        // 其他商品通用逻辑
        // ==========================================
        function renderDefaultProducts() {
            const listEl = document.getElementById('default-product-list');
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            listEl.innerHTML = '';

            // 模拟 15 条数据
            const mock = [];
            for(let i=1; i<=15; i++) {
                mock.push({ title: `[${pageType}商品] 优质稳定 - 编号 ${i}`, price: (Math.random()*50+10).toFixed(2), stock: Math.floor(Math.random()*100) });
            }

            const filtered = mock.filter(p => p.title.toLowerCase().includes(keyword));

            const fragment = document.createDocumentFragment();
            filtered.forEach(p => {
                const a = document.createElement('a');
                a.href = "javascript:void(0)";
                a.onclick = () => { alert(`准备购买：${p.title}\n金额：¥${p.price}`); };
                a.className = "block py-4 seamless-item active:bg-slate-50 transition-colors";
                a.innerHTML = `
                    <div class="flex items-start gap-3.5">
                        <img src="/logo.jpg" class="w-10 h-10 rounded-xl object-cover shrink-0 mt-0.5 shadow-sm">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14.5px] font-semibold text-slate-800 leading-snug line-clamp-2">${p.title}</h3>
                            <div class="flex justify-between items-end mt-3.5">
                                <span class="text-[18px] font-bold text-red-500">¥${p.price}</span>
                                <span class="text-xs text-slate-400">库存: <span class="text-green-500 font-medium">${p.stock}</span></span>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(a);
            });
            listEl.appendChild(fragment);
        }
    </script>
</body>
</html>
