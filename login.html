<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- 暴力升版本号 -->
    <link rel="stylesheet" href="/style.css?v=14">
</head>
<body class="bg-slate-50 flex flex-col justify-center min-h-screen p-6">
    <div class="text-center mb-8">
        <img src="/logo.jpg" class="w-16 h-16 rounded-2xl mx-auto mb-4 object-cover shadow-sm border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800">欢迎回来</h2>
        <p class="text-sm text-slate-500 mt-2">登录以继续使用 SOCKS5 服务</p>
    </div>

    <form id="login-form" class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-slate-100 space-y-5 max-w-sm w-full mx-auto">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">工作邮箱</label>
            <input type="email" id="email" required placeholder="name@company.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">密码</label>
            <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>
        <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold mt-2">安全登录</button>
    </form>
    
    <!-- 只有去注册的链接，没有任何返回商城 -->
    <div class="text-center mt-8">
        <a href="/register.html" class="text-sm font-medium text-blue-600 hover:text-blue-700">还没有账号？立即注册</a>
    </div>

    <script src="/app.js?v=14"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (err) { alert('网络错误'); }
        });
    </script>
</body>
</html>
