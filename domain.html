<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>域名中心 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 20px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">免费域名中心</h1>
    </header>

    <main class="p-4">
        <!-- 解锁任务面板 -->
        <div class="bg-white rounded-xl border border-slate-100 p-4 mb-4 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2"><span class="w-1.5 h-3.5 bg-blue-500 rounded-full"></span>解锁免费域名额度</h2>
                <button onclick="openQuotaModal()" class="bg-blue-50 text-blue-600 px-3 py-1 rounded text-xs font-bold">购买配额</button>
            </div>
            <div class="space-y-3 text-sm text-slate-600">
                <div class="flex justify-between items-center">
                    <span>下 1 单 + 加入 TG 签到群</span>
                    <span class="text-xs text-green-500 bg-green-50 px-2 py-0.5 rounded">已达成</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>邀请 5 名真实用户</span>
                    <span class="text-xs text-blue-500 font-bold">去邀请 (2/5)</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>当前可用配额</span>
                    <span class="text-red-500 font-bold">1 个</span>
                </div>
            </div>
        </div>

        <div class="relative mb-4">
            <input type="text" placeholder="输入域名关键字搜索" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none text-sm shadow-sm">
            <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- 域名卡片 -->
        <div class="bg-white rounded-xl border border-slate-100 p-5 shadow-sm mb-3">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg></div>
                <h3 class="font-bold text-blue-600 text-[16px]">lynli.kz.ci</h3>
            </div>
            <div class="mb-3">
                <p class="text-xs text-slate-400 mb-1">状态</p>
                <span class="bg-green-50 text-green-600 border border-green-200 text-xs px-2 py-0.5 rounded-full inline-flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>正常</span>
            </div>
            <div class="mb-3 flex justify-between border-b border-dashed border-slate-200 pb-3">
                <div><p class="text-xs text-slate-400 mb-1">注册时间</p><p class="text-sm text-slate-700">2026-10-13</p></div>
                <div class="text-right"><p class="text-xs text-slate-400 mb-1">到期时间</p><p class="text-sm text-slate-700">2027-10-13</p></div>
            </div>
            <a href="/domain-manage.html" class="w-full border border-blue-500 text-blue-500 font-bold rounded-xl flex items-center justify-center gap-2 text-sm shadow-sm py-3">
                管理域名 (解析/SSL)
            </a>
        </div>
    </main>

    <!-- 购买配额弹窗 -->
    <div id="quota-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-[340px] relative">
            <button onclick="closeQuotaModal()" class="absolute top-3 right-3 text-slate-400 text-xl">✕</button>
            <div class="text-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center justify-center gap-2"><svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> 购买注册配额</h3>
            </div>
            <div class="bg-cyan-50 border border-cyan-100 p-3 rounded-lg text-sm text-cyan-800 mb-4 leading-relaxed">
                选择配额套餐购买注册配额；账户余额足够时直接扣除余额，余额不足时将生成对应账单。<br>
                <span class="font-bold mt-2 inline-block">账户余额：$0.00 USD</span>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-2">选择购买套餐</label>
                <select class="w-full border border-slate-200 rounded-lg p-3 text-sm outline-none">
                    <option>5 个配额 - $2.00 USD</option>
                    <option>10 个配额 - $3.50 USD</option>
                </select>
            </div>
            <button onclick="showGlobalAlert('提示', '余额不足，正在为您生成支付账单...')" class="w-full py-3 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm mb-4">✓ 提交购买</button>
            
            <div class="border-t border-slate-100 pt-4 text-xs text-slate-500">
                <p class="font-bold text-slate-700 mb-2">购买规则：</p>
                <ul class="list-disc pl-4 space-y-1">
                    <li>余额足够时直接扣除余额。</li>
                    <li>账单支付成功后系统自动发放额度。</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 通用提示弹窗 -->
    <div id="custom-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative">
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center justify-center gap-2"><img src="/logo.jpg" class="w-5 h-5 rounded"> <span id="modal-title">提示</span></h3>
                <p id="modal-desc" class="text-sm text-slate-500 mb-6 leading-relaxed text-left bg-slate-50 p-4 rounded-lg">内容</p>
                <button onclick="closeGlobalAlert()" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm">我知道了</button>
            </div>
        </div>
    </div>

    <script>
        function openQuotaModal() { document.getElementById('quota-modal').classList.add('active'); }
        function closeQuotaModal() { document.getElementById('quota-modal').classList.remove('active'); }
        
        function showGlobalAlert(title, desc) {
            closeQuotaModal();
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeGlobalAlert() { document.getElementById('custom-modal').classList.remove('active'); }
    </script>
</body>
</html>
