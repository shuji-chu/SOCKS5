<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>推广明细 - SOCKS5</title>
    <link rel="icon" href="./logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.97); }
    </style>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="pb-12 bg-[#f8f9fa]">
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="./invite.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-[17px] font-bold text-slate-800">推广明细</h1>
    </header>

    <main class="max-w-lg mx-auto">
        <!-- Tabs -->
        <div class="flex border-b border-gray-200 bg-white sticky top-[53px] z-40">
            <button onclick="switchTab('details')" id="tab-details" class="flex-1 py-3.5 text-[14px] font-bold text-black border-b-2 border-blue-600">佣金明细</button>
            <button onclick="switchTab('subordinates')" id="tab-subordinates" class="flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent">我的下级</button>
            <button onclick="switchTab('rebates')" id="tab-rebates" class="flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent">返佣订单</button>
        </div>

        <!-- 列表容器 -->
        <div class="bg-white">
            <div id="list-container" class="w-full text-left"></div>
        </div>

        <!-- 分页 -->
        <div class="flex justify-between items-center p-4 border-t border-gray-200 bg-white">
            <button class="px-4 py-1.5 bg-white border border-gray-200 text-slate-600 text-[13px] rounded-lg active:bg-slate-50">上一页</button>
            <span class="text-[12px] text-slate-500 font-medium" id="page-info">第 1 页 · 每页 10 条</span>
            <button class="px-4 py-1.5 bg-white border border-gray-200 text-slate-600 text-[13px] rounded-lg active:bg-slate-50">下一页</button>
        </div>
    </main>

    <script>
        let currentTab = 'details';

        const mockData = {
            details: [
                { title: '下级消费返佣', id: 'OD20261022140001', amount: '+ $1.50', time: '2026-10-22 14:30' },
                { title: '下级消费返佣', id: 'OD20261021090002', amount: '+ $0.45', time: '2026-10-21 09:15' },
                { title: '邀请注册奖励', id: 'REG20261020180001', amount: '+ $2.00', time: '2026-10-20 18:00' }
            ],
            subordinates: [
                { title: '用户 boss_01', id: '注册时间: 2026-10-22', amount: '有效', time: '消费 10 单' },
                { title: '用户 king_88', id: '注册时间: 2026-10-20', amount: '有效', time: '消费 3 单' },
                { title: '用户 test_user', id: '注册时间: 2026-10-15', amount: '未消费', time: '消费 0 单' }
            ],
            rebates: [
                { title: '手机号二要素认证 接口消费', id: '订单号: RB123456789', amount: '+ $0.045', time: '返佣比例: 15%' },
                { title: 'Gmail 卡密购买', id: '订单号: RB987654321', amount: '+ $1.200', time: '返佣比例: 15%' }
            ]
        };

        function switchTab(tab) {
            currentTab = tab;
            ['details', 'subordinates', 'rebates'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-3.5 text-[14px] font-bold text-black border-b-2 border-blue-600';
                } else {
                    btn.className = 'flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent';
                }
            });
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const data = mockData[currentTab];
            
            let html = '';
            data.forEach(item => {
                html += `
                    <div class="flex justify-between items-start px-4 py-3 border-b border-gray-200 hover:bg-slate-50">
                        <div class="flex flex-col gap-1 pr-4">
                            <span class="text-[13px] font-bold text-slate-800 line-clamp-1">${item.title}</span>
                            <span class="text-[11px] text-slate-400">${item.id}</span>
                        </div>
                        <div class="flex flex-col items-end gap-1 shrink-0">
                            <span class="text-[14px] font-bold text-green-600">${item.amount}</span>
                            <span class="text-[11px] text-slate-400">${item.time}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#subordinates') switchTab('subordinates');
            else if (window.location.hash === '#rebates') switchTab('rebates');
            else switchTab('details');
        });
    </script>
<script src="./ai-widget.js"></script>


<script src="./notice.js"></script>
</body>
</html>
