<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>佣金提现 - SOCKS5</title>
    <link rel="icon" href="../assets/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pb-12 bg-[#f8f9fa]">
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <button onclick="window.history.back()" class="text-slate-600 text-xl font-bold px-2">←</button>
        <h1 class="text-[17px] font-bold text-slate-800">佣金提现</h1>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto">
        <!-- 余额展示 -->
        <div class="text-center mb-8">
            <p class="text-[13px] text-slate-500 mb-1">当前可提现佣金 (USDT)</p>
            <p class="text-[36px] font-bold text-green-600">$ 45.50</p>
            <p class="text-[12px] text-slate-400 mt-1">最低提现额度 15 USDT</p>
        </div>

        <div class="card p-5 space-y-5">
            <!-- 提现方式选择 -->
            <div>
                <label class="text-[14px] font-bold text-slate-700 mb-3 block">选择提现方式</label>
                <div class="grid grid-cols-2 gap-3">
                    <div onclick="switchTab('alipay')" id="tab-alipay" class="border-2 border-blue-500 bg-gray-50 text-black font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition">支付宝提现</div>
                    <div onclick="switchTab('usdt')" id="tab-usdt" class="border border-gray-200 text-slate-600 font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition">USDT (TRC20)</div>
                </div>
            </div>

            <!-- 表单区：支付宝 -->
            <div id="form-alipay" class="space-y-4">
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">支付宝账号</label>
                    <input type="text" class="input-flat" placeholder="请输入支付宝手机号或邮箱">
                </div>
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">真实姓名</label>
                    <input type="text" class="input-flat" placeholder="请输入支付宝实名认证姓名">
                </div>
            </div>

            <!-- 表单区：USDT -->
            <div id="form-usdt" class="space-y-4 hidden">
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">USDT 收款地址 (TRC20)</label>
                    <input type="text" class="input-flat" placeholder="请务必填写正确的 TRC20 地址">
                </div>
            </div>

            <!-- 提现金额 -->
            <div>
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">提现金额 (USDT)</label>
                <input type="number" class="input-flat" placeholder="最低 15 USDT" value="15">
            </div>

            <!-- 提示 -->
            <div class="bg-slate-50 p-3 rounded-lg border border-gray-200">
                <p class="text-[11px] text-slate-500 leading-relaxed">提现申请需经过财务人工审核，预计 24 小时内到账。请务必核对收款信息，因信息填写错误导致的资金损失由用户自行承担。</p>
            </div>

            <!-- 提交按钮 -->
            <button onclick="submitWithdraw()" class="w-full py-3.5 bg-black text-white font-bold rounded-lg text-[16px] active:opacity-80 transition shadow-sm shadow-blue-500/20 mt-2">确认提现</button>
        </div>
    </main>

    <!-- 提示弹窗 -->
    <div id="success-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center px-4">
        <div class="bg-white rounded-lg w-full max-w-[300px] p-6 text-center shadow-xl">
            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full mx-auto flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-[18px] font-bold text-slate-800 mb-2">提交成功</h3>
            <p class="text-[13px] text-slate-500 mb-5">您的提现申请已提交，请等待财务审核打款。</p>
            <button onclick="window.location.href='./invite.html'" class="w-full py-2.5 bg-black text-white font-bold rounded-lg text-[15px]">我知道了</button>
        </div>
    </div>

    <script>
        let currentType = 'alipay';
        
        function switchTab(type) {
            currentType = type;
            const tabAlipay = document.getElementById('tab-alipay');
            const tabUsdt = document.getElementById('tab-usdt');
            const formAlipay = document.getElementById('form-alipay');
            const formUsdt = document.getElementById('form-usdt');

            if (type === 'alipay') {
                tabAlipay.className = 'border-2 border-blue-500 bg-gray-50 text-black font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                tabUsdt.className = 'border border-gray-200 text-slate-600 font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                formAlipay.classList.remove('hidden');
                formUsdt.classList.add('hidden');
            } else {
                tabUsdt.className = 'border-2 border-blue-500 bg-gray-50 text-black font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                tabAlipay.className = 'border border-gray-200 text-slate-600 font-bold text-[14px] py-3 rounded-lg text-center cursor-pointer transition';
                formUsdt.classList.remove('hidden');
                formAlipay.classList.add('hidden');
            }
        }

        function submitWithdraw() {
            // 可以加一些简单的空值校验
            document.getElementById('success-modal').classList.remove('hidden');
            document.getElementById('success-modal').classList.add('flex');
        }
    </script>

<script src="../js/ai-widget.js"></script>

<script src="../js/notice.js"></script>
</body>
</html>
