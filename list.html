<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>商品列表 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; }
        .dropdown-menu { display: none; }
        .dropdown-menu.active { display: block; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 id="page-title" class="text-lg font-bold text-slate-800">接码服务</h1>
    </header>

    <main class="pb-10">
        <!-- ======== 接码专属 UI ======== -->
        <div id="sms-ui" class="hidden">
            <!-- 搜索及国家筛选区 (吸顶) -->
            <div class="bg-white px-4 pt-3 pb-2 sticky top-[56px] z-40 shadow-sm border-b border-slate-100">
                <!-- 国家下拉筛选 -->
                <div class="relative mb-3">
                    <button onclick="toggleDropdown()" class="w-full bg-white border border-slate-300 text-slate-700 px-4 py-2.5 rounded-lg flex justify-between items-center text-sm">
                        <span id="selected-country-text">搜索国家</span>
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <!-- 下拉列表 -->
                    <div id="country-dropdown" class="dropdown-menu absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto z-50">
                        <div class="p-2 border-b border-slate-100">
                            <input type="text" id="country-search" placeholder="搜索国家..." oninput="filterCountries()" class="w-full bg-slate-50 px-3 py-2 text-sm rounded outline-none">
                        </div>
                        <ul id="country-list" class="py-1"></ul>
                    </div>
                </div>
                
                <!-- 服务搜索框 -->
                <div class="flex-1 bg-white border border-slate-300 rounded-lg flex items-center px-3 py-2.5">
                    <input type="text" id="service-search" oninput="renderSmsServices()" placeholder="搜索服务 (如: facebook, TG)" class="bg-transparent outline-none text-[14px] w-full text-slate-700 placeholder-slate-400">
                </div>
            </div>

            <!-- 服务列表平铺区 -->
            <div id="sms-service-list" class="p-4 space-y-3">
                <!-- JS 动态渲染 -->
            </div>
            
            <!-- 模拟无限加载提示 -->
            <div id="loading-more" class="text-center text-slate-400 text-xs py-4 hidden">正在加载更多...</div>
        </div>

        <!-- ======== 其他商品通用 UI ======== -->
        <div id="default-ui">
            <!-- 粘性搜索框 -->
            <div class="px-4 py-3 bg-white sticky top-[56px] z-30 border-b border-slate-100">
                <div class="flex-1 bg-slate-50 rounded-lg flex items-center px-3 py-2 border border-slate-100">
                    <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-input" oninput="renderDefaultProducts()" placeholder="搜索当前分类商品..." class="bg-transparent outline-none text-[14px] w-full text-slate-700 placeholder-slate-400">
                </div>
            </div>

            <div id="default-product-list" class="px-4 bg-white min-h-screen">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pageType = urlParams.get('type') || '默认分类';
        
        // 全局模拟数据
        const countries = [
            { code: 'US', name: '美国' }, { code: 'HK', name: '香港' }, { code: 'ID', name: '印度尼西亚' },
            { code: 'VN', name: '越南' }, { code: 'GB', name: '英国' }, { code: 'PH', name: '菲律宾' },
            { code: 'BR', name: '巴西' }, { code: 'TH', name: '泰国' }
        ];

        // 平铺的服务列表数据 (高仿截图)
        const flatSmsData = [
            { id: 1, service: 'facebook', country: '巴西', price: '0.16', tag: '推荐' },
            { id: 2, service: 'TikTok/Douyin', country: '菲律宾', price: '0.04', tag: '' },
            { id: 3, service: 'Microsoft', country: '香港', price: '0.08', tag: '' },
            { id: 4, service: 'WeChat', country: '泰国', price: '0.32', tag: '' },
            { id: 5, service: 'facebook', country: '印度尼西亚', price: '0.16', tag: '推荐' },
            { id: 6, service: 'Telegram', country: '美国', price: '0.50', tag: '' },
            { id: 7, service: 'WhatsApp', country: '美国', price: '0.80', tag: '推荐' },
            { id: 8, service: 'Google', country: '英国', price: '0.25', tag: '' },
            { id: 9, service: 'Twitter', country: '越南', price: '0.12', tag: '' },
            { id: 10, service: 'Instagram', country: '巴西', price: '0.18', tag: '' }
        ];

        let currentCountryFilter = '';

        // 初始化
        if (pageType === '接码') {
            document.getElementById('page-title').innerText = '接收短信';
            document.getElementById('sms-ui').classList.remove('hidden');
            document.getElementById('default-ui').classList.add('hidden');
            initSmsUI();
        } else {
            document.getElementById('page-title').innerText = pageType;
            document.getElementById('sms-ui').classList.add('hidden');
            document.getElementById('default-ui').classList.remove('hidden');
            document.body.style.backgroundColor = '#ffffff'; // 通用列表用纯白背景
            renderDefaultProducts();
        }

        // ==========================================
        // 接码逻辑
        // ==========================================
        function initSmsUI() {
            renderCountries();
            renderSmsServices();
        }

        function toggleDropdown() {
            document.getElementById('country-dropdown').classList.toggle('active');
        }

        function renderCountries() {
            const listEl = document.getElementById('country-list');
            listEl.innerHTML = '<li class="px-4 py-2 hover:bg-slate-50 cursor-pointer text-sm" onclick="selectCountry(\'\', \'搜索国家\')">全部国家</li>';
            countries.forEach(c => {
                const li = document.createElement('li');
                li.className = "px-4 py-2.5 hover:bg-slate-50 cursor-pointer text-sm border-t border-slate-50 flex justify-between";
                li.innerHTML = `<span>${c.name}</span><span class="text-slate-400">${c.code}</span>`;
                li.onclick = () => selectCountry(c.name, c.name);
                listEl.appendChild(li);
            });
        }

        function selectCountry(code, displayName) {
            currentCountryFilter = code;
            document.getElementById('selected-country-text').innerText = displayName;
            document.getElementById('country-dropdown').classList.remove('active');
            renderSmsServices();
        }

        function filterCountries() {
            const keyword = document.getElementById('country-search').value.toLowerCase();
            const items = document.getElementById('country-list').children;
            for(let i=1; i<items.length; i++) { // 跳过第一个"全部"
                const text = items[i].innerText.toLowerCase();
                items[i].style.display = text.includes(keyword) ? 'flex' : 'none';
            }
        }

        function renderSmsServices() {
            const serviceKeyword = document.getElementById('service-search').value.trim().toLowerCase();
            const listEl = document.getElementById('sms-service-list');
            listEl.innerHTML = '';

            const filtered = flatSmsData.filter(s => {
                const matchService = s.service.toLowerCase().includes(serviceKeyword);
                const matchCountry = currentCountryFilter ? s.country === currentCountryFilter : true;
                return matchService && matchCountry;
            });

            if(filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">没有找到相关服务</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach(s => {
                const div = document.createElement('div');
                // 高仿截图里的卡片样式
                div.className = "bg-white rounded-xl p-5 shadow-sm border border-slate-100 flex justify-between items-center";
                
                // 标签渲染
                let tagHtml = s.tag ? `<span class="bg-teal-400 text-white text-[10px] font-bold px-1.5 py-0.5 rounded mr-2 align-middle">${s.tag}</span>` : '';

                div.innerHTML = `
                    <div class="flex-1">
                        <h3 class="text-[16px] font-bold text-slate-800 mb-1 flex items-center">
                            ${tagHtml}${s.service}
                        </h3>
                        <p class="text-[13px] text-slate-500 mb-1">${s.country}</p>
                        <div class="text-[18px] font-bold text-slate-900">$ ${s.price}</div>
                    </div>
                    <button onclick="getNumber('${s.service}', '${s.country}')" class="bg-blue-500 hover:bg-blue-600 text-white text-[15px] font-bold px-6 py-2.5 rounded-lg shadow-sm transition-colors">取号</button>
                `;
                fragment.appendChild(div);
            });
            listEl.appendChild(fragment);
        }

        function getNumber(service, country) {
            if(!localStorage.getItem('socks5_token')) { window.location.href = '/login.html'; return; }
            alert(`正在获取 [${country}] 的 [${service}] 号码...\n(对接后端后会弹出专属面板)`);
        }

        // ==========================================
        // 其他商品通用逻辑
        // ==========================================
        function renderDefaultProducts() {
            const listEl = document.getElementById('default-product-list');
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            listEl.innerHTML = '';

            const mock = [];
            for(let i=1; i<=15; i++) {
                mock.push({ title: `[${pageType}商品] 优质稳定 - 编号 ${i}`, price: (Math.random()*50+10).toFixed(2), stock: Math.floor(Math.random()*100) });
            }

            const filtered = mock.filter(p => p.title.toLowerCase().includes(keyword));

            const fragment = document.createDocumentFragment();
            filtered.forEach(p => {
                const a = document.createElement('a');
                a.href = "javascript:void(0)";
                a.onclick = () => { alert(`准备购买：${p.title}\n金额：¥${p.price}`); };
                a.className = "block py-4 border-b border-slate-100 active:bg-slate-50 transition-colors";
                a.innerHTML = `
                    <div class="flex items-start gap-3.5">
                        <img src="/logo.jpg" class="w-10 h-10 rounded-xl object-cover shrink-0 mt-0.5 shadow-sm">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14.5px] font-semibold text-slate-800 leading-snug line-clamp-2">${p.title}</h3>
                            <div class="flex justify-between items-end mt-3.5">
                                <span class="text-[18px] font-bold text-red-500">¥${p.price}</span>
                                <span class="text-xs text-slate-400">库存: <span class="text-green-500 font-medium">${p.stock}</span></span>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(a);
            });
            listEl.appendChild(fragment);
        }
    </script>
</body>
</html>
