<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e0f7fa"><title>晴天社区 · 登录与注册</title><link rel="icon" type="image/svg+xml" href="./assets/images/logo.svg"><link rel="apple-touch-icon" href="./assets/images/logo.svg"><style>
:root{color-scheme:dark;--bg:#061326;--panel:rgba(12,31,54,.82);--panel2:#102944;--line:rgba(110,190,230,.17);--cyan:#55e8ff;--blue:#589cff;--text:#f3f8ff;--muted:#8ea8c4;--green:#5be2b1;--red:#ff758f;--gold:#ffd27c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,#16416b 0,transparent 42%),radial-gradient(ellipse at -10% 70%,#102c50 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.wrap{width:min(1160px,100% - 32px);margin:auto}.header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 max(16px,calc((100% - 1160px)/2));background:#061326cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:850;letter-spacing:.5px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#4779ff);color:#061326;font-weight:900;box-shadow:0 0 25px #55e8ff33}.nav{display:flex;gap:8px;align-items:center}.nav a{padding:9px 13px;border-radius:10px;color:var(--muted)}.nav a:hover,.nav a.active{background:#55e8ff12;color:var(--cyan)}.btn{border:1px solid #55e8ff40;border-radius:12px;padding:10px 15px;background:#55e8ff12;color:var(--cyan);font-weight:750;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px #55e8ff18}.btn.primary{background:linear-gradient(135deg,#55e8ff,#659bff);border:0;color:#061326}.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}.muted{color:var(--muted)}.eyebrow{color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase}.title{font-size:clamp(28px,4vw,44px);line-height:1.15;letter-spacing:-1px;margin:8px 0 12px}.lead{font-size:15px;color:var(--muted);max-width:650px}.page-head{padding:38px 0 24px}.panel,.card{background:linear-gradient(145deg,rgba(17,43,70,.9),rgba(8,24,43,.86));border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 50px #0002;min-width:0}.panel{padding:22px}.grid{display:grid;gap:16px}.grid.products{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.section{margin:24px 0 40px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}.section-head h2{margin:0;font-size:21px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#ffffff06;color:var(--muted);font-size:12px}.pill.live{color:var(--green);border-color:#5be2b144}.price{font-size:25px;font-weight:850;color:var(--cyan);letter-spacing:-.5px}.price small{font-size:12px;color:var(--muted);font-weight:500}.input,select,textarea{width:100%;padding:12px 13px;border-radius:11px;background:#061629;border:1px solid var(--line);color:var(--text);outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e8ff12}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#b8cbe0;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;letter-spacing:.7px;color:var(--muted);background:#ffffff05}tr:last-child td{border-bottom:0}.empty,.error-state{padding:36px 16px;text-align:center;color:var(--muted)}.empty .symbol,.error-state .symbol{font-size:28px;margin-bottom:8px}.skeleton{height:220px;border-radius:18px;background:linear-gradient(100deg,#10263e 20%,#1c3a58 38%,#10263e 56%);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}.bottom-nav{display:none}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#102d46;border:1px solid #55e8ff55;border-radius:12px;padding:12px 18px;z-index:90;box-shadow:0 10px 35px #0008}.modal-backdrop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:#020914b8;backdrop-filter:blur(14px)}.modal-backdrop.show{display:flex}.modal{width:min(580px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#112b47f5,#071629f7);border:1px solid #75cfff3d;border-radius:22px;padding:22px;box-shadow:0 30px 90px #0009}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head h3{margin:0}.footer{border-top:1px solid var(--line);padding:26px 16px 100px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:820px){.nav{display:none}.grid.products{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two{grid-template-columns:1fr}.header{height:62px}.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#07172bea;border-top:1px solid var(--line);backdrop-filter:blur(20px)}.bottom-nav a{display:grid;place-items:center;gap:2px;color:var(--muted);font-size:10px}.bottom-nav a img{display:block;width:21px;height:21px;object-fit:contain}.bottom-nav a.active{color:var(--cyan)}.footer{padding-bottom:100px}}@media(max-width:420px){.wrap{width:calc(100% - 24px)}.grid.products{gap:10px}.panel{padding:16px}.product-card .cover{height:115px}.btn{padding:9px 11px}.title{font-size:29px}}


</style><style>
.btn,button,.bottom-nav a{min-height:44px;touch-action:manipulation}.bottom-nav a.active{color:var(--cyan);text-shadow:0 0 12px #55e8ffb8}.bottom-nav a.active span{filter:drop-shadow(0 0 7px #55e8ff)}
.input.invalid{border-color:#ff647f!important;box-shadow:0 0 0 3px #ff647f24,0 0 18px #ff647f22!important}.error-msg{display:block;min-height:0;font-size:12px;line-height:1.45;color:#ff8295!important}.error-msg:not(:empty){margin-top:2px}.field:has(.input.invalid) label{color:#ff9baa}
@media(max-width:560px){.modal-backdrop{align-items:flex-end;padding:0}.modal{width:100%;max-height:calc(100dvh - 12px);border-radius:22px 22px 0 0;padding:25px 18px calc(20px + env(safe-area-inset-bottom))}.panel{padding:18px}.btn{min-height:46px}}
</style><link rel="stylesheet" href="./css/navigation.css"><link rel="stylesheet" href="./css/light-vanta.css"></head><body>
<header class="header"><a class="brand" href="./index.html"><img loading="lazy" src="./assets/images/logo.svg" alt="晴天社区" width="38" height="38" style="width:38px;height:38px;object-fit:contain"><span>SOSKS5 <small class="muted" style="font-size:10px;display:block;line-height:1">GLOBAL DIGITAL</small></span></a><nav class="nav"><a href="./index.html">首页</a><a class="" href="./shop.html">商城</a><a class="" href="./user.html#botMatrix">机器人矩阵</a><a class="" href="./user.html">个人中心</a></nav><a class="btn" href="./login.html">登录 / 注册</a></header>
<main class="wrap" style="min-height:calc(100vh - 140px);display:grid;place-items:center;padding-top:24px;padding-bottom:40px"><div class="grid two" style="width:min(920px,100%);align-items:stretch"><section class="panel" style="display:flex;flex-direction:column;justify-content:space-between;min-height:440px;background:radial-gradient(circle at 20% 20%,#1a5275 0,transparent 44%),linear-gradient(145deg,#0e2945,#071629)"><div><div class="eyebrow">SECURE DIGITAL ACCESS</div><h1 class="title" style="font-size:clamp(32px,5vw,48px);margin-top:24px">开启你的<br><span style="color:var(--cyan)">数字服务空间</span></h1><p class="lead">一个账户，管理你的商品、订阅与推广权益。</p></div><div class="grid two"><div><div class="price">99.9%</div><div class="muted">服务可用性目标</div></div><div><div class="price">24/7</div><div class="muted">全天候自助访问</div></div></div></section><section class="panel"><div class="actions" style="margin-bottom:24px"><button class="btn primary" id="loginTab" onclick="setMode('login')">登录</button><button class="btn ghost" id="registerTab" onclick="setMode('register')">创建账户</button></div><h2 id="formTitle" style="margin:0 0 4px">欢迎回来</h2><p class="muted" id="formDesc">登录以继续访问你的个人空间。</p><form id="authForm" novalidate><div class="field"><label for="account">手机号 / 邮箱</label><input class="input" id="account" autocomplete="username" placeholder="请输入手机号或邮箱"><small class="error-msg" id="accountError" style="color:var(--red)"></small></div><div class="field"><label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="至少 8 位密码"><small class="error-msg" id="passwordError" style="color:var(--red)"></small></div><div class="field" id="confirmField" hidden><label for="confirmPassword">确认密码</label><input class="input" id="confirmPassword" type="password" placeholder="再次输入密码"><small class="error-msg" id="confirmError" style="color:var(--red)"></small></div><label style="display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:12px;margin:16px 0"><input type="checkbox" id="agree" style="margin-top:4px;accent-color:var(--cyan)">我已阅读并同意<a href="#" style="color:var(--cyan)" onclick="event.preventDefault();toast('演示协议：接入正式服务后展示完整协议')">《服务条款》</a>与<a href="#" style="color:var(--cyan)" onclick="event.preventDefault();toast('演示协议：接入正式服务后展示隐私政策')">《隐私政策》</a></label><small class="error-msg" id="agreeError" style="color:var(--red);display:block;margin-top:-12px;margin-bottom:12px"></small><button class="btn primary" id="submitBtn" style="width:100%;padding:13px">登录</button><p class="muted" style="font-size:11px;text-align:center;margin-top:18px">演示界面 · 暂未连接真实身份验证服务</p></form></section></div></main>
<nav class="bottom-nav"><a href="./index.html"><img src="./assets/icons/home.svg" alt="" aria-hidden="true">首页</a><a class="" href="./shop.html"><img src="./assets/icons/shop.svg" alt="" aria-hidden="true">商城</a><a class="" href="./user.html"><img src="./assets/icons/user.svg" alt="" aria-hidden="true">我的</a></nav><div id="toast" class="toast" hidden></div>
<script>
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.hidden=true,2200)}
function copyText(s){if(!s){toast('当前暂无可复制内容');return}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){let e=document.createElement('textarea');e.value=s;e.style.position='fixed';e.style.opacity='0';document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch(_){toast('复制失败，请手动选择复制')}e.remove()}
let mode='login';function setMode(m){mode=m;document.getElementById('loginTab').className='btn '+(m==='login'?'primary':'ghost');document.getElementById('registerTab').className='btn '+(m==='register'?'primary':'ghost');document.getElementById('formTitle').textContent=m==='login'?'欢迎回来':'创建你的账户';document.getElementById('formDesc').textContent=m==='login'?'登录以继续访问你的个人空间。':'填写信息，创建你的数字服务账户。';document.getElementById('submitBtn').textContent=m==='login'?'登录':'创建账户';document.getElementById('confirmField').hidden=m==='login';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password';clearErrors()}function clearErrors(){document.querySelectorAll('.error-msg').forEach(e=>e.textContent='');document.querySelectorAll('#authForm .input').forEach(e=>e.classList.remove('invalid'));document.getElementById('agree').style.outline=''}
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();if(document.getElementById('submitBtn').dataset.cooldown==='1')return;clearErrors();const account=document.getElementById('account').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;let ok=true;const set=(id,msg,inputId)=>{document.getElementById(id).textContent=msg;const el=document.getElementById(inputId||({accountError:'account',passwordError:'password',confirmError:'confirmPassword'}[id]));if(el)el.classList.add('invalid');ok=false};if(!account)set('accountError','请输入邮箱或手机号');else if(account.includes('@')&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(account))set('accountError','邮箱格式不正确');else if(!account.includes('@')&&!/^[+\\d][\\d\\s-]{6,18}$/.test(account))set('accountError','手机号格式不正确');if(!password)set('passwordError','请输入密码');else if(password.length<8)set('passwordError','密码至少需要 8 位');if(mode==='register'&&confirm!==password)set('confirmError','两次输入的密码不一致');if(!document.getElementById('agree').checked){set('agreeError','请先勾选并同意服务条款与隐私政策',null);document.getElementById('agree').style.outline='1px solid #ff647f'}if(!ok){const first=document.querySelector('#authForm .input.invalid');first?.focus();return}const b=document.getElementById('submitBtn');if(b.dataset.cooldown==='1')return;b.dataset.cooldown='1';b.disabled=true;b.style.opacity='.55';let remain=3;b.textContent='请稍候 '+remain+'s';const timer=setInterval(()=>{remain--;if(remain>0){b.textContent='请稍候 '+remain+'s';return}clearInterval(timer);b.dataset.cooldown='0';b.disabled=false;b.textContent=mode==='login'?'登录':'创建账户';b.style.opacity='1'},1000);toast('表单校验通过；身份验证接口尚未接入，未发送登录请求')};
</script><script src="./js/light-vanta.js" defer></script></body></html>
