<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; overflow-y: auto; }
        .header { text-align: center; margin-top: 24px; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; }
        .header h2 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }
        .card { background: #fff; padding: 24px; border-radius: 32px; border: 1px solid #f1f5f9; max-width: 380px; margin: 0 auto; width: 100%; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; font-size: 15px; outline: none; margin-bottom: 14px; }
        .btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; }
        .link-text { text-align: center; margin: 20px 0 32px; }
        .link-text a { font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .divider { position: relative; margin-bottom: 24px; text-align: center; }
        .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid #f1f5f9; z-index: 1; }
        .divider span { position: relative; z-index: 2; background: #fff; padding: 0 12px; font-size: 11px; color: #94a3b8; }
        .auth-icons { display: flex; justify-content: center; gap: 20px; }
        .auth-icons button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; overflow: hidden; padding: 0; background: #fff; }
        .auth-icons img { width: 100%; height: 100%; object-fit: cover; }
        .footer { text-align: center; margin-top: 40px; margin-bottom: 16px; }
        .footer img { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 12px; opacity: 0.4; }
        .footer p { font-size: 10px; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 2px; }
        .footer-links { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: #94a3b8; }
        .footer-links button { background: none; border: none; color: #94a3b8; cursor: pointer; }
        #custom-toast { position: fixed; top: 40px; left: 50%; transform: translate(-50%, -20px); background: rgba(30, 41, 59, 0.95); color: white; padding: 12px 20px; border-radius: 16px; display: flex; align-items: center; gap: 12px; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999; }
        #custom-toast.show { opacity: 1; transform: translate(-50%, 0); }
        #custom-toast img { width: 24px; height: 24px; border-radius: 6px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 9999; display: none; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; padding: 24px; margin: 0 auto; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-body { font-size: 13px; color: #475569; overflow-y: auto; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="custom-toast">
        <img src="/logo.jpg"><div><p style="font-size:11px;color:#94a3b8;">SOCKS5 提醒</p><p id="toast-msg" style="font-size:13px;">提示</p></div>
    </div>
    <div class="header">
        <img src="/logo.jpg"><h2>欢迎回来</h2><p>登录以继续使用 SOCKS5 服务</p>
    </div>
    <div class="card">
        <form id="login-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group"><input type="password" id="password" required placeholder="密码"></div>
            <button type="submit" class="btn">安全登录</button>
        </form>
        <div class="link-text"><a href="/register.html">没有账号？立即注册</a></div>
        <div class="divider"><span>快捷授权登录</span></div>
        <div class="auth-icons">
            <button onclick="showToast('请前往 Telegram 机器人内点击专属按钮')"><img src="/tg.jpg"></button>
            <button onclick="showToast('请前往 SafeW 机器人内点击专属按钮')"><img src="/safew.jpg"></button>
            <button onclick="showToast('请前往 Mivra 机器人内点击专属按钮')"><img src="/mivra.jpg"></button>
        </div>
    </div>
    <div class="footer">
        <img src="/logo.jpg"><p>Powered by SOCKS5 Secure</p>
        <div class="footer-links">
            <button onclick="openModal('privacy')">隐私政策</button> | <button onclick="openModal('terms')">用户协议</button> | <button onclick="openModal('about')">关于我们</button>
        </div>
    </div>
    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modal-title" style="font-size:18px;font-weight:700;">标题</h3><button onclick="closeModal()" style="background:none;border:none;font-size:20px;color:#94a3b8;">✕</button></div>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('https://api.shuji.cc.cd/s5api/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', document.getElementById('email').value);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else { showToast(data.message || '登录失败'); }
            } catch (err) { showToast('网络错误'); }
        });
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('custom-toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }
        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性...' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务...' },
            'about': { title: '关于我们', text: 'SOCKS5 致力于为您提供全球领先的虚拟资产...' }
        };
        function openModal(type) {
            document.getElementById('modal-title').innerText = modalContent[type].title;
            document.getElementById('modal-body-content').innerText = modalContent[type].text;
            document.getElementById('info-modal').classList.add('active');
        }
        function closeModal() { document.getElementById('info-modal').classList.remove('active'); }
    </script>
</body>
</html>
