<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; justify-content: center;}
        .header { text-align: center; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; }
        .header h2 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }
        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); width: 100%; max-width: 380px; margin: 0 auto; }
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; }
        .code-row { display: flex; gap: 10px; }
        .code-row input { flex: 1; min-width: 0; }
        .btn-code { width: 110px; flex-shrink: 0; background: #f1f5f9; border: 1px solid #e2e8f0; color: #334155; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .agreement { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 12px; color: #64748b; }
        .agreement input { margin-top: 2px; width: 14px; height: 14px; accent-color: #2563eb; }
        .agreement a { color: #2563eb; text-decoration: none; }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(30,41,59,0.95); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; transition: all 0.3s; z-index: 99999; }
        #toast.show { top: 30px; }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div class="header"><img src="/logo.jpg"><h2>创建新账号</h2><p>请使用真实邮箱完成验证</p></div>
    <div class="card">
        <form id="reg-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group code-row">
                <input type="text" id="code" required placeholder="验证码">
                <button type="button" id="send-code-btn" class="btn-code">获取验证码</button>
            </div>
            <div class="input-group"><input type="password" id="password" required placeholder="设置密码 (至少8位)"></div>
            
            <label class="agreement">
                <input type="checkbox" id="agree-check">
                <span>我已阅读并同意 <a href="javascript:void(0)">《用户协议》</a> 和 <a href="javascript:void(0)">《隐私政策》</a></span>
            </label>
            
            <button type="submit" class="btn-primary" id="submit-btn">立即注册</button>
        </form>
        <div class="link-text"><a href="/login.html">已有账号？返回登录</a></div>
    </div>

    <script>
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // 1. 获取验证码（纯前端调 Cloudflare Worker 发信）
        document.getElementById('send-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            if(!email || !email.includes('@')) { showToast('请输入正确邮箱'); return; }
            
            this.disabled = true; this.innerText = '发送中...';
            
            const myCode = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem('my_verify_code', myCode);

            try {
                const res = await fetch('https://sendmail.lynli.me', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ email: email, code: myCode })
                });
                
                if (res.ok) {
                    showToast('验证码已发送');
                    let cd = 60; const btn = this;
                    const timer = setInterval(() => { cd--; btn.innerText = `${cd}s`; if(cd <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; } }, 1000);
                } else { 
                    showToast('发送失败'); this.disabled = false; this.innerText = '获取验证码'; 
                }
            } catch (e) { 
                showToast('网络错误'); this.disabled = false; this.innerText = '获取验证码'; 
            }
        });

        // 2. 提交注册（验证码正确后，去后端拿真 Token，免密进入）
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!document.getElementById('agree-check').checked) {
                showToast('请先同意用户协议和隐私政策'); return;
            }

            const btn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;

            if(code !== localStorage.getItem('my_verify_code')) {
                showToast('验证码错误'); return;
            }

            btn.innerText = '正在进入...'; btn.disabled = true;
            
            try {
                // 核心：只要验证码对了，直接去请求 702 网关，拿真实的 Token
                const res = await fetch('https://api.lynli.me/api/v1/auth/sso-login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ platform: 'email', open_id: email, nickname: email.split('@')[0] })
                });
                const data = await res.json();
                
                if (res.ok && data.code === 200) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data.token);
                    showToast('注册成功，正在进入...');
                    setTimeout(() => window.location.href = '/index.html', 800);
                } else { 
                    showToast('系统异常'); btn.innerText = '立即注册'; btn.disabled = false;
                }
            } catch (err) { 
                showToast('网络错误'); btn.innerText = '立即注册'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
