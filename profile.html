<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的账户 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 80px; }
        .app-card { background: white; border-radius: 12px; margin: 12px; padding: 16px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
        .asset-box { display: flex; flex-direction: column; justify-content: center; background: #ffffff; border-radius: 10px; padding: 16px; border: 1px solid #f1f5f9; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02); }
        .asset-box:active { background: #f8fafc; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: white; border-bottom: 1px solid #f1f5f9; cursor: pointer; text-decoration: none; color: inherit; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f8fafc; }
        .nav-tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #e2e8f0; z-index: 50; }
        .nav-tab-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #94a3b8; text-decoration: none; }
        .nav-tab-item.active { color: #2563eb; }
        .nav-tab-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- 统一白底导航 -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <h1 class="text-lg font-bold text-slate-800">我的账户</h1>
    </header>

    <a href="/settings.html" class="app-card flex items-center gap-4 mt-4 hover:bg-slate-50 transition-colors">
        <img id="user-avatar" src="/logo.jpg" class="w-16 h-16 rounded-full object-cover border border-slate-200">
        <div class="flex-1">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="user-nickname">加载中...</span>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </div>
            </h2>
            <p class="text-[13px] text-slate-500 mt-1">用户ID：<span id="user-id" class="text-slate-500 font-mono"></span></p>
            <p class="text-[13px] text-slate-500 mt-0.5">邮箱：<span id="user-email-sub"></span></p>
        </div>
        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </a>

    <div class="grid grid-cols-2 gap-3 mx-3 mt-4">
        <div class="asset-box" onclick="openDetail('账户余额明细', '暂无资金变动记录')">
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-6 bg-blue-50 text-blue-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>
                <span class="text-xs text-slate-500">账户余额</span>
            </div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('佣金余额明细', '暂无佣金变动记录')">
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-6 bg-orange-50 text-orange-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <span class="text-xs text-slate-500">佣金余额</span>
            </div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('消费总额明细', '暂无消费记录')">
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-6 bg-green-50 text-green-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                <span class="text-xs text-slate-500">消费总额</span>
            </div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('订单数量明细', '暂无订单记录')">
            <div class="flex items-center gap-2 mb-1">
                <div class="w-6 h-6 bg-slate-100 text-slate-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></div>
                <span class="text-xs text-slate-500">订单数量</span>
            </div>
            <p class="text-xl font-bold text-slate-800">0</p>
        </div>
    </div>

    <div class="app-card p-0 mt-4 overflow-hidden">
        <a href="/api-config.html" class="menu-item">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-50 text-indigo-500 rounded-lg flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg></div>
                <div><p class="text-sm font-bold text-slate-800">API 配置</p><p class="text-[11px] text-slate-400">用于对接第三方系统与外部发卡</p></div>
            </div>
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="/invite.html" class="menu-item">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-orange-50 text-orange-500 rounded-lg flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 2 2 0 018 0z"></path></svg></div>
                <div><p class="text-sm font-bold text-slate-800">邀请好友</p><p class="text-[11px] text-slate-400">分享专属链接，赚取高额佣金</p></div>
            </div>
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
    </div>

    <!-- 底部导航 -->
    <div class="nav-tab-bar">
        <a href="/index.html" class="nav-tab-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></a>
        <a href="/guide.html" class="nav-tab-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg><span>说明</span></a>
        <a href="/profile.html" class="nav-tab-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>我的</span></a>
    </div>

    <!-- 明细弹窗 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-end justify-center z-[9999]">
        <div class="bg-white w-full max-w-[400px] rounded-t-3xl p-6 max-h-[80vh] flex flex-col">
            <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                <h3 id="detail-title" class="text-lg font-bold text-slate-800">明细记录</h3>
                <button onclick="closeDetail()" class="text-slate-400 text-xl font-bold px-2">✕</button>
            </div>
            <div class="flex flex-col items-center justify-center text-slate-400 py-10">
                <p id="detail-text">暂无数据</p>
            </div>
        </div>
    </div>

    <script>
        const email = localStorage.getItem('socks5_email');
        if (!email) window.location.href = '/login.html';
        const isBoss = email === 'boss@lynli.me';
        
        document.getElementById('user-email-sub').innerText = email;
        document.getElementById('user-nickname').innerText = localStorage.getItem('socks5_nickname') || email.split('@')[0];
        document.getElementById('user-id').innerText = localStorage.getItem('socks5_user_id') || (isBoss ? '10001' : '---');
        document.getElementById('user-avatar').src = localStorage.getItem('socks5_avatar') || '/logo.jpg';

        function openDetail(title, text) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-text').innerText = text;
            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }
        function closeDetail() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('detail-modal').classList.remove('flex');
        }
    </script>
</body>
</html>
