<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>API 配置 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; } body { background-color: #f1f5f9; }</style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50"><a href="/profile.html" class="text-slate-600 text-xl font-bold px-2">←</a><h1 class="text-lg font-bold text-slate-800">API 配置</h1></header>

    <div class="p-4">
        <div class="bg-white rounded-xl p-4 shadow-sm mb-4">
            <p class="text-xs text-slate-500 mb-4 leading-relaxed">您可以使用此秘钥对接我们的开放接口，实现自动发卡、查单等功能。</p>
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1">
                    <p class="text-xs text-slate-500">APP Secret:</p>
                    <a href="/api-doc.html" class="text-xs text-blue-500">查看 API 文档</a>
                </div>
                <div class="flex border border-slate-200 rounded-lg overflow-hidden">
                    <input type="password" id="api-secret" readonly class="flex-1 px-3 py-2 text-sm bg-slate-50 outline-none text-slate-700 font-mono">
                    <button class="px-4 bg-slate-100 text-slate-500 border-l border-slate-200" onclick="togglePwd()">👁</button>
                    <button class="px-4 bg-slate-100 text-slate-500 border-l border-slate-200" onclick="copyVal()">复制</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const isBoss = localStorage.getItem('socks5_email') === 'boss@lynli.me';
        const fallbackSecret = isBoss ? 'sec_8f9c2d1b4e6f7a9c0b1d2e3f4a5b6c7d' : '---';
        document.getElementById('api-secret').value = localStorage.getItem('socks5_app_secret') || fallbackSecret;
        function togglePwd() { const i = document.getElementById('api-secret'); i.type = i.type === 'password' ? 'text' : 'password'; }
        function copyVal() { const v = document.getElementById('api-secret').value; if(v !== '---') navigator.clipboard.writeText(v).then(() => alert('已复制')); }
    </script>
<script src="/ai-widget.js"></script>
<script src="/notice.js"></script>
</body>
</html>
