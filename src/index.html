<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socks5 - 海外社媒账号一站式购平台</title>
    <link rel="icon" href="./assets/sok.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#f8fafc] text-gray-900 font-sans antialiased pb-16 overflow-x-hidden">

    <!-- 顶部导航 (由 JS 动态注入) -->
    <div id="app-header"></div>

    <!-- 跑马灯公告 -->
    <div class="bg-[#eff6ff] border-b border-blue-100 py-2 overflow-hidden flex whitespace-nowrap">
        <div class="marquee inline-block text-xs text-blue-800 font-medium">
            ⚠️ 订单卡密仅保留 30 天，逾期系统自动清除且无法恢复，请及时备份！ ⚠️【防诈骗提醒】符合售后政策的补号、换号均无需额外付费！请勿通过第三方小程序、私人账户或陌生链接付款，谨防假冒客服诈骗。
        </div>
    </div>

    <!-- 实时在线 -->
    <div class="bg-blue-50 px-4 py-1 flex items-center justify-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <span class="text-[11px] font-bold text-blue-900 tracking-wide">平台实时在线 · 即时发货</span>
    </div>

    <!-- Hero 区域 -->
    <div class="bg-hero-glow px-4 pt-8 pb-8 text-center">
        <h2 class="text-[34px] font-black leading-tight mb-2 text-gray-900 tracking-tight">
            <span class="text-blue-600">socks5</span> 海外社媒账号<br>一站式购平台
        </h2>
        <p class="text-sm text-gray-500 font-medium mb-6">Telegram·Twitter·Tiktok·Facebook全品类账号供应</p>
        
        <div class="bg-white rounded-2xl shadow-lg shadow-blue-500/10 border border-blue-50 flex items-center p-2 mb-4">
            <svg class="w-6 h-6 text-blue-400 ml-2 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" placeholder="找账号，如 电报老号、节点订阅..." class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-2">
        </div>
    </div>

    <!-- 热卖商品 -->
    <div class="px-4 pb-8">
        <div class="flex items-center gap-1 mb-3">
            <div class="w-1.5 h-4 bg-blue-600 rounded-full"></div>
            <h2 class="text-lg font-bold text-gray-900">热卖商品</h2>
        </div>
        <div class="flex gap-2 overflow-x-auto whitespace-nowrap scrollbar-hide pb-3">
            <button class="px-4 py-1.5 rounded-full bg-blue-600 text-white text-sm font-bold shadow-md shadow-blue-500/30">全部商品</button>
            <button class="px-4 py-1.5 rounded-full bg-white border border-gray-200 text-gray-600 text-sm">Telegram</button>
        </div>
        <!-- 动态商品列表挂载点 -->
        <div class="mt-4 grid grid-cols-1 gap-3" id="product-list"></div>
    </div>

    <!-- 底部导航 & 悬浮客服 (由 JS 动态注入) -->
    <div id="app-footer"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
