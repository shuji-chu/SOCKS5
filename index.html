<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOCKS5 商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
    <header class="app-header">
        <img src="/logo.jpg" class="app-logo">
        <h1 class="app-title">SOCKS5</h1>
    </header>
    <main class="content-wrap">
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-6 text-white mb-6 card-shadow relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500 rounded-full blur-2xl opacity-40"></div>
            <h2 class="text-2xl font-bold mb-2">企业级安全资产</h2>
            <p class="text-slate-300 text-sm">原生纯净环境 / 全自动极速发货 / 售后无忧</p>
        </div>
        
        <div class="flex bg-slate-200/60 p-1 rounded-xl mb-4 gap-1">
            <button onclick="document.querySelectorAll('.shop-list').forEach(el=>el.classList.add('hidden'));document.getElementById('list-tg').classList.remove('hidden')" class="flex-1 py-1.5 text-[13px] font-bold bg-white text-slate-800 rounded-lg shadow-sm transition-all">TG账号</button>
            <button onclick="document.querySelectorAll('.shop-list').forEach(el=>el.classList.add('hidden'));document.getElementById('list-node').classList.remove('hidden')" class="flex-1 py-1.5 text-[13px] font-medium text-slate-500 rounded-lg transition-all">专线节点</button>
            <button onclick="document.querySelectorAll('.shop-list').forEach(el=>el.classList.add('hidden'));document.getElementById('list-email').classList.remove('hidden')" class="flex-1 py-1.5 text-[13px] font-medium text-slate-500 rounded-lg transition-all">企业邮箱</button>
            <button onclick="document.querySelectorAll('.shop-list').forEach(el=>el.classList.add('hidden'));document.getElementById('list-apple').classList.remove('hidden')" class="flex-1 py-1.5 text-[13px] font-medium text-slate-500 rounded-lg transition-all">苹果ID</button>
        </div>

        <div id="list-tg" class="shop-list space-y-4">
            <div class="bg-white rounded-xl p-5 card-shadow border border-slate-100">
                <div class="flex justify-between items-start mb-2"><h4 class="font-bold text-slate-800 text-[15px]">TG 旗舰防封号 (美国)</h4><span class="text-blue-600 font-bold text-lg">¥ 68.00</span></div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">已稳定养号 90 天以上，附带原始邮箱与 2FA 密保。纯净住宅 IP 注册。</p>
                <button class="btn-primary w-full py-2.5 rounded-lg text-sm font-medium" onclick="buyProduct(1, 'TG 旗舰防封号', 68.00)">立即获取</button>
            </div>
        </div>

        <div id="list-node" class="shop-list space-y-4 hidden">
            <div class="bg-white rounded-xl p-5 card-shadow border border-slate-100">
                <div class="flex justify-between items-start mb-2"><h4 class="font-bold text-slate-800 text-[15px]">SVIP 独享住宅 IP</h4><span class="text-blue-600 font-bold text-lg">¥ 88.00</span></div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">原生纯净家宽 IP，全网独享。完美解锁各类流媒体与风控严格的业务。</p>
                <button class="btn-primary w-full py-2.5 rounded-lg text-sm font-medium" onclick="buyProduct(2, 'SVIP 独享住宅 IP', 88.00)">立即获取</button>
            </div>
        </div>

        <div id="list-email" class="shop-list space-y-4 hidden">
            <div class="bg-white rounded-xl p-5 card-shadow border border-slate-100">
                <div class="flex justify-between items-start mb-2"><h4 class="font-bold text-slate-800 text-[15px]">Gmail 纯净老邮箱</h4><span class="text-blue-600 font-bold text-lg">¥ 18.00</span></div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">注册于 1 年前，无手机绑定，无异地登录记录。附带备用验证邮箱。</p>
                <button class="btn-primary w-full py-2.5 rounded-lg text-sm font-medium" onclick="buyProduct(3, 'Gmail 纯净老邮箱', 18.00)">立即获取</button>
            </div>
        </div>

        <div id="list-apple" class="shop-list space-y-4 hidden">
            <div class="bg-white rounded-xl p-5 card-shadow border border-slate-100">
                <div class="flex justify-between items-start mb-2"><h4 class="font-bold text-slate-800 text-[15px]">美区 Apple ID</h4><span class="text-blue-600 font-bold text-lg">¥ 55.00</span></div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">美国本土原生环境注册，消费记录良好。可用于下载 App 与内购。</p>
                <button class="btn-primary w-full py-2.5 rounded-lg text-sm font-medium" onclick="buyProduct(4, '美区 Apple ID', 55.00)">立即获取</button>
            </div>
        </div>
    </main>

    <nav class="app-tab-bar">
        <a href="/index.html" class="tab-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></a>
        <a href="/orders.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>订单</span></a>
        <a href="/profile.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>我的</span></a>
    </nav>
    <script src="/app.js?v=6"></script>
</body>
</html>
