</style></head><body><header class="head"><div class="wrap row"><a class="btn" href="../user.html">← 个人中心</a><strong>全部订单</strong><button class="btn" id="refresh" type="button">刷新</button></div></header><main class="wrap"><p class="muted" id="summary">正在连接真实订单接口…</p><div class="filters"><button class="btn active" data-filter="全部">全部</button><button class="btn" data-filter="待支付">待支付</button><button class="btn" data-filter="已完成">已完成</button><button class="btn" data-filter="其他">其他状态</button></div><input class="search" id="search" type="search" placeholder="搜索订单号、商品名称或套餐"><section class="panel orders" id="orders"><div class="empty">正在读取真实订单…</div></section></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),token=()=>localStorage.getItem('sosks5_token')||localStorage.getItem('tgx_token')||'';let orders=[],filter='全部',page=1,hasNext=false,total=null;function un(d){if(Array.isArray(d))return d;if(!d||typeof d!=='object')return[];for(const k of ['orders','items','records','list','results','data'])if(Array.isArray(d[k]))return d[k];return d.data&&typeof d.data==='object'?un(d.data):[]}function status(o){const s=String(o.status_text??o.status_label??o.status??o.pay_status??'未知').toLowerCase();if(/待支付|pending|unpaid|created|wait_pay/.test(s)||s==='0')return'待支付';if(/已完成|已支付|success|paid|complete|finished|已发货/.test(s)||s==='1')return'已完成';const paid=o.is_paid??o.paid??(typeof o.pay_status==='boolean'?o.pay_status:null);if(paid===true||Number(paid)===1)return'已完成';if(paid===false||(paid!==null&&paid!==undefined&&Number(paid)===0))return'待支付';return'其他'}function time(v){if(v==null||v==='')return'—';const d=typeof v==='number'?new Date(v<1e12?v*1000:v):new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}function amount(o){const explicitYuan=o.total_amount_yuan??o.amount_yuan??o.actual_amount_yuan??o.pay_amount_yuan;const v=explicitYuan??o.total_amount??o.amount??o.total??o.actual_amount??o.pay_amount??o.price;if(v==null)return'—';const n=Number(v);if(!Number.isFinite(n))return String(v);const unit=String(o.amount_unit??o.price_unit??o.currency_unit??'').toLowerCase();const inYuan=explicitYuan!=null||['yuan','cny','元','rmb'].includes(unit);return'¥'+(inYuan?n:n/100).toFixed(2)}function render(){const q=$('#search').value.trim().toLowerCase(),rows=orders.filter(o=>(filter==='全部'||status(o)===filter)&&[o.trade_no,o.order_no,o.id,o.product_name,o.plan_name,o.goods_name,o.name,o.title].some(v=>String(v??'').toLowerCase().includes(q)));$('#summary').textContent='总计 '+(total??orders.length)+' 笔订单 · 第 '+page+' 页 · 当前 '+rows.length+' 笔';$('#orders').innerHTML=rows.length?rows.map(o=>{const no=o.trade_no||o.order_no||o.id||'—',name=o.product_name||o.plan_name||o.goods_name||o.name||o.title||'商品信息未返回',created=o.created_at||o.created_time||o.create_time||o.add_time,paid=o.paid_at||o.pay_time||o.paid_time;const link='./order-detail.html?'+(o.trade_no?'trade_no=':o.order_no?'order_no=':'id=')+encodeURIComponent(o.trade_no||o.order_no||o.id||'');return'<article class="order"><div class="row"><span class="muted">订单号：'+esc(no)+'</span><span class="status">'+esc(o.status_text||o.status_label||status(o))+'</span></div><div class="row" style="margin-top:12px;align-items:flex-start"><div style="min-width:0"><b>'+esc(name)+'</b><p class="muted">创建：'+esc(time(created))+'</p>'+(paid?'<p class="muted">支付：'+esc(time(paid))+'</p>':'')+'</div><strong class="money">'+esc(amount(o))+'</strong></div><details class="detail"><summary>完整订单时间与金额</summary><div class="detail-grid"><span>订单号</span><span>'+esc(no)+'</span><span>商品</span><span>'+esc(name)+'</span><span>数量</span><span>'+esc(o.quantity??o.qty??1)+'</span><span>单价</span><span>'+esc(o.unit_price!=null?amount({amount:o.unit_price,amount_unit:o.amount_unit,price_unit:o.price_unit}):'—')+'</span><span>实付金额</span><span>'+esc(amount(o))+'</span><span>支付方式</span><span>'+esc(o.payment_method||o.payment||o.pay_type||'—')+'</span><span>创建时间</span><span>'+esc(time(created))+'</span><span>支付时间</span><span>'+esc(time(paid))+'</span><span>更新时间</span><span>'+esc(time(o.updated_at||o.update_time))+'</span></div></details><div style="margin-top:12px"><a class="btn" href="'+link+'">查看订单详情 ↗</a></div></article>'}).join('')+'<div class="row" style="padding:14px;grid-column:1/-1"><button class="btn" id="prevPage" type="button">上一页</button><span class="muted">第 '+page+' 页</span><button class="btn" id="nextPage" type="button">下一页</button></div>':'<div class="empty">'+(orders.length?'没有符合条件的订单':'服务端没有返回真实订单记录。请确认订单列表 API 已启用；此页不生成示例订单。')+'</div>';const prev=$('#prevPage'),next=$('#nextPage');if(prev)prev.disabled=page<=1;if(next)next.disabled=!hasNext;if(prev)prev.onclick=()=>load(page-1);if(next)next.onclick=()=>load(page+1)}async function load(nextPage=1){page=Math.max(1,nextPage);const t=token();if(!t){orders=[];$('#summary').textContent='未登录';$('#orders').innerHTML='<div class="empty">请先登录后查看订单。<p><a class="btn" href="../auth/login.html">前往登录</a></p></div>';return}$('#summary').textContent='正在读取订单…';$('#orders').innerHTML='<div class="empty">正在读取真实订单…</div>';let base=String(window.S5_ORDER_API_BASE||window.SOSKS5_API_BASE||'https://web.lynli.me');while(base.endsWith('/'))base=base.slice(0,-1);if(!/\/api\/v1$/i.test(base))base+='/api/v1';let last='订单列表接口不可用';for(const p of ['/user/orders?page='+page+'&page_size=100','/user/order/fetch?page='+page+'&page_size=100','/user/order/list?page='+page+'&page_size=100'])try{const r=await fetch(base+p,{headers:{Accept:'application/json',Authorization:'Bearer '+t},signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});let d={};try{d=await r.json()}catch{}if(r.status===401||r.status===403){last='登录已过期，请重新登录';break}if(!r.ok){last=p+' 返回 HTTP '+r.status;continue}if(d.success===false||d.error||d.status==='fail'){last=d.message||d.msg||'接口返回失败';continue}orders=un(d);if(orders.length||Array.isArray(d)||Array.isArray(d.data)||Array.isArray(d.orders)){const meta=d?.data&&typeof d.data==='object'&&!Array.isArray(d.data)?d.data:d;const n=Number(meta.total??meta.total_count??meta.pagination?.total??d.total);total=Number.isFinite(n)&&n>=orders.length?n:null;hasNext=total!==null?page*100<total:orders.length>=100;render();return}last='响应中没有订单数组'}catch(e){last=e.message||last}orders=[];$('#summary').textContent='订单读取失败';$('#orders').innerHTML='<div class="empty">'+esc(last)+'<p>为保护账户安全，不展示虚构订单。</p><button class="btn" id="retry">重试</button></div>';$('#retry')?.addEventListener('click',load)}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').addEventListener('input',render);$('#refresh').onclick=load;load()})();
