<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; }
        
        .header { text-align: center; margin-top: 30px; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }

        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; width: 100%; max-width: 380px; margin: 0 auto; }
        
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: all 0.2s; color: #1e293b; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        /* 验证码并排布局修复 */
        .code-row { display: flex; gap: 10px; }
        .code-row input { flex: 1; min-width: 0; } /* min-width:0 防止输入框把按钮挤出去 */
        .btn-code { width: 110px; flex-shrink: 0; background: #f1f5f9; border: 1px solid #e2e8f0; color: #334155; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-code:active { background: #e2e8f0; }

        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
        .btn-primary:active { background: #1d4ed8; transform: scale(0.98); }
        
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }

        .footer { text-align: center; margin-top: auto; padding-top: 40px; margin-bottom: 16px; }
        .footer img { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 12px; opacity: 0.4; filter: grayscale(100%); object-fit: cover; }
        .footer p.brand { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="/logo.jpg">
        <h2>创建新账号</h2>
        <p>请使用真实邮箱完成验证</p>
    </div>

    <div class="card">
        <form id="reg-form">
            <div class="input-group">
                <input type="email" id="email" required placeholder="工作邮箱">
            </div>
            <div class="input-group code-row">
                <input type="text" id="code" required placeholder="验证码">
                <button type="button" id="send-code-btn" class="btn-code">获取验证码</button>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder="设置密码 (至少8位)">
            </div>

            <button type="submit" class="btn-primary">立即注册</button>
        </form>
        
        <div class="link-text">
            <a href="/login.html">已有账号？返回登录</a>
        </div>
    </div>

    <div class="footer">
        <img src="/logo.jpg">
        <p class="brand">Powered by SOCKS5 Secure</p>
    </div>

    <script>
        document.getElementById('send-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            if(!email || !email.includes('@')) { alert('请输入正确邮箱'); return; }
            this.disabled = true; this.innerText = '发送中...';
            try {
                const res = await fetch('https://api.lynli.me/s5api/api/v1/passport/auth/send-code', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('验证码已发送，请查收邮箱');
                    let cd = 60; const btn = this;
                    const timer = setInterval(() => { cd--; btn.innerText = `${cd}s 后重试`; if(cd <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; } }, 1000);
                } else { alert(data.message || '发送失败'); this.disabled = false; this.innerText = '获取验证码'; }
            } catch (e) { alert('网络错误'); this.disabled = false; this.innerText = '获取验证码'; }
        });

        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;

            if(password.length < 8) { alert('密码至少需要8位'); return; }

            try {
                const res = await fetch('https://api.lynli.me/s5api/api/v1/passport/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password, code })
                });
                const data = await res.json();
                if (res.ok) { 
                    alert('注册成功，请登录'); 
                    window.location.href = '/login.html'; 
                } else { 
                    alert(data.message || '注册失败'); 
                }
            } catch (err) { alert('网络错误'); }
        });
    </script>
</body>
</html>
