<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061326"><title>全部订单 · SOSKS5</title><link rel="stylesheet" href="../css/style.css"><style>
:root{color-scheme:dark;--bg:#061326;--panel:#0d243d;--line:#25435f;--text:#eff7ff;--muted:#92abc5;--cyan:#55e8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#153e66,transparent 40%),var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,sans-serif}.wrap{width:min(960px,calc(100% - 28px));margin:auto}.head{position:sticky;top:0;z-index:5;padding:14px 0;background:#061326eF;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel{padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#102b47,#08192c);margin:14px 0}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid #55e8ff50;border-radius:10px;background:#55e8ff10;color:var(--cyan);text-decoration:none;cursor:pointer}.btn.active{background:linear-gradient(120deg,#55e8ff,#699cff);color:#061326}.muted{color:var(--muted);font-size:12px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.search{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#061629;color:var(--text)}.order{padding:15px 0;border-bottom:1px solid var(--line)}.order:last-child{border-bottom:0}.money{color:var(--cyan);font-size:21px;font-weight:850}.status{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px;color:var(--muted)}.empty{text-align:center;padding:36px 10px;color:var(--muted)}.detail{margin-top:12px}.detail summary{color:var(--cyan);cursor:pointer}.detail-grid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;padding:12px;background:#061629;border-radius:10px;margin-top:10px;overflow-wrap:anywhere}.detail-grid span:nth-child(odd){color:var(--muted)}@media(min-width:700px){.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.order{padding:14px;border:1px solid var(--line);border-radius:12px}} 
</style></head><body><header class="head"><div class="wrap row"><a class="btn" href="../user.html">← 个人中心</a><strong>全部订单</strong><button class="btn" id="refresh" type="button">刷新</button></div></header><main class="wrap"><p class="muted" id="summary">正在连接真实订单接口…</p><div class="filters"><button class="btn active" data-filter="全部">全部</button><button class="btn" data-filter="待支付">待支付</button><button class="btn" data-filter="已完成">已完成</button><button class="btn" data-filter="其他">其他状态</button></div><input class="search" id="search" type="search" placeholder="搜索订单号、商品名称或套餐"><section class="panel orders" id="orders"><div class="empty">正在读取真实订单…</div></section></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),token=()=>localStorage.getItem('sosks5_token')||localStorage.getItem('tgx_token')||'';let orders=[],filter='全部';function un(d){if(Array.isArray(d))return d;if(!d||typeof d!=='object')return[];for(const k of ['orders','items','records','list','results','data'])if(Array.isArray(d[k]))return d[k];return d.data&&typeof d.data==='object'?un(d.data):[]}function status(o){const s=String(o.status_text??o.status_label??o.status??o.pay_status??'未知').toLowerCase();if(/待支付|pending|unpaid|created|wait_pay|^0$/.test(s))return'待支付';if(/已完成|已支付|success|paid|complete|finished|已发货|^1$/.test(s))return'已完成';return'其他'}function time(v){if(v==null||v==='')return'—';const d=typeof v==='number'?new Date(v<1e12?v*1000:v):new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}function amount(o){const v=o.total_amount??o.amount??o.total??o.actual_amount??o.pay_amount??o.price;if(v==null)return'—';const n=Number(v);if(!Number.isFinite(n))return String(v);return'¥'+((o.amount_unit==='yuan'||o.price_unit==='yuan'||o.currency_unit==='yuan')?n:n/100).toFixed(2)}function render(){const q=$('#search').value.trim().toLowerCase(),rows=orders.filter(o=>(filter==='全部'||status(o)===filter)&&[o.trade_no,o.order_no,o.id,o.product_name,o.plan_name,o.goods_name,o.name,o.title].some(v=>String(v??'').toLowerCase().includes(q)));$('#summary').textContent='服务端返回 '+orders.length+' 笔订单 · 当前 '+rows.length+' 笔';$('#orders').innerHTML=rows.length?rows.map(o=>{const no=o.trade_no||o.order_no||o.id||'—',name=o.product_name||o.plan_name||o.goods_name||o.name||o.title||'商品信息未返回',created=o.created_at||o.created_time||o.create_time||o.add_time,paid=o.paid_at||o.pay_time||o.paid_time;const link='./order-detail.html?'+(o.trade_no?'trade_no=':o.order_no?'order_no=':'id=')+encodeURIComponent(o.trade_no||o.order_no||o.id||'');return'<article class="order"><div class="row"><span class="muted">订单号：'+esc(no)+'</span><span class="status">'+esc(o.status_text||o.status_label||status(o))+'</span></div><div class="row" style="margin-top:12px;align-items:flex-start"><div style="min-width:0"><b>'+esc(name)+'</b><p class="muted">创建：'+esc(time(created))+'</p>'+(paid?'<p class="muted">支付：'+esc(time(paid))+'</p>':'')+'</div><strong class="money">'+esc(amount(o))+'</strong></div><details class="detail"><summary>完整订单时间与金额</summary><div class="detail-grid"><span>订单号</span><span>'+esc(no)+'</span><span>商品</span><span>'+esc(name)+'</span><span>数量</span><span>'+esc(o.quantity??o.qty??1)+'</span><span>单价</span><span>'+esc(o.unit_price!=null?amount({amount:o.unit_price,amount_unit:o.amount_unit,price_unit:o.price_unit}):'—')+'</span><span>实付金额</span><span>'+esc(amount(o))+'</span><span>支付方式</span><span>'+esc(o.payment_method||o.payment||o.pay_type||'—')+'</span><span>创建时间</span><span>'+esc(time(created))+'</span><span>支付时间</span><span>'+esc(time(paid))+'</span><span>更新时间</span><span>'+esc(time(o.updated_at||o.update_time))+'</span></div></details><div style="margin-top:12px"><a class="btn" href="'+link+'">查看订单详情 ↗</a></div></article>'}).join(''):'<div class="empty">'+(orders.length?'没有符合条件的订单':'服务端没有返回真实订单记录。请确认订单列表 API 已启用；此页不生成示例订单。')+'</div>'}async function load(){const t=token();if(!t){orders=[];$('#summary').textContent='未登录';$('#orders').innerHTML='<div class="empty">请先登录后查看订单。<p><a class="btn" href="../auth/login.html">前往登录</a></p></div>';return}$('#summary').textContent='正在读取订单…';$('#orders').innerHTML='<div class="empty">正在读取真实订单…</div>';let last='订单列表接口不可用';for(const p of ['/user/order/fetch','/user/order/list','/user/orders'])try{const r=await fetch('https://web.lynli.me/api/v1'+p,{headers:{Accept:'application/json',Authorization:'Bearer '+t},signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});let d={};try{d=await r.json()}catch{}if(r.status===401||r.status===403){last='登录已过期，请重新登录';break}if(!r.ok){last=p+' 返回 HTTP '+r.status;continue}if(d.success===false||d.error||d.status==='fail'){last=d.message||d.msg||'接口返回失败';continue}orders=un(d);if(orders.length||Array.isArray(d)||Array.isArray(d.data)||Array.isArray(d.orders)){render();return}last='响应中没有订单数组'}catch(e){last=e.message||last}orders=[];$('#summary').textContent='订单读取失败';$('#orders').innerHTML='<div class="empty">'+esc(last)+'<p>为保护账户安全，不展示虚构订单。</p><button class="btn" id="retry">重试</button></div>';$('#retry')?.addEventListener('click',load)}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').addEventListener('input',render);$('#refresh').onclick=load;load()})();
</script></body></html>
