<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOSKS5 · 数字商品与节点服务</title>
    <link rel="icon" type="image/png" href="./assets/sok.png">
    <link rel="apple-touch-icon" href="./assets/sok.png">
    <meta name="theme-color" content="#edf6ff">
    <meta name="description" content="SOSKS5 数字商品、节点服务、用户中心与开发者 API。">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb', primarylight: '#3b82f6' } } } }
    </script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#f8fafc] text-slate-700 font-sans antialiased min-h-screen">

    <!-- 全局导航栏 -->
    <nav id="navbar" class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#/" class="flex items-center gap-2 cursor-pointer">
                <img src="./assets/sok.png" alt="Logo" class="w-8 h-8 rounded-lg" onerror="this.src='https://via.placeholder.com/32/2563eb/ffffff?text=T'">
                <span class="font-bold text-xl text-slate-900 tracking-tight">SOSKS5<span class="text-primary"> Store</span></span>
            </a>

            <div class="hidden md:flex items-center gap-1 text-sm font-medium">
                <a href="#/" class="px-3 py-2 rounded-lg hover:bg-gray-100 transition">Home</a>
                <a href="#/products" class="px-3 py-2 rounded-lg hover:bg-gray-100 transition">Products</a>
                <a href="#/query" class="px-3 py-2 rounded-lg hover:bg-gray-100 transition">Query</a>
                <a href="#/nodes" class="px-3 py-2 rounded-lg hover:bg-gray-100 transition">Nodes</a>
                <a href="./docs/" class="px-3 py-2 rounded-lg hover:bg-gray-100 transition">开发者文档</a>
            </div>

            <div class="hidden md:flex flex-1 max-w-xs mx-8">
                <input type="text" id="global-search" placeholder="Search accounts..." class="w-full bg-gray-50 border border-gray-200 rounded-full py-2 px-4 text-sm text-slate-700 focus:outline-none focus:border-primary transition">
            </div>

            <div id="nav-user-area" class="flex items-center gap-4 relative">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>
    </nav>

    <!-- 全局用户抽屉 -->
    <div id="user-drawer" class="hidden absolute top-16 right-4 w-64 bg-white border border-gray-200 rounded-xl shadow-2xl z-50 mt-2">
        <div class="p-4 border-b border-gray-100 bg-gray-50 rounded-t-xl">
            <p class="text-sm font-bold text-slate-900" id="drawer-username">User</p>
            <div class="mt-2 bg-white rounded-lg p-2 flex justify-between items-center border border-gray-200">
                <span class="text-xs text-gray-500">Wallet</span>
                <span class="text-green-600 font-bold" id="drawer-balance">$0.00</span>
            </div>
        </div>
        <div class="p-2 space-y-1 text-sm">
            <a href="#/dashboard" class="block px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Dashboard</a>
            <a href="#/orders" class="block px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">My Orders</a>
            <a href="#/wallet" class="block px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Wallet</a>
            <a href="#/query" class="block px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Query Console</a>
            <a href="#/nodes" class="block px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-slate-900 transition">Proxy Nodes</a>
        </div>
        <div class="p-2 border-t border-gray-100">
            <button onclick="App.logout()" class="w-full text-left px-3 py-2 text-red-500 hover:bg-red-50 rounded-lg">Logout</button>
        </div>
    </div>

    <!-- 页面主视图容器 -->
    <main id="app-view" class="max-w-7xl mx-auto px-4 py-8"></main>

    <!-- 全局模态框 (登录/注册) -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 border border-gray-200 relative shadow-xl">
            <button onclick="App.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-slate-900">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 z-[110] px-6 py-3 rounded-lg shadow-xl text-white font-bold bg-green-600"></div>

    <script src="./js/app.js"></script>
    <script src="./js/ai-chat.js"></script>
</body>
</html>
