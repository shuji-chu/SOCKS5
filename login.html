<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/style.css?v=23">
</head>
<body class="bg-slate-50 flex flex-col justify-between min-h-screen p-6 pb-4">
    
    <div class="text-center mt-12 mb-8">
        <img src="/logo.jpg" class="w-16 h-16 rounded-[1.25rem] mx-auto mb-4 object-cover shadow-sm border border-slate-200">
        <h2 class="text-[22px] font-bold text-slate-900 tracking-tight">欢迎回来</h2>
        <p class="text-[13px] text-slate-500 mt-1.5">登录以继续使用 SOCKS5 服务</p>
    </div>

    <!-- 核心登录面板 -->
    <div class="max-w-sm w-full mx-auto bg-white p-6 md:p-8 rounded-[2rem] card-shadow border border-slate-100">
        
        <!-- 优先展示邮箱密码登录 -->
        <form id="login-form" class="space-y-3.5">
            <input type="email" id="email" required placeholder="工作邮箱" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-[15px] transition-all">
            <input type="password" id="password" required placeholder="密码" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-[15px] transition-all">
            <button type="submit" class="btn-primary w-full py-3.5 rounded-2xl font-bold text-[15px] mt-2">安全登录</button>
        </form>
        
        <div class="text-center mt-5 mb-8">
            <a href="/register.html" class="text-[13px] font-medium text-blue-600 hover:text-blue-700">没有账号？立即注册</a>
        </div>

        <!-- 底部：精致的第三方 APP 图标快捷登录 -->
        <div class="relative mb-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
            <div class="relative flex justify-center text-[11px]"><span class="px-3 bg-white text-slate-400 tracking-wider">快捷授权登录</span></div>
        </div>

        <div class="flex items-center justify-center gap-6">
            <!-- Telegram 图标 -->
            <button onclick="handlePlatformLogin('tg')" class="w-14 h-14 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90">
                <svg class="w-7 h-7 text-[#229ED9]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
            </button>

            <!-- SafeW 图标 -->
            <button onclick="handlePlatformLogin('safew')" class="w-14 h-14 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90">
                <svg class="w-7 h-7 text-[#0F172A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </button>

            <!-- Mivra 图标 -->
            <button onclick="handlePlatformLogin('mivra')" class="w-14 h-14 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center hover:bg-slate-50 transition-all active:scale-90">
                <svg class="w-7 h-7 text-[#6D28D9]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </button>
        </div>
    </div>

    <!-- 底部 Logo 标识挂载 -->
    <div class="text-center mt-10 mb-4 flex flex-col items-center justify-center">
        <img src="/logo.jpg" class="w-7 h-7 rounded-lg mb-2.5 grayscale opacity-40 object-cover">
        <p class="text-[10px] font-semibold text-slate-400 tracking-widest uppercase">Powered by SOCKS5 Secure</p>
    </div>

    <script src="/app.js?v=23"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/v1/passport/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data?.token || data.token || '');
                    window.location.href = '/index.html';
                } else { alert(data.message || '登录失败'); }
            } catch (err) { alert('网络错误'); }
        });

        // 处理三个图标的点击事件
        function handlePlatformLogin(platform) {
            if (platform === 'mivra') {
                window.location.href = 'https://m.mivra.im/';
            } else if (platform === 'safew') {
                window.location.href = 'https://sfw.bar/';
            } else {
                alert('请前往 Telegram 机器人内点击专属按钮打开，或使用邮箱登录。');
            }
        }
    </script>
</body>
</html>
