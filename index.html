<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOCKS5 商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/style.css?v=9">
</head>
<body>
    <header class="app-header">
        <img src="/logo.jpg" class="app-logo">
        <h1 class="app-title">SOCKS5</h1>
    </header>
    
    <main class="content-wrap">
        <!-- 正规说明卡片 -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 card-shadow mb-6">
            <h2 class="text-[17px] font-bold text-slate-800 mb-4">为什么选择我们的服务？</h2>
            <ul class="list-disc pl-5 space-y-3 text-[13px] text-slate-600 mb-6 leading-relaxed">
                <li><strong>安全保障</strong> - 账号购买过程采用安全加密技术保护</li>
                <li><strong>质量保证</strong> - 提供高质量社交媒体账号，适合各种营销用途</li>
                <li><strong>售后支持</strong> - 账号购买后提供专业的技术支持和售后服务</li>
                <li><strong>价格优惠</strong> - 批量账号出售享受更多优惠，性价比高</li>
            </ul>
            <h2 class="text-[17px] font-bold text-slate-800 mb-4">购买流程</h2>
            <ol class="list-decimal pl-5 space-y-3 text-[13px] text-slate-600 leading-relaxed">
                <li>浏览选择需要的账号类型</li>
                <li>确定购买数量并提交订单</li>
                <li>选择支付方式完成付款</li>
                <li>系统自动发货到您的邮箱</li>
                <li>享受售后技术支持服务</li>
            </ol>
        </div>
        
        <!-- 商品分类入口 -->
        <h3 class="font-bold text-slate-800 mb-3 text-[16px]">选择商品分类</h3>
        <div class="grid grid-cols-2 gap-3">
            <a href="/list-tg.html" class="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex flex-col items-center justify-center text-center active:bg-slate-50">
                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-700 text-sm">TG 账号</h4>
            </a>
            
            <a href="/list-node.html" class="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex flex-col items-center justify-center text-center active:bg-slate-50">
                <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-700 text-sm">专线节点</h4>
            </a>

            <a href="/list-email.html" class="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex flex-col items-center justify-center text-center active:bg-slate-50">
                <div class="w-10 h-10 bg-green-50 text-green-600 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-700 text-sm">企业邮箱</h4>
            </a>

            <a href="/list-apple.html" class="bg-white p-4 rounded-xl border border-slate-200 card-shadow flex flex-col items-center justify-center text-center active:bg-slate-50">
                <div class="w-10 h-10 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center mb-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.21-.93 3.57-.8 1.53.1 2.77.81 3.58 2.02-3.07 1.73-2.54 5.76.54 6.94-.72 1.89-1.63 3.76-2.77 5.07zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                </div>
                <h4 class="font-bold text-slate-700 text-sm">苹果 ID</h4>
            </a>
        </div>
    </main>

    <!-- 只保留首页和我的 -->
    <nav class="app-tab-bar">
        <a href="/index.html" class="tab-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></a>
        <a href="/profile.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>我的</span></a>
    </nav>
    <script src="/app.js?v=9"></script>
</body>
</html>
