<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - S5 · 晴天社区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } }</script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="../../css/footer-ecosystem.css"><link rel="icon" type="image/png" href="../..../../assets/logo.png"><link rel="apple-touch-icon" href="../..../../assets/logo.png"><link rel="stylesheet" href="/css/global-video-bg.css"></head>
<body class="bg-[#f8fafc] text-slate-700 font-sans min-h-screen" x-data="{ payMethod: 'wallet', notes: '' }">
    
    <div class="max-w-5xl mx-auto px-4 py-12" x-init="$store.app.requireAuth('/checkout.html')">
        <h1 class="text-3xl font-bold text-slate-900 mb-8">Checkout</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 左侧：订单预览 -->
            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Order Preview</h2>
                <div class="space-y-3 mb-6">
                    <template x-for="item in $store.app.cart" :key="item.id">
                        <div class="flex justify-between text-sm">
                            <span x-text="item.title + ' x ' + item.qty" class="truncate pr-4"></span>
                            <span x-text="'$' + (item.price * item.qty).toFixed(2)"></span>
                        </div>
                    </template>
                </div>
                <div class="border-t border-gray-200 pt-4 flex justify-between font-bold text-xl text-slate-900">
                    <span>Total</span><span x-text="'$' + $store.app.cartTotal.toFixed(2)"></span>
                </div>
            </div>

            <!-- 右侧：支付方式 -->
            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Payment Method</h2>
                
                <!-- 钱包支付 -->
                <label class="block bg-[#f8fafc] border border-gray-200 rounded-lg p-4 mb-4 cursor-pointer hover:border-primary transition" :class="{'border-primary ring-1 ring-primary': payMethod === 'wallet', 'opacity-50': $store.app.user.balance < $store.app.cartTotal}">
                    <div class="flex items-center gap-3">
                        <input type="radio" value="wallet" x-model="payMethod" :disabled="$store.app.user.balance < $store.app.cartTotal" class="text-primary focus:ring-primary bg-[#f8fafc]">
                        <div>
                            <div class="text-slate-900 font-bold">Wallet Balance</div>
                            <div class="text-sm text-gray-500">Available: <span x-text="'$' + $store.app.user.balance.toFixed(2)"></span></div>
                        </div>
                    </div>
                    <div x-show="$store.app.user.balance < $store.app.cartTotal" class="text-red-400 text-xs mt-2 ml-7">Insufficient wallet balance</div>
                </label>

                <!-- 第三方支付 -->
                <label class="block bg-[#f8fafc] border border-gray-200 rounded-lg p-4 cursor-pointer hover:border-primary transition" :class="{'border-primary ring-1 ring-primary': payMethod === 'external'}">
                    <div class="flex items-center gap-3">
                        <input type="radio" value="external" x-model="payMethod" class="text-primary focus:ring-primary bg-[#f8fafc]">
                        <div>
                            <div class="text-slate-900 font-bold">External Payment</div>
                            <div class="text-sm text-gray-500">Crypto / Credit Card</div>
                        </div>
                    </div>
                </label>

                <!-- 备注 -->
                <div class="mt-6">
                    <label class="block text-sm text-gray-500 mb-2">Order Notes (Optional)</label>
                    <textarea x-model="notes" maxlength="200" class="w-full bg-[#f8fafc] border border-gray-200 rounded-lg p-3 text-slate-900 focus:border-primary outline-none" rows="2"></textarea>
                </div>

                <button @click="$store.app.payWithWallet()" :disabled="$store.app.isLoading || $store.app.cart.length === 0" class="w-full mt-6 bg-primary text-slate-900 font-bold py-3 rounded-lg hover:bg-blue-600 disabled:opacity-50 flex justify-center items-center gap-2">
                    <span x-show="$store.app.isLoading" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                    <span x-text="$store.app.isLoading ? 'Processing...' : 'Place Order'"></span>
                </button>
                <p class="text-xs text-center text-gray-500 mt-3">All products are virtual goods. Delivered automatically.</p>
            </div>
        </div>
    </div>

    <!-- 全局 Loading / Toast 容器 -->
    <div x-show="$store.app.toast.show" x-transition class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50">
        <div class="px-6 py-3 rounded-lg shadow-xl text-slate-900 font-bold" :class="$store.app.toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'" x-text="$store.app.toast.message"></div>
    </div>
<footer class="s5-site-footer" aria-label="晴天社区网站页脚"><div class="footer-brandline"><img src="../..../../assets/logo.png" alt="晴天社区 Logo"><div><strong>晴天社区 · S5</strong><small>全球节点与数字服务生态</small></div></div><div class="footer-ecosystem"><div class="footer-ecosystem-title">更多即将上线</div><div class="ecosystem-items"><div class="ecosystem-item"><img src="../../assets/icons/sms-service.svg" alt="" aria-hidden="true"><span>接码服务</span></div><div class="ecosystem-item"><img src="../../assets/icons/domain-routing.svg" alt="" aria-hidden="true"><span>域名分发</span></div><div class="ecosystem-item"><img src="../../assets/icons/ai-platform.svg" alt="" aria-hidden="true"><span>AI 开放平台</span></div></div></div><div class="footer-copyright">© 2026 晴天社区 · S5 官方平台</div></footer><script src="/js/global-video-bg.js" defer></script></body>
</html>
