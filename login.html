const legalText={terms:"一、协议适用范围。本协议适用于访问、浏览、注册、登录或使用晴天社区网站及其页面、商品目录、账户中心、订阅管理、客服入口等功能的用户。用户开始使用相关服务前，应完整阅读本协议；如用户不同意任何条款，请停止注册或使用。网站页面、公告及特定服务规则构成本协议的组成部分，但不得以未明确展示的规则扩大用户义务。\n\n二、账户注册与信息真实性。用户应使用本人合法控制的邮箱注册，确保提交的信息真实、准确、完整并保持更新。用户不得冒用他人身份、盗用邮箱、批量创建虚假账户或利用自动化程序干扰注册流程。用户应妥善保管密码、验证码、访问令牌及设备，因用户保管不当、主动分享或终端感染恶意程序造成的损失，应结合实际过错依法承担责任。\n\n三、账户安全与通知。发现账户异常登录、凭证泄露、未经授权的操作或其他安全风险时，用户应尽快通过网站公开的客服渠道通知运营方，并在可行范围内修改密码、退出其他设备或采取保护措施。运营方可基于安全需要要求重新验证身份、限制可疑会话或暂时冻结风险操作，并在合理范围内向用户说明原因。\n\n四、服务内容与变更。网站展示的节点、数字账号及其他数字化服务，其名称、说明、库存、价格、可用区域、交付方式和服务期限以商品页面及下单时的确认信息为准。运营方可因维护、供应变化、第三方接口调整、法律政策或安全原因更新服务内容。涉及已确认订单的重要变更，应依法或依约向用户提供必要通知及处理方式。\n\n五、商品信息与订单确认。用户下单前应核对商品类型、数量、价格、服务周期、适用条件、交付渠道及退款规则。页面中的介绍性文字、示意图、预计库存或网络状态不构成对持续可用性或特定用途的绝对保证。订单是否成立、支付是否成功以及交付是否完成，应以服务端订单记录和支付渠道确认结果为准；不得仅凭浏览器提示推断交易已完成。\n\n六、支付与退款。支付应通过页面实际提供并明确展示的渠道完成。用户不得利用盗刷、拒付滥用、伪造支付凭证、洗钱或其他违法方式交易。退款、撤销、补发及争议处理按照购买时展示的具体规则和适用法律执行；如页面未明确约定，用户可联系运营方核实，不应将尚未确认的退款承诺视为既定事实。\n\n七、数字商品的使用边界。用户应遵守商品来源地、使用地及相关服务平台的法律法规和第三方服务条款。不得将商品用于诈骗、垃圾信息、未经授权访问、侵犯他人账号或数据、传播恶意软件、规避依法实施的安全措施或其他违法活动。用户不得将账号、节点或相关服务用于侵害他人合法权益的用途。\n\n八、禁止行为。用户不得攻击、扫描或干扰网站及其供应商的系统；不得绕过访问控制、破解接口、窃取凭证、植入恶意代码、批量抓取非公开数据、伪造请求、操纵库存或价格；不得发布违法、侵权、欺诈、骚扰或侵犯隐私的内容。发现漏洞时应负责任地向运营方报告，不得利用漏洞获取利益或扩大影响。\n\n九、第三方服务。网站可能链接至支付机构、通信平台、云服务商、内容分发网络或其他第三方服务。第三方服务由其各自运营者提供，适用其独立的服务条款和隐私政策。运营方会在合理范围内选择服务提供商，但无法控制第三方系统的全部运行、政策、网络质量或处理行为；用户使用第三方服务前应自行阅读其规则。\n\n十、网络与可用性。互联网连接、DNS、浏览器、运营商线路、跨境网络、缓存和第三方基础设施均可能影响访问速度与服务连续性。运营方将采取合理措施维护网站，但不承诺服务永不中断、所有地区均可访问或所有设备均完全兼容。计划维护、突发故障及不可控网络事件可能导致部分功能暂时不可用。\n\n十一、知识产权。网站中由运营方制作或依法获授权的文字、图形、标识、页面设计、程序代码和数据库结构等，受适用知识产权法律保护。未经权利人书面许可，用户不得复制、镜像、出售、反向工程、批量转载或移除权利标识；法律明确允许的合理使用除外。用户上传内容的权利归属不因上传而自动转移。\n\n十二、用户提交内容。用户应确保其提交的文字、图片、反馈及其他资料不侵犯第三方权利、不包含违法信息或恶意代码。用户授予运营方为展示、存储、处理、审核和提供用户主动请求的功能所必要的有限使用许可；该许可不意味着运营方取得用户内容的所有权。运营方可依法处理违规内容并保留必要记录。\n\n十三、风险提示。数字商品、网络连接和第三方平台可能存在供应变化、账号限制、线路波动、地区政策差异或服务规则调整。用户应根据自身需求评估适用性，不应将页面描述理解为投资、法律、税务或安全建议。涉及重要资料时，用户应自行做好备份并避免向任何人泄露密码、验证码、订阅链接或访问令牌。\n\n十四、责任限制与免责。对于运营方不能合理控制的电信网络故障、公共互联网中断、自然灾害、政府行为、战争、罢工、第三方平台停服、云服务商故障、恶意攻击及其他不可抗力或第三方原因，运营方将在合理范围内采取补救措施；法律允许的范围内，对由此产生的间接损失、预期利润损失或数据丢失不承担责任。本条不排除法律禁止排除的责任，也不免除运营方依法应承担的义务。\n\n十五、损失处理。任何责任限制均以适用法律允许为前提。若运营方依法应对用户承担责任，责任范围应结合实际违约行为、因果关系、用户过错及可证明的直接损失确定。用户不得通过夸大损失、重复索赔或隐瞒关键事实获得不当利益。双方应优先通过客服沟通、订单核查及合理补救方式解决争议。\n\n十六、未成年人保护。未达到所在地法律规定的独立订立相关服务合同年龄的用户，应在监护人指导和同意下使用服务。监护人应关注未成年人的网络消费、个人信息提供及第三方账号使用情况。网站不鼓励未成年人购买不适合其年龄的数字服务；发现不适当使用时，可联系运营方核查处理。\n\n十七、隐私与数据处理。本协议应与《隐私政策》一并阅读。运营方仅在提供服务、保障安全、履行法定义务及实现用户明确请求所需的范围内处理个人信息，并按隐私政策说明信息类别、用途、保存期限、共享情形及用户权利。用户可通过公开客服渠道提出查询、更正、删除或撤回授权等请求，运营方将依法处理。\n\n十八、协议更新。运营方可因服务变化、法律要求或安全需要修订本协议，并在网站页面公布更新版本及生效日期。对于可能实质影响用户权利义务的重大变化，运营方将采取合理方式提示。用户在更新生效后继续使用相关服务的，视为在法律允许范围内接受更新条款；不同意更新的用户应停止使用受影响的服务。\n\n十九、争议解决。双方应先通过网站公布的客服渠道友好协商。协商不成的，按照适用的强制性法律规定确定有管辖权的机构或法院，并适用依法应适用的法律。本协议任何条款被认定无效或不可执行，不影响其他条款的效力；对无效部分应以最接近原条款目的且合法有效的约定替代。\n\n二十、联系与解释。本协议用于说明网站服务的一般规则，不构成对任何具体商品交付结果的保证。有关订单、账号、隐私或安全的问题，请使用网站当前实际展示的客服入口联系运营方，并提供必要的订单编号或问题描述；请勿在公开渠道发送密码、验证码、完整支付凭证或访问令牌。",privacy:"一、政策说明。本隐私政策说明晴天社区网站在用户访问页面、创建账户、登录、浏览商品、提交订单、联系支持或使用其他功能时，可能如何收集、使用、保存、共享和保护个人信息。运营方遵循合法、正当、必要和诚信原则处理信息，并尽量以清晰方式告知处理目的、方式和范围。实际处理以网站当前启用的功能及适用法律要求为准。\n\n二、账户资料。注册或登录时，网站可能处理用户提供的邮箱地址、密码验证信息、邮箱验证码、邀请码、账户昵称、用户编号以及账户状态。密码应以安全方式验证或存储，页面不会要求用户向客服发送明文密码。邮箱用于账户识别、登录验证、必要的安全通知及用户主动请求的账户服务。\n\n三、设备与日志信息。为保障网站运行和安全，服务器或基础设施可能自动记录访问时间、请求路径、响应状态、浏览器类型、操作系统、语言设置、来源页面、设备类型、网络地址及异常诊断信息。此类信息可能用于排查故障、识别恶意请求、限制自动化滥用、统计服务可用性和调查安全事件。具体字段取决于服务器、托管商和安全服务的配置。\n\n四、服务使用信息。当用户主动浏览商品、提交订单、查看账户中心、复制订阅信息或联系客服时，系统可能处理相关操作记录、商品标识、订单状态、服务期限、账户余额或订阅状态等业务数据。运营方仅在提供相应功能、处理用户请求、履行交易及解决争议所需的范围内使用这些信息。\n\n五、支付信息。若网站接入支付服务，支付机构可能直接处理支付账号、交易金额、支付时间、渠道标识及交易状态。运营方通常仅接收完成订单核验所需的结果信息；除非页面明确说明且具备合法依据，网站不应要求用户在普通表单中提交完整银行卡密码或支付验证码。支付数据的处理还受支付机构自身隐私政策约束。\n\n六、Cookies 与本地存储。网站可能使用浏览器本地存储、会话存储或必要的 Cookie 保存登录令牌、账户状态、界面偏好及安全标记，以维持会话和提供用户请求的功能。用户可以通过浏览器设置清理或限制相关存储，但这可能导致退出登录、偏好重置或部分功能无法正常使用。不得将访问令牌分享给他人。\n\n七、使用目的。个人信息可能用于创建和管理账户、验证登录、发送用户请求的验证码、展示商品和订单、完成交付、提供客服、处理退款争议、维护网络安全、检测欺诈、修复程序错误、统计服务运行情况以及遵守法律义务。若拟将信息用于与原目的无关的新用途，运营方将依法重新告知并在需要时取得同意。\n\n八、处理依据。运营方根据适用法律，在履行用户请求或合同所必需、履行法定义务、保护合法权益、取得用户同意或其他合法依据下处理个人信息。对于依赖同意的处理，用户可以依法撤回同意；撤回不影响撤回前基于同意开展的处理活动的合法性。某些信息是提供账户或交易功能所必需，拒绝提供可能导致相关功能无法使用。\n\n九、第三方服务提供商。为托管网站、分发静态文件、发送邮件、处理支付、监测安全或提供客服，网站可能使用云服务商、内容分发网络、邮件服务商、支付机构及其他技术供应商。供应商仅应在受托目的和必要范围内处理相关信息，并根据适用法律及合同承担保护义务。具体供应商可能随服务部署而变化。\n\n十、信息共享。除实现用户主动请求的服务、委托处理、取得用户明确同意、履行法律义务、处理争议或保护用户及公众合法权益所必需外，运营方不会随意出售个人信息。若发生合并、收购、资产转让或业务重组，涉及个人信息转移时将依法告知接收方信息及其处理规则，并要求接收方继续履行相应保护义务。\n\n十一、公开披露。运营方仅在法律要求、司法或行政机关依法提出要求、为保护生命健康和重大财产安全、处理违法活动或维护网站及用户合法权益所必要的范围内披露信息。收到相关请求时，将依法核验请求主体、权限、目的和范围，并尽可能限制披露的数据种类和数量。\n\n十二、跨境传输。网站使用的网络基础设施或第三方供应商可能位于用户所在国家或地区之外，信息因此可能在不同司法辖区处理。若发生跨境提供个人信息，运营方将根据适用法律履行告知、取得同意、风险评估、标准合同或其他必要程序，并采取合理的安全措施。不同地区对个人信息的保护规则可能存在差异。\n\n十三、保存期限。运营方仅在实现处理目的所需的合理期限内保存个人信息，并结合账户存续、订单争议期限、财务记录要求、安全审计及法律规定确定具体期限。期限届满或处理目的实现后，将依法删除、匿名化或采取其他合法方式处理；因备份系统或法定留存要求暂不能立即删除的，将限制继续使用。\n\n十四、信息安全。运营方采取与信息风险相适应的管理和技术措施，例如访问权限控制、传输加密、凭证保护、日志审计、漏洞修复和备份管理。互联网传输及电子存储无法保证绝对安全，运营方不能承诺不存在任何风险；如发生依法需要通知的个人信息安全事件，将按照适用法律采取补救措施并履行通知义务。\n\n十五、用户权利。用户可根据所在地法律请求访问、更正、补充、删除个人信息，撤回同意，限制或反对特定处理，获取个人信息副本，或要求解释处理规则。用户可通过网站实际展示的客服渠道提出请求。为防止账户被冒用，运营方可能要求进行合理身份核验，并在法律允许的期限内答复。\n\n十六、账户删除与记录。用户可联系运营方申请注销账户或删除相关信息。注销前应处理未完成订单、余额、争议或其他待办事项。账户注销后，运营方将按法律要求删除或匿名化可删除的信息；依法必须保存的交易凭证、安全记录或争议材料，将在法定或必要期限内隔离保存，不再用于无关目的。\n\n十七、未成年人信息。网站并非专门面向未成年人设计。若当地法律要求监护人同意，未成年人应在监护人指导下使用服务。若运营方发现未经适当授权收集了未成年人个人信息，将依法采取删除、限制处理或其他适当措施。监护人可通过网站客服渠道提出核查请求。\n\n十八、邮件与通知。网站可能向用户提供的邮箱发送验证码、登录安全提醒、订单状态、服务变更或用户主动订阅的通知。必要的服务通知与营销信息应予区分。用户可按邮件中提供的方式退订非必要营销通知；退订营销信息不影响发送完成账户安全或履行交易所必需的通知。\n\n十九、外部链接。网站可能包含第三方网站、社交平台、支付页面或客服工具的链接。打开外部链接后，用户的信息处理由相应第三方负责，适用其独立隐私政策和服务条款。运营方无法控制第三方网站的内容、跟踪技术或安全措施，建议用户在提交信息前核实域名和服务主体。\n\n二十、政策变更。随着产品功能、供应商或法律要求变化，本政策可能更新。更新版本将在网站公布，并注明适用日期；涉及个人信息处理目的、方式或种类的重大变化时，运营方将依法采取适当方式再次告知并在需要时取得同意。用户应定期查看政策，以了解当前的信息处理规则。\n\n二十一、联系渠道。用户如对个人信息处理有疑问、投诉或权利请求，可通过网站当前公开的客服入口联系运营方，并尽可能说明账户邮箱、请求事项和必要的证明材料。请勿通过公开评论、社群或非官方人员发送密码、邮箱验证码、完整支付凭证、访问令牌或其他敏感凭据。\n\n二十二、政策边界。本政策描述网站可能涉及的信息处理类别，并不表示每项技术均在所有页面或所有时间启用。具体收集情况应以实际页面、浏览器权限提示、服务端配置和用户使用的功能为准。运营方不会仅凭本政策声称已启用某项未实际部署的分析、广告或定位功能；如功能发生变化，将依法更新告知内容。"};

function updateGate(){const allowed=verified&&$('agree').checked;$('submitBtn').disabled=!allowed;$('sendCode').disabled=!allowed||$('sendCode').dataset.counting==='1';$('verifyState').textContent=verified?'验证通过':'待验证';$('verifyState').classList.toggle('done',verified);$('agreeError').textContent=$('agree').checked?'':'请阅读并勾选用户协议与隐私政策'}
function resetVerify(){verified=false;$('verifySlider').value='0';$('verifySlider').disabled=false;$('verifySlider').setAttribute('aria-valuetext','尚未完成验证');updateGate()}
function setMode(next){mode=next;$('formTitle').textContent=mode==='login'?'欢迎回来':'创建账户';$('formDesc').textContent=mode==='login'?'登录以继续访问你的个人空间。':'验证邮箱并创建安全账户。';$('codeField').hidden=mode==='login';$('confirmField').hidden=mode==='login';$('inviteField').hidden=mode==='login';$('submitBtn').textContent=mode==='login'?'登录':'创建账户';$('switchMode').textContent=mode==='login'?'没有账号？立即注册':'已有账号？立即登录';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('codeError').textContent='';$('confirmError').textContent='';$('passwordError').textContent='';msg('');resetVerify()}
$('switchMode').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
const inviteParam=new URLSearchParams(location.search).get('short_id')||new URLSearchParams(location.search).get('invite_code')||new URLSearchParams(location.search).get('invite')||'';if(/^\d{5}$/.test(inviteParam)){ $('invite').value=inviteParam;setMode('register'); }else if(new URLSearchParams(location.search).get('mode')==='register'){setMode('register')}
$('agree').addEventListener('change',updateGate);
$('verifySlider').addEventListener('input',event=>{if(Number(event.target.value)>=96){verified=true;event.target.value='100';event.target.disabled=true;event.target.setAttribute('aria-valuetext','验证通过')}updateGate()});
$('email').addEventListener('input',()=>{if($('email').value)validateEmail()});
function validateEmail(){const ok=emailRe.test($('email').value.trim());$('email').classList.toggle('invalid',!ok);$('emailError').textContent=ok?'':'请输入有效的邮箱地址';return ok}
async function request(path,body){let response;try{response=await fetch(API+path,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(body)})}catch(error){console.error('[S5 auth] request failed',path,error);throw Error('网络连接失败，请检查网络后重试')}let data={};try{data=await response.json()}catch{}if(!response.ok||data.success===false||data.status==='fail'||data.error||data.http_status&&Number(data.http_status)!==200)throw Error(data.message||data.msg||data.detail||('请求未成功（HTTP '+response.status+'）'));return data.data??data}
$('sendCode').addEventListener('click',async()=>{if(!verified||!$('agree').checked){msg('请先完成滑动验证并同意协议');return}if(!validateEmail())return;const button=$('sendCode');button.disabled=true;button.dataset.counting='1';button.textContent='发送中…';try{await request('/passport/auth/send-code',{email:$('email').value.trim()});let seconds=60;button.textContent=seconds+'s';countdown=setInterval(()=>{seconds--;if(seconds>0){button.textContent=seconds+'s';return}clearInterval(countdown);button.dataset.counting='0';button.textContent='获取验证码';updateGate()},1000);msg('验证码已发送，请检查邮箱')}catch(error){button.dataset.counting='0';button.textContent='获取验证码';updateGate();msg(error.message)}});
$('authForm').addEventListener('submit',async event=>{event.preventDefault();msg('');if(!verified){msg('请先完成滑动人机验证');return}if(!$('agree').checked){msg('请先阅读并同意用户协议与隐私政策');updateGate();return}let valid=validateEmail();const password=$('password').value;if(password.length<8){$('passwordError').textContent='密码至少需要 8 位';$('password').classList.add('invalid');valid=false}else{$('passwordError').textContent='';$('password').classList.remove('invalid')}if(mode==='register'){if(!$('code').value.trim()){$('codeError').textContent='请输入邮箱验证码';valid=false}if($('confirmPassword').value!==password){$('confirmError').textContent='两次输入的密码不一致';valid=false}}if(!valid)return;const button=$('submitBtn');button.disabled=true;button.textContent=mode==='login'?'登录中…':'注册中…';try{const data=mode==='login'?await request('/passport/auth/login',{email:$('email').value.trim(),password}):await request('/passport/auth/register',{email:$('email').value.trim(),code:$('code').value.trim(),password,invite_code:$('invite').value.trim()});const token=data.token||data.auth_data||data.access_token;if(!token)throw Error('服务端未返回登录凭证');localStorage.setItem('sosks5_token',token);localStorage.setItem('tgx_token',token);if(data.user){localStorage.setItem('sosks5_user',JSON.stringify(data.user));localStorage.setItem('tgx_user',JSON.stringify(data.user))}const requested=new URLSearchParams(location.search).get('redirect')||'user.html';const allowed=['user.html','promo.html','shop.html','index.html'];location.href='./'+(allowed.includes(requested)?requested:'user.html')}catch(error){msg(error.message||'操作失败');console.error('[S5 auth] submit failed',error)}finally{button.textContent=mode==='login'?'登录':'创建账户';updateGate()}});
function openLegal(type){previousFocus=document.activeElement;$('legalTitle').textContent=type==='terms'?'用户协议':'隐私政策';$('legalContent').textContent=legalText[type];$('legalBackdrop').hidden=false;$('legalClose').focus()}
function closeLegal(){$('legalBackdrop').hidden=true;if(previousFocus&&previousFocus.focus)previousFocus.focus()}
document.querySelectorAll('[data-legal]').forEach(button=>button.addEventListener('click',()=>openLegal(button.dataset.legal)));
$('legalClose').addEventListener('click',closeLegal);$('legalConfirm').addEventListener('click',closeLegal);$('legalBackdrop').addEventListener('click',event=>{if(event.target===$('legalBackdrop'))closeLegal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('legalBackdrop').hidden)closeLegal()});
updateGate();
})();
</script></body></html>
