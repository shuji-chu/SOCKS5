<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>管理员登录 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at top right, #1e293b, #0f172a); }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-dark { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-dark:focus { border-color: #3b82f6; }
        
        /* 磨砂弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 300px; text-align: center; transform: scale(0.95); transition: transform 0.2s; opacity: 0; }
        .modal-overlay.active .modal-box { transform: scale(1); opacity: 1; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <h1 class="text-[22px] font-bold mb-1">SYSTEM ADMIN</h1>
        </div>
        <div class="space-y-4">
            <input type="text" id="admin-user" class="input-dark" placeholder="管理员账号" value="boss@lynli.me">
            <input type="password" id="admin-pass" class="input-dark" placeholder="安全密钥 (默认: admin888)">
            <button onclick="doLogin()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl mt-2 active:scale-95 transition-transform">授权登录</button>
        </div>
    </div>

    <!-- 专属报错弹窗 -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="w-12 h-12 rounded-full bg-red-500/20 text-red-500 mx-auto flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-[17px] font-bold text-white mb-2">授权失败</h3>
            <p class="text-[13px] text-slate-400 mb-6" id="error-msg">密码错误，请重试。</p>
            <button onclick="closeErrorModal()" class="w-full py-2.5 bg-slate-700 text-white font-bold rounded-xl active:bg-slate-600 transition-colors">我知道了</button>
        </div>
    </div>

    <script>
        function doLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            
            if (user === 'boss@lynli.me' && pass === 'admin888') {
                localStorage.setItem('admin_token', 'tk_boss_' + Date.now());
                localStorage.setItem('user_role', 'boss');
                window.location.href = '/admin.html';
            } else {
                document.getElementById('error-msg').innerText = '账号或安全密钥错误，请重试。';
                document.getElementById('error-modal').classList.add('active');
            }
        }
        
        function closeErrorModal() {
            document.getElementById('error-modal').classList.remove('active');
        }
    </script>
</body>
</html>
