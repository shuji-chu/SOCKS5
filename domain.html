<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>域名分发中心 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 20px; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="/index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
            <h1 class="text-[17px] font-bold text-slate-800">域名分发</h1>
        </div>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto space-y-4">
        <div class="card p-5 bg-gradient-to-br from-indigo-500 to-blue-600 text-white">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-[13px] text-blue-100 mb-1">当前可用额度</p>
                    <p class="text-[36px] font-extrabold" id="domain-quota">1</p>
                </div>
                <a href="/invite.html" class="bg-white/20 px-3 py-1.5 rounded-lg text-[12px] backdrop-blur-sm">获取更多额度</a>
            </div>
            <p class="text-[12px] text-blue-200">消费满 200 / 邀请 5 人 / 首单加群 即可获赠额度。有效期 90 天。</p>
        </div>

        <div class="card p-5">
            <h3 class="text-[16px] font-bold text-slate-800 mb-4">免费注册二级域名</h3>
            <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 mb-4">
                <input type="text" id="domain-input" oninput="previewDomain()" placeholder="请输入您想要的前缀" class="bg-transparent outline-none flex-1 text-[15px]">
                <span class="text-[15px] font-bold text-slate-400">.lynli.me</span>
            </div>
            <p class="text-[12px] text-blue-600 mb-3 h-4" id="domain-preview"></p>
            <button onclick="registerDomain()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl text-[15px] active:opacity-80">立即注册</button>
        </div>
        
        <div class="card overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-[15px] font-bold text-slate-800">我的域名</h3>
            </div>
            <div id="domain-list" class="divide-y divide-slate-100"></div>
        </div>
    </main>

    <script src="/notice.js"></script>
    <script src="/ai-widget.js"></script>
    <script>
        let quota = parseInt(localStorage.getItem('domain_quota') || '1');
        let myDomains = JSON.parse(localStorage.getItem('my_domains') || '[]');
        document.getElementById('domain-quota').innerText = quota;

        function previewDomain() {
            const val = document.getElementById('domain-input').value.trim();
            const pre = document.getElementById('domain-preview');
            if(val) pre.innerText = `预览: ${val}.lynli.me`;
            else pre.innerText = '';
        }

        function renderDomains() {
            const list = document.getElementById('domain-list');
            if (myDomains.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-slate-400 text-[13px]">暂无域名，快去注册一个吧</div>';
                return;
            }
            list.innerHTML = myDomains.map(d => `
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="text-[15px] font-bold text-blue-600">${d.name}.lynli.me</p>
                        <p class="text-[11px] text-slate-400 mt-1">注册: ${d.date} | 到期: ${d.expire}</p>
                    </div>
                    <a href="/domain-manage.html?domain=${d.name}" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-[13px] font-bold">解析管理</a>
                </div>
            `).join('');
        }

        function registerDomain() {
            const prefix = document.getElementById('domain-input').value.trim();
            if (!prefix) { alert('请输入域名前缀'); return; }
            if (quota <= 0) { alert('额度不足，请前往邀请页获取'); return; }
            
            const today = new Date();
            const expireDate = new Date(today);
            expireDate.setDate(today.getDate() + 90);

            myDomains.push({ name: prefix, date: today.toISOString().split('T')[0], expire: expireDate.toISOString().split('T')[0] });
            quota--;
            
            localStorage.setItem('my_domains', JSON.stringify(myDomains));
            localStorage.setItem('domain_quota', quota.toString());
            
            document.getElementById('domain-quota').innerText = quota;
            document.getElementById('domain-input').value = '';
            document.getElementById('domain-preview').innerText = '';
            renderDomains();
            alert('注册成功！有效期 90 天。');
        }
        renderDomains();
    </script>
</body>
</html>
