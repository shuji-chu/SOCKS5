<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf4ff"><title>晴天社区 · 登录与注册</title><link rel="icon" href="./assets/logo.png"><link rel="stylesheet" href="./css/global-video-bg.css"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172b45}body{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at 15% 15%,#d8efff,transparent 48%),radial-gradient(ellipse at 90% 85%,#dce5ff,transparent 45%),linear-gradient(135deg,#f8fcff,#eaf3ff)}.auth-shell{width:min(980px,100%);display:grid;grid-template-columns:1fr 430px;gap:20px;align-items:stretch}.auth-intro,.auth-card{border:1px solid #fff9;background:#ffffffb8;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:28px;box-shadow:0 24px 80px #315d8b20}.auth-intro{padding:42px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#ffffffd9,#e8f3ffba)}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:18px}.brand img{width:42px;height:42px;object-fit:contain}.eyebrow{font-size:11px;letter-spacing:2px;color:#2874d8;font-weight:850}.intro-title{font-size:clamp(32px,4vw,48px);line-height:1.12;letter-spacing:-1.5px;margin:22px 0 14px}.intro-copy{color:#657b96;line-height:1.9;max-width:440px}.intro-foot{color:#7d91aa;font-size:12px}.auth-card{padding:30px;align-self:center}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:5px;background:#edf4fc;border-radius:14px;gap:5px;margin-bottom:24px}.tabs button{border:0;border-radius:10px;background:transparent;color:#72839a;padding:11px;font-weight:750;cursor:pointer;transition:.2s}.tabs button.active{background:#fff;color:#075bce;box-shadow:0 4px 15px #255e9d17}.form-title{font-size:25px;margin:0 0 5px}.muted{color:#8292a7;font-size:13px;margin:0 0 22px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:750;color:#435974;margin-bottom:7px}.field input{width:100%;height:48px;padding:0 14px;border:1px solid #dbe6f2;border-radius:12px;background:#ffffffd9;color:#172b45;outline:0;transition:.2s}.field input:focus{border-color:#2877e8;box-shadow:0 0 0 4px #2877e81a}.field input.invalid{border-color:#e34d64}.error{display:block;min-height:17px;color:#d83d56;font-size:11px;margin-top:4px}.code-row{display:flex;gap:8px}.code-row input{min-width:0;flex:1}.code-row button{flex:0 0 122px;border:1px solid #cfe0f4;background:#eff6ff;color:#075bce;border-radius:12px;font-size:12px;font-weight:750}.agree{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#647991;line-height:1.6;margin:17px 0}.agree input{margin-top:3px;accent-color:#075bce}.agree a{color:#075bce}.submit{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(110deg,#0866dc,#398cf3);color:white;font-weight:850;font-size:15px;box-shadow:0 10px 24px #126bdb35;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.notice{min-height:22px;margin-top:12px;color:#d83d56;font-size:12px}.switch-copy{text-align:center;margin-top:16px;font-size:12px;color:#8292a7}.switch-copy a{color:#075bce;font-weight:750}@media(max-width:760px){.auth-shell{grid-template-columns:1fr;max-width:440px}.auth-intro{padding:22px;min-height:160px}.auth-intro .intro-title{font-size:27px;margin:12px 0 5px}.intro-copy,.intro-foot{display:none}.auth-card{padding:24px}}
</style></head><body><main class="auth-shell"><section class="auth-intro"><div><div class="brand"><img src="./assets/logo.png" alt="S5"><span>晴天社区 · S5</span></div><div class="eyebrow" style="margin-top:48px">SECURE DIGITAL ACCESS</div><h1 class="intro-title">连接全球资源<br><span style="color:#0969dc">从这里开始</span></h1><p class="intro-copy">统一管理节点订阅、数字账号与个人资产。登录信息通过安全接口验证，账户状态以服务器返回为准。</p></div><div class="intro-foot">SECURE ACCESS · AVAILABLE 24/7</div></section><section class="auth-card"><div class="tabs"><button id="loginTab" class="active" type="button">登录</button><button id="registerTab" type="button">创建账户</button></div><h2 class="form-title" id="formTitle">欢迎回来</h2><p class="muted" id="formDesc">登录以继续访问你的个人空间。</p><form id="authForm" novalidate><div class="field"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><small class="error" id="emailError"></small></div><div class="field" id="codeField" hidden><label for="code">邮箱验证码</label><div class="code-row"><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="输入验证码"><button id="sendCode" type="button">获取验证码</button></div><small class="error" id="codeError"></small></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位密码"><small class="error" id="passwordError"></small></div><div class="field" id="confirmField" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码"><small class="error" id="confirmError"></small></div><div class="field" id="inviteField" hidden><label for="invite">邀请码（选填）</label><input id="invite" type="text" placeholder="输入邀请码或 short_id"></div><label class="agree"><input id="agree" type="checkbox"><span>我已阅读并同意 <a href="./article.html" target="_blank" rel="noopener">用户协议</a> 与隐私政策</span></label><small class="error" id="agreeError"></small><button class="submit" id="submitBtn" type="submit">登录</button><div class="notice" id="notice" role="status" aria-live="polite"></div></form><div class="switch-copy">返回 <a href="./index.html">晴天社区首页</a></div></section></main>
<script>
(function(){
const $=id=>document.getElementById(id),API='https://web.lynli.me/api/v1';let mode='login',countdown=null;
const emailRe=/^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/;
function msg(t){$('notice').textContent=t||''}
function setMode(next){mode=next;$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');$('formTitle').textContent=mode==='login'?'欢迎回来':'创建你的账户';$('formDesc').textContent=mode==='login'?'登录以继续访问你的个人空间。':'验证邮箱并创建安全账户。';$('codeField').hidden=mode==='login';$('confirmField').hidden=mode==='login';$('inviteField').hidden=mode==='login';$('submitBtn').textContent=mode==='login'?'登录':'创建账户';$('password').autocomplete=mode==='login'?'current-password':'new-password';msg('')}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
function validateEmail(){const ok=emailRe.test($('email').value.trim());$('email').classList.toggle('invalid',!ok);$('emailError').textContent=ok?'':'请输入有效的邮箱地址';return ok}
$('email').addEventListener('input',()=>{if($('email').value)validateEmail()});
async function request(path,body){let r;try{r=await fetch(API+path,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw Error('网络连接失败，请检查网络')}let d={};try{d=await r.json()}catch{}if(!r.ok||d.success===false||d.status==='fail'||d.error||d.http_status&&Number(d.http_status)!==200)throw Error(d.message||d.msg||d.detail||'请求未成功');return d.data??d}
$('sendCode').onclick=async()=>{if(!validateEmail())return;const b=$('sendCode');b.disabled=true;b.textContent='发送中…';try{await request('/passport/auth/send-code',{email:$('email').value.trim()});let n=60;b.textContent=n+'s';countdown=setInterval(()=>{n--;b.textContent=n>0?n+'s':'获取验证码';if(n<=0){clearInterval(countdown);b.disabled=false}},1000);msg('验证码已发送，请检查邮箱')}catch(e){b.disabled=false;b.textContent='获取验证码';msg(e.message)}};
$('authForm').addEventListener('submit',async e=>{e.preventDefault();msg('');let ok=validateEmail();const password=$('password').value;if(password.length<8){$('passwordError').textContent='密码至少需要 8 位';$('password').classList.add('invalid');ok=false}else{$('passwordError').textContent='';$('password').classList.remove('invalid')}
if(mode==='register'){if(!$('code').value.trim()){$('codeError').textContent='请输入邮箱验证码';ok=false}if($('confirmPassword').value!==password){$('confirmError').textContent='两次输入的密码不一致';ok=false}if(!$('agree').checked){$('agreeError').textContent='请先阅读并同意用户协议';ok=false}else $('agreeError').textContent=''}
if(!ok)return;const b=$('submitBtn');b.disabled=true;b.textContent=mode==='login'?'登录中…':'注册中…';try{const data=mode==='login'?await request('/passport/auth/login',{email:$('email').value.trim(),password}):await request('/passport/auth/register',{email:$('email').value.trim(),code:$('code').value.trim(),password,invite_code:$('invite').value.trim()});const token=data.token||data.auth_data||data.access_token;if(!token)throw Error('服务端未返回登录凭证');localStorage.setItem('sosks5_token',token);localStorage.setItem('tgx_token',token);if(data.user){localStorage.setItem('sosks5_user',JSON.stringify(data.user));localStorage.setItem('tgx_user',JSON.stringify(data.user))}location.href='./user.html'}catch(err){msg(err.message||'操作失败')}finally{b.disabled=false;b.textContent=mode==='login'?'登录':'创建账户'}});
})();
</script><script src="./js/global-video-bg.js" defer></script></body></html>
