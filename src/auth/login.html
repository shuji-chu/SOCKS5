<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 / 注册 - SOCKS5</title><link rel="icon" type="image/svg+xml" href="../../assets/images/logo.svg"><link rel="apple-touch-icon" href="../../assets/images/logo.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.08); }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #3b82f6; background: #fff; }
        
        /* 居中弹窗通用 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; transform: scale(0.95); transition: transform 0.2s; opacity: 0; text-align: left; }
        .modal-overlay.active .modal-box { transform: scale(1); opacity: 1; }

        /* 提示文字与协议 */
        .toast-text { font-size: 14px; color: #475569; line-height: 1.6; text-align: center; }
    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#f8f9fa]">
    <div class="card text-center relative overflow-hidden">
        <!-- 品牌 Logo 占位 -->
        <div class="w-16 h-16 bg-black rounded-lg mx-auto flex items-center justify-center mb-5 shadow-sm shadow-blue-500/30">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        
        <h1 class="text-[24px] font-extrabold text-slate-800 mb-1">SOCKS5 平台</h1>
        <p class="text-[13px] text-slate-500 mb-8" id="page-subtitle">登录您的账号以继续</p>

        <!-- 登录/注册切换 Tab -->
        <div class="flex bg-slate-100 p-1 rounded-lg mb-6">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-[14px] font-bold bg-white text-black rounded-lg shadow-sm transition-all">登录</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all">注册</button>
        </div>

        <!-- 表单区 -->
        <div class="space-y-4 mb-6 text-left">
            <div>
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">邮箱地址</label>
                <input type="email" id="auth-email" class="input-flat" placeholder="请输入邮箱" value="boss@lynli.me">
            </div>
            
            <!-- 注册时才显示的验证码输入框 -->
            <div id="code-box" class="hidden">
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">邮箱验证码</label>
                <div class="flex gap-2">
                    <input type="text" id="auth-code" class="input-flat flex-1" placeholder="6位数字验证码">
                    <button onclick="sendCode('register')" id="btn-send-code-reg" class="px-4 bg-slate-100 text-slate-600 text-[13px] font-bold rounded-lg whitespace-nowrap active:bg-slate-200 transition">获取验证码</button>
                </div>
            </div>

            <div>
                <label class="text-[13px] font-bold text-slate-700 mb-1.5 block">密码</label>
                <input type="password" id="auth-pass" class="input-flat" placeholder="请输入密码" value="123456">
            </div>
            
            <div class="flex justify-between items-center text-[12px]">
                <label class="flex items-center gap-1.5 text-slate-500 cursor-pointer">
                    <input type="checkbox" checked class="w-3.5 h-3.5 rounded border-slate-300 text-black focus:ring-blue-500">
                    记住我
                </label>
                <span onclick="openForgotModal()" class="text-black active:opacity-60 cursor-pointer font-medium">忘记密码？</span>
            </div>
        </div>

        <button onclick="doAuth()" id="btn-submit" class="w-full py-3.5 bg-black text-white font-bold rounded-lg text-[16px] active:opacity-80 transition shadow-sm shadow-blue-500/20 mb-6">立即登录</button>

        <!-- 底部合规协议 -->
        <div class="mt-8 text-center">
            <p class="text-[11px] text-slate-400">
                登录或注册即表示同意 
                <span onclick="openLegal('agreement')" class="text-black font-bold cursor-pointer active:opacity-60">用户协议</span> 
                与 
                <span onclick="openLegal('privacy')" class="text-black font-bold cursor-pointer active:opacity-60">隐私政策</span>
            </p>
        </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[17px] font-bold text-slate-800 mb-4 text-center">重置密码</h3>
            <div class="space-y-4 mb-5">
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1 block">注册邮箱</label>
                    <input type="email" id="forgot-email" class="input-flat" placeholder="请输入注册时的邮箱">
                </div>
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1 block">邮箱验证码</label>
                    <div class="flex gap-2">
                        <input type="text" id="forgot-code" class="input-flat flex-1" placeholder="请输入验证码">
                        <button onclick="sendCode('forgot')" id="btn-send-code-forgot" class="px-4 bg-slate-100 text-slate-600 text-[13px] font-bold rounded-lg whitespace-nowrap active:bg-slate-200 transition">获取验证码</button>
                    </div>
                </div>
                <div>
                    <label class="text-[13px] font-bold text-slate-700 mb-1 block">新密码</label>
                    <input type="password" id="forgot-new-pass" class="input-flat" placeholder="请输入新密码">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('forgot-modal')" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg active:bg-slate-200 transition">取消</button>
                <button onclick="submitForgotPassword()" class="flex-1 py-2.5 bg-black text-white font-bold rounded-lg active:opacity-80 transition">确认重置</button>
            </div>
        </div>
    </div>

    <!-- 通用提示弹窗 -->
    <div id="tip-modal" class="modal-overlay">
        <div class="modal-box text-center">
            <h3 class="text-[17px] font-bold text-slate-800 mb-2" id="tip-title">提示</h3>
            <p class="toast-text mb-6" id="tip-msg"></p>
            <button onclick="closeModal('tip-modal')" class="w-full py-2.5 bg-black text-white font-bold rounded-lg active:opacity-80 transition">我知道了</button>
        </div>
    </div>

    <!-- 协议与隐私弹窗 -->
    <div id="legal-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[17px] font-bold text-slate-800 mb-3 text-center" id="legal-title">用户协议</h3>
            <div class="legal-content max-h-[50vh] overflow-y-auto text-[13px] text-slate-600 leading-relaxed pr-1" id="legal-body"></div>
            <button onclick="closeModal('legal-modal')" class="mt-5 w-full py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg active:bg-slate-200 transition">我已阅读并知晓</button>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const subtitle = document.getElementById('page-subtitle');
            const codeBox = document.getElementById('code-box');
            const btnSubmit = document.getElementById('btn-submit');

            if (mode === 'login') {
                tabLogin.className = 'flex-1 py-2 text-[14px] font-bold bg-white text-black rounded-lg shadow-sm transition-all';
                tabRegister.className = 'flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all';
                subtitle.innerText = '登录您的账号以继续';
                codeBox.classList.add('hidden');
                btnSubmit.innerText = '立即登录';
            } else {
                tabRegister.className = 'flex-1 py-2 text-[14px] font-bold bg-white text-black rounded-lg shadow-sm transition-all';
                tabLogin.className = 'flex-1 py-2 text-[14px] font-bold text-slate-500 rounded-lg transition-all';
                subtitle.innerText = '注册一个全新的账号';
                codeBox.classList.remove('hidden');
                btnSubmit.innerText = '立即注册';
            }
        }

        // 通用倒计时逻辑
        const API_BASE = '/api';
        function sendCode(type) {
            let email = '';
            let btn = null;

            if(type === 'register') {
                email = document.getElementById('auth-email').value;
                btn = document.getElementById('btn-send-code-reg');
            } else {
                email = document.getElementById('forgot-email').value;
                btn = document.getElementById('btn-send-code-forgot');
            }

            if(!email) { showTip('请先输入邮箱地址'); return; }
            
            btn.disabled = true;
            btn.innerText = '发送中...';
            fetch(API_BASE + '/auth/send-code', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email })
            }).then(r => r.json()).then(data => {
                if (!data.ok) { showTip(data.message || '发送失败'); btn.disabled = false; btn.innerText = '获取验证码'; return; }
                let count = 60;
                btn.innerText = `${count}s 后重发`;
                const timer = setInterval(() => {
                    count--;
                    if(count <= 0) {
                        clearInterval(timer);
                        btn.innerText = '获取验证码';
                        btn.disabled = false;
                    } else {
                        btn.innerText = `${count}s 后重发`;
                    }
                }, 1000);
                showTip('验证码已发送至您的邮箱，请查收');
            }).catch(() => { showTip('网络错误'); btn.disabled = false; btn.innerText = '获取验证码'; });
        }

        // 登录/注册逻辑
        function doAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            
            if(!email || !pass) { showTip('请输入完整的邮箱和密码'); return; }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerText = '提交中...';

            if (currentMode === 'register') {
                const code = document.getElementById('auth-code').value;
                if(!code) { showTip('请输入验证码'); btn.disabled = false; btn.innerText = '立即注册'; return; }
                fetch(API_BASE + '/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, code: code, password: pass })
                }).then(r => r.json()).then(data => {
                    if (data.ok && data.token) {
                        localStorage.setItem('sosks5_token', data.token);
                        localStorage.setItem('sosks5_user', JSON.stringify(data.user));
                        showTip('注册成功，即将进入');
                        setTimeout(() => { window.location.href = '../index.html'; }, 800);
                    } else {
                        showTip(data.message || '注册失败');
                        btn.disabled = false; btn.innerText = '立即注册';
                    }
                }).catch(() => { showTip('网络错误'); btn.disabled = false; btn.innerText = '立即注册'; });
            } else {
                fetch(API_BASE + '/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, password: pass })
                }).then(r => r.json()).then(data => {
                    if (data.ok && data.token) {
                        localStorage.setItem('sosks5_token', data.token);
                        localStorage.setItem('sosks5_user', JSON.stringify(data.user));
                        showTip('登录成功，即将进入');
                        setTimeout(() => { window.location.href = '../index.html'; }, 800);
                    } else {
                        showTip(data.message || '登录失败');
                        btn.disabled = false; btn.innerText = '立即登录';
                    }
                }).catch(() => { showTip('网络错误'); btn.disabled = false; btn.innerText = '立即登录'; });
            }
        }                window.location.href = '/profile.html';
            }
        }

        // 忘记密码逻辑
        function openForgotModal() {
            // 自动带入上面输入的邮箱
            document.getElementById('forgot-email').value = document.getElementById('auth-email').value;
            openModal('forgot-modal');
        }

        function submitForgotPassword() {
            const email = document.getElementById('forgot-email').value;
            const code = document.getElementById('forgot-code').value;
            const newPass = document.getElementById('forgot-new-pass').value;

            if(!email || !code || !newPass) {
                showTip('请填写完整的重置信息'); return;
            }

            fetch(API_BASE + '/auth/reset', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, code: code, password: newPass })
            }).then(r => r.json()).then(data => {
                if (data.ok) {
                    closeModal('forgot-modal');
                    showTip('密码重置成功，请使用新密码登录');
                } else {
                    showTip(data.message || '重置失败');
                }
            }).catch(() => { showTip('网络错误'); });
        }
            // 模拟提交成功
            closeModal('forgot-modal');
            showTip('密码重置成功，请使用新密码登录');
        }

        // 弹窗通用控制
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showTip(msg) {
            document.getElementById('tip-msg').innerText = msg;
            openModal('tip-modal');
        }

        // 协议长文本加载
        const legalData = {
            agreement: {
                title: '用户服务协议',
                content: `<h4>一、总则</h4><p>1.1 本协议是您与 SOCKS5 平台之间就注册、登录及使用本平台服务所订立的协议。</p><p>1.2 您在注册或使用服务前，应认真阅读本协议。点击同意或实际使用即视为接受全部条款。</p><h4>二、账号安全</h4><p>2.1 您的账号所有权归本平台，您仅享有使用权，禁止转让或售卖。</p><p>2.2 您应妥善保管账号密码，因保管不善造成的损失由您自行承担。</p><h4>三、服务规范</h4><p>3.1 本平台提供数字资产分发、API 调用等服务。</p><p>3.2 您承诺不使用本平台从事电信诈骗、洗钱、黑客攻击等违法违规活动。违反者平台有权封号并移交司法机关。</p><h4>四、免责声明</h4><p>因不可抗力、网络故障、政策调整导致的服务中断，本平台不承担法律责任。</p>`
            },
            privacy: {
                title: '隐私政策',
                content: `<h4>一、信息收集</h4><p>1.1 当您注册时，我们会收集您的邮箱、加密密码、注册 IP，用于创建和保障账号安全。</p><p>1.2 当您使用 API 或节点时，我们会记录调用时间、参数和 IP，用于计费及故障排查。</p><h4>二、信息保护</h4><p>2.1 我们采用 HTTPS 加密传输、密码单向哈希、内部权限隔离等措施保护您的数据。</p><p>2.2 除法律强制要求或完成支付必须向支付机构传递外，不会向第三方共享您的信息。</p><h4>三、您的权利</h4><p>您有权随时访问、修改个人资料。注销账号后，我们将依规删除您的信息（交易记录除外）。</p>`
            }
        };

        function openLegal(type) {
            const data = legalData[type];
            document.getElementById('legal-title').innerText = data.title;
            document.getElementById('legal-body').innerHTML = data.content;
            openModal('legal-modal');
        }
    </script>

<script src="../js/notice.js"></script>
</body>
</html>
