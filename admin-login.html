<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>管理员登录 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at top right, #1e293b, #0f172a); }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-dark { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-dark:focus { border-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-blue-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-[22px] font-bold tracking-wider mb-1">SYSTEM ADMIN</h1>
            <p class="text-[12px] text-slate-400">SOCKS5 核心管理面板授权访问</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[12px] text-slate-400 mb-1 block">管理员账号</label>
                <input type="text" id="admin-user" class="input-dark" placeholder="请输入邮箱或ID" value="boss@lynli.me">
            </div>
            <div>
                <label class="text-[12px] text-slate-400 mb-1 block">安全密钥 / 密码</label>
                <input type="password" id="admin-pass" class="input-dark" placeholder="请输入密码">
            </div>
            <button onclick="doLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-[15px] transition shadow-lg shadow-blue-500/30 mt-2">授权登录</button>
        </div>
        
        <div class="text-center mt-6">
            <a href="/profile.html" class="text-[12px] text-slate-500 hover:text-slate-300">返回前台</a>
        </div>
    </div>

    <script>
        function doLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            
            // 前端模拟验证：账号是 boss@lynli.me，密码随便填（比如 123456）
            if (user === 'boss@lynli.me' && pass) {
                // 存入鉴权 Token
                localStorage.setItem('admin_token', 'admin_logged_in_xxx');
                window.location.href = '/admin.html';
            } else {
                alert('账号或密码错误！请使用老板邮箱登录。');
            }
        }
    </script>
</body>
</html>
