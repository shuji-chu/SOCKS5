<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>域名管理 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 20px; }
        
        /* 弹窗基础样式 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        
        /* 修复：SSL 弹窗只占屏幕 75%，且内部可滑动 */
        .ssl-container { 
            max-height: 75vh; 
            display: flex; 
            flex-direction: column;
            width: 92%; 
            max-width: 380px;
        }
        .ssl-scroll-area {
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        /* FAQ 手风琴动画 */
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #f8fafc; }
        .faq-answer.active { max-height: 200px; }
        .faq-icon { transition: transform 0.3s ease; }
        .faq-icon.active { transform: rotate(180deg); }

        /* 底部抽屉 (用于添加解析和绑定IP) */
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 24px 24px 0 0; z-index: 10000; transform: translateY(100%); transition: transform 0.3s ease-out; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
        .bottom-sheet.active { transform: translateY(0); }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/domain.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">域名解析管理</h1>
    </header>

    <main class="p-4">
        <!-- 域名信息头 -->
        <div class="bg-white border border-slate-100 p-4 rounded-xl shadow-sm mb-4">
            <h2 class="text-lg font-bold text-slate-800 mb-1">lynli.kz.ci</h2>
            <p class="text-xs text-slate-500">Asia/Singapore (UTC+8) · 状态正常</p>
        </div>

        <!-- 两个核心操作入口卡片 -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="openBindModal()" class="bg-blue-50 border border-blue-100 rounded-xl p-4 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
                <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                </div>
                <span class="text-[13px] font-bold text-blue-700">绑定服务器 IP</span>
            </button>
            <button onclick="openSSLModal()" class="bg-green-50 border border-green-100 rounded-xl p-4 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
                <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <span class="text-[13px] font-bold text-green-700">申请 SSL 证书</span>
            </button>
        </div>

        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-800 text-[15px]">DNS 解析记录</h3>
            <button onclick="openDNSModal()" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm">+ 添加解析</button>
        </div>

        <!-- 解析记录列表 (限制5条) -->
        <div class="bg-white rounded-xl border border-slate-100 overflow-hidden text-sm shadow-sm" id="dns-list">
            <div class="grid grid-cols-3 bg-slate-50 p-3 font-bold text-slate-600 border-b border-slate-100">
                <span>类型</span><span>主机记录</span><span>记录值</span>
            </div>
            
            <!-- 已有记录1 -->
            <div class="grid grid-cols-3 p-3 border-b border-slate-50 text-slate-700 items-center dns-item">
                <span><span class="bg-orange-100 text-orange-600 text-[10px] px-1.5 py-0.5 rounded">A</span></span>
                <span class="font-mono">@</span>
                <span class="font-mono text-blue-500">8.210.61.146</span>
            </div>
            <!-- 已有记录2 -->
            <div class="grid grid-cols-3 p-3 text-slate-700 items-center dns-item border-b border-slate-50">
                <span><span class="bg-green-100 text-green-600 text-[10px] px-1.5 py-0.5 rounded">CNAME</span></span>
                <span class="font-mono">www</span>
                <span class="font-mono text-blue-500">lynli.me</span>
            </div>
        </div>
    </main>

    <!-- 1. SSL 证书弹窗 (缩小版) -->
    <div id="ssl-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl relative ssl-container">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    SSL证书申请
                </h3>
                <button onclick="closeSSLModal()" class="text-slate-400 text-xl px-2">✕</button>
            </div>
            
            <div class="ssl-scroll-area">
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4">
                    <label class="block text-xs font-bold text-slate-700 mb-1">申请域名</label>
                    <select class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3">
                        <option>lynli.kz.ci</option>
                    </select>
                    <label class="block text-xs font-bold text-slate-700 mb-1">证书类型</label>
                    <select class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3">
                        <option>单域名证书 (免费)</option>
                    </select>
                    <button onclick="showToast('已提交SSL申请')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg py-2.5 text-sm shadow-sm flex justify-center items-center gap-2 transition-colors">
                        提交申请
                    </button>
                </div>
                
                <div class="flex justify-between items-center mb-2">
                    <h4 class="font-bold text-slate-800 text-xs">申请历史</h4>
                    <span class="text-[10px] text-slate-400">共 0 条</span>
                </div>
                <div class="border border-slate-100 rounded-xl p-4 text-center text-slate-400 text-xs mb-4">
                    暂无记录
                </div>

                <!-- FAQ 手风琴 (压缩版) -->
                <div class="border border-slate-100 rounded-xl overflow-hidden text-xs text-slate-700 bg-white">
                    <div class="border-b border-slate-100">
                        <div class="p-3 flex justify-between items-center cursor-pointer" onclick="toggleFaq(this)">
                            <span>同一个域名申请冷却多久？</span>
                            <svg class="w-3 h-3 text-slate-400 faq-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="faq-answer"><div class="p-3 text-slate-500 text-[11px] leading-relaxed border-t border-slate-50">为防止恶意刷证书，申请失败后通常需等待 1-2 小时。</div></div>
                    </div>
                    <div class="border-b border-slate-100">
                        <div class="p-3 flex justify-between items-center cursor-pointer" onclick="toggleFaq(this)">
                            <span>证书申请一般需要多久？</span>
                            <svg class="w-3 h-3 text-slate-400 faq-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="faq-answer"><div class="p-3 text-slate-500 text-[11px] leading-relaxed border-t border-slate-50">单域名证书通常仅需 1-5 分钟即可签发。</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 绑定服务器 IP 抽屉 -->
    <div id="bind-modal" class="modal-overlay sheet-overlay" onclick="closeBindModal()"></div>
    <div id="bind-drawer" class="bottom-sheet">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
        <h3 class="text-lg font-bold text-slate-800 mb-4">绑定服务器 IP</h3>
        <p class="text-xs text-slate-500 mb-4">输入您的服务器公网 IP，系统将自动为您添加一条 A 记录指向该 IP。</p>
        <input type="text" id="bind-ip" placeholder="例如：8.210.61.146" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm outline-none mb-6">
        <div class="flex gap-3">
            <button onclick="closeBindModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm">取消</button>
            <button onclick="confirmBind()" class="flex-1 py-3 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm">确认绑定</button>
        </div>
    </div>

    <!-- 3. 添加解析抽屉 -->
    <div id="dns-modal" class="modal-overlay sheet-overlay" onclick="closeDNSModal()"></div>
    <div id="dns-drawer" class="bottom-sheet">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
        <h3 class="text-lg font-bold text-slate-800 mb-4">添加解析记录</h3>
        
        <div class="flex gap-3 mb-3">
            <div class="w-1/3">
                <label class="block text-xs text-slate-500 mb-1">类型</label>
                <select id="dns-type" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
                    <option>A</option><option>CNAME</option><option>TXT</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-xs text-slate-500 mb-1">主机记录</label>
                <input type="text" id="dns-host" placeholder="如 @ 或 www" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
            </div>
        </div>
        <div class="mb-6">
            <label class="block text-xs text-slate-500 mb-1">记录值 (IP或域名)</label>
            <input type="text" id="dns-value" placeholder="输入目标 IP 或域名" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
        </div>

        <div class="flex gap-3">
            <button onclick="closeDNSModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm">取消</button>
            <button onclick="confirmAddDNS()" class="flex-1 py-3 bg-slate-800 text-white font-bold rounded-xl text-sm shadow-sm">确认添加</button>
        </div>
    </div>

    <!-- 全局提示弹窗 -->
    <div id="custom-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative">
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center justify-center gap-2"><img src="/logo.jpg" class="w-5 h-5 rounded"> <span id="modal-title">提示</span></h3>
                <p id="modal-desc" class="text-sm text-slate-500 mb-6 leading-relaxed text-left bg-slate-50 p-4 rounded-lg">内容</p>
                <button onclick="closeGlobalAlert()" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm">我知道了</button>
            </div>
        </div>
    </div>

    <script>
        // 弹窗控制
        function openSSLModal() { document.getElementById('ssl-modal').classList.add('active'); }
        function closeSSLModal() { document.getElementById('ssl-modal').classList.remove('active'); }
        
        function openBindModal() { 
            document.getElementById('bind-modal').style.display = 'block';
            document.getElementById('bind-drawer').classList.add('active'); 
        }
        function closeBindModal() { 
            document.getElementById('bind-modal').style.display = 'none';
            document.getElementById('bind-drawer').classList.remove('active'); 
        }

        function openDNSModal() { 
            const items = document.querySelectorAll('.dns-item');
            if (items.length >= 5) {
                showGlobalAlert('解析上限', '免费二级域名最多只能添加 5 条解析记录。');
                return;
            }
            document.getElementById('dns-modal').style.display = 'block';
            document.getElementById('dns-drawer').classList.add('active'); 
        }
        function closeDNSModal() { 
            document.getElementById('dns-modal').style.display = 'none';
            document.getElementById('dns-drawer').classList.remove('active'); 
        }

        // 业务逻辑
        function confirmBind() {
            const ip = document.getElementById('bind-ip').value;
            if(!ip) return showToast('请输入IP');
            // 模拟添加一条 A 记录 @ -> IP
            addRecordToDOM('A', '@', ip);
            closeBindModal();
        }

        function confirmAddDNS() {
            const type = document.getElementById('dns-type').value;
            const host = document.getElementById('dns-host').value;
            const val = document.getElementById('dns-value').value;
            if(!host || !val) return showToast('请填写完整');
            
            addRecordToDOM(type, host, val);
            closeDNSModal();
        }

        function addRecordToDOM(type, host, val) {
            const list = document.getElementById('dns-list');
            const newDiv = document.createElement('div');
            newDiv.className = 'grid grid-cols-3 p-3 text-slate-700 items-center dns-item border-b border-slate-50';
            let color = type === 'A' ? 'bg-orange-100 text-orange-600' : (type === 'CNAME' ? 'bg-green-100 text-green-600' : 'bg-slate-200 text-slate-600');
            newDiv.innerHTML = `
                <span><span class="${color} text-[10px] px-1.5 py-0.5 rounded">${type}</span></span>
                <span class="font-mono">${host}</span>
                <span class="font-mono text-blue-500 text-ellipsis overflow-hidden whitespace-nowrap">${val}</span>
            `;
            list.appendChild(newDiv);
            showToast('添加成功');
        }

        // 提示及FAQ
        function showGlobalAlert(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeGlobalAlert() { document.getElementById('custom-modal').classList.remove('active'); }
        
        let toastTimer;
        function showToast(msg) {
            let t = document.getElementById('toast');
            if(!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white px-4 py-2 rounded-lg text-sm z-[9999] hidden';
                document.body.appendChild(t);
            }
            t.innerText = msg;
            t.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function toggleFaq(element) {
            const answer = element.nextElementSibling;
            const icon = element.querySelector('.faq-icon');
            if (answer.classList.contains('active')) {
                answer.classList.remove('active'); icon.classList.remove('active');
            } else {
                document.querySelectorAll('.faq-answer').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.faq-icon').forEach(el => el.classList.remove('active'));
                answer.classList.add('active'); icon.classList.add('active');
            }
        }
    </script>
</body>
</html>
