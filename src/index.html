<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGX Account - Global Digital Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#111318', darkcard: '#1b1e27', primary: '#3b82f6' } } } }
    </script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-darkbg text-gray-300 font-sans antialiased min-h-screen">
    
    <!-- 全局导航栏 -->
    <nav id="navbar" class="bg-darkcard border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#/" class="flex items-center gap-2 cursor-pointer">
                <img src="./assets/sok.png" alt="Logo" class="w-8 h-8 rounded-lg" onerror="this.src='https://via.placeholder.com/32/3b82f6/ffffff?text=S5'">
                <span class="font-bold text-xl text-white tracking-tight">TGX<span class="text-primary">Account</span></span>
            </a>
            
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <input type="text" placeholder="Search products..." class="w-full bg-darkbg border border-gray-700 rounded-full py-2 px-4 text-sm text-white focus:outline-none focus:border-primary">
            </div>

            <div id="nav-user-area" class="flex items-center gap-4 relative">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>
    </nav>

    <!-- 全局抽屉 -->
    <div id="user-drawer" class="hidden absolute top-16 right-4 w-64 bg-darkcard border border-gray-700 rounded-xl shadow-2xl z-50 mt-2">
        <div class="p-4 border-b border-gray-800 bg-[#151821] rounded-t-xl">
            <p class="text-sm font-bold text-white" id="drawer-username">User</p>
            <div class="mt-2 bg-darkbg rounded-lg p-2 flex justify-between items-center border border-gray-700">
                <span class="text-xs text-gray-400">Wallet</span>
                <span class="text-green-400 font-bold" id="drawer-balance">$0.00</span>
            </div>
        </div>
        <div class="p-2 space-y-1 text-sm">
            <a href="#/dashboard" class="block px-3 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition">Dashboard</a>
            <a href="#/orders" class="block px-3 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition">My Orders</a>
            <a href="#/wallet" class="block px-3 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition">Wallet</a>
        </div>
        <div class="p-2 border-t border-gray-800">
            <button onclick="App.logout()" class="w-full text-left px-3 py-2 text-red-400 hover:bg-red-500/10 rounded-lg">Logout</button>
        </div>
    </div>

    <!-- 页面主视图容器 (由路由渲染) -->
    <main id="app-view" class="max-w-7xl mx-auto px-4 py-8"></main>

    <!-- 全局模态框 (登录/注册) -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="bg-darkcard w-full max-w-sm rounded-2xl p-6 border border-gray-800 relative">
            <button onclick="App.closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 z-[110] px-6 py-3 rounded-lg shadow-xl text-white font-bold bg-green-600"></div>

    <script src="./js/app.js"></script>
</body>
</html>
