<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在线充值 - SOCKS5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; font-size: 20px; font-weight: bold; outline: none; transition: border 0.2s; }
        .input-flat:focus { border-color: #2563eb; background: #fff; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; width: 100%; max-width: 340px; border-radius: 20px; padding: 24px; text-align: center; }
    </style>
    <link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/png" href="/assets/logo.png"><link rel="apple-touch-icon" href="/assets/logo.png"><link rel="stylesheet" href="/css/global-video-bg.css"></head>
<body class="pb-12 bg-[#f8f9fa]">
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="../query/console.html" class="text-slate-600 text-xl font-bold px-2">←</a>
            <h1 class="text-[17px] font-bold text-slate-800">在线充值</h1>
        </div>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto">
        <div class="text-center mb-8">
            <p class="text-[13px] text-slate-500 mb-1">当前账户余额（以真实账户接口为准）</p>
            <p class="text-[40px] font-extrabold text-slate-800 tracking-tight">¥ —</p>
        </div>

        <div class="card p-6 space-y-6">
            <div>
                <label class="text-[14px] font-bold text-slate-700 mb-3 block">选择充值方式</label>
                <div class="grid grid-cols-2 gap-3">
                    <div onclick="selectPayType('alipay')" id="btn-alipay" class="border-2 border-blue-500 bg-gray-50 p-4 rounded-lg cursor-pointer text-center transition">
                        <span class="text-[15px] font-bold text-black">支付宝 (推荐)</span>
                    </div>
                    <div onclick="selectPayType('usdt')" id="btn-usdt" class="border border-gray-200 p-4 rounded-lg cursor-pointer text-center transition bg-white">
                        <span class="text-[15px] font-bold text-slate-600">USDT (TRC20)</span>
                    </div>
                </div>
            </div>

            <div>
                <label class="text-[14px] font-bold text-slate-700 mb-2 flex justify-between">
                    <span>输入充值金额</span>
                    <span class="text-[12px] text-slate-400 font-normal">1 USDT = 8 RMB</span>
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-[20px]" id="unit-symbol">¥</span>
                    <input type="number" id="recharge-amount" class="input-flat pl-10" placeholder="最低 10 元" value="100" oninput="calcEstimate()">
                </div>
                <p class="text-[13px] text-black mt-2 text-right font-medium" id="estimate-text">预估到账: 12.50 USDT</p>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="setAmount(50)" class="py-2.5 bg-slate-50 border border-gray-200 rounded-lg text-[14px] font-bold text-slate-600 active:bg-slate-100">50</button>
                <button onclick="setAmount(100)" class="py-2.5 bg-slate-50 border border-gray-200 rounded-lg text-[14px] font-bold text-slate-600 active:bg-slate-100">100</button>
                <button onclick="setAmount(500)" class="py-2.5 bg-slate-50 border border-gray-200 rounded-lg text-[14px] font-bold text-slate-600 active:bg-slate-100">500</button>
                <button onclick="setAmount(1000)" class="py-2.5 bg-slate-50 border border-gray-200 rounded-lg text-[14px] font-bold text-slate-600 active:bg-slate-100">1000</button>
            </div>

            <button onclick="submitRecharge()" class="w-full py-4 bg-black text-white font-bold rounded-lg text-[16px] active:opacity-80 transition shadow-sm shadow-blue-500/30">立即充值</button>
        </div>
    </main>

    <!-- 支付弹窗 -->
    <div id="pay-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="text-[18px] font-bold text-slate-800 mb-2">扫码支付</h3>
            <p class="text-[13px] text-slate-500 mb-5" id="pay-tip">请使用支付宝扫码付款</p>
            <div class="w-48 h-48 bg-slate-50 mx-auto rounded-lg flex items-center justify-center mb-5 border border-gray-200 shadow-inner">
                <img id="pay-qrcode" src="" class="w-full h-full object-contain hidden">
            </div>
            <p class="text-[12px] text-slate-400 mb-1">需支付金额</p>
            <p class="text-[28px] font-extrabold text-black mb-5" id="pay-amount">¥ 100.00</p>
            <div id="usdt-box" class="hidden bg-slate-50 border border-gray-200 rounded-lg p-3 mb-5 text-left">
                <p class="text-[11px] text-slate-500 mb-1">TRC20 收款地址 (长按复制)</p>
                <p class="text-[13px] font-mono text-slate-700 break-all select-all">支付服务未接入，暂无可用收款地址</p>
            </div>
            <button onclick="closeModal()" class="w-full py-3.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-[15px]">我已完成支付</button>
        </div>
    </div>

    <script src="../js/notice.js"></script>
    <script src="../js/ai-widget.js"></script>
    <script>
        let currentType = 'alipay';
        const rate = 8;
        function selectPayType(type) {
            currentType = type;
            const alipay = document.getElementById('btn-alipay');
            const usdt = document.getElementById('btn-usdt');
            const unit = document.getElementById('unit-symbol');
            if (type === 'alipay') {
                alipay.className = 'border-2 border-blue-500 bg-gray-50 p-4 rounded-lg cursor-pointer text-center transition';
                alipay.querySelector('span').className = 'text-[15px] font-bold text-black';
                usdt.className = 'border border-gray-200 p-4 rounded-lg cursor-pointer text-center transition bg-white';
                usdt.querySelector('span').className = 'text-[15px] font-bold text-slate-600';
                unit.innerText = '¥';
            } else {
                usdt.className = 'border-2 border-blue-500 bg-gray-50 p-4 rounded-lg cursor-pointer text-center transition';
                usdt.querySelector('span').className = 'text-[15px] font-bold text-black';
                alipay.className = 'border border-gray-200 p-4 rounded-lg cursor-pointer text-center transition bg-white';
                alipay.querySelector('span').className = 'text-[15px] font-bold text-slate-600';
                unit.innerText = '$';
            }
            calcEstimate();
        }
        function calcEstimate() {
            const val = parseFloat(document.getElementById('recharge-amount').value) || 0;
            const est = document.getElementById('estimate-text');
            if (currentType === 'alipay') est.innerText = `预估到账: ${(val / rate).toFixed(2)} USDT`;
            else est.innerText = `预估到账: ${(val * rate).toFixed(2)} RMB`;
        }
        function setAmount(amt) { document.getElementById('recharge-amount').value = amt; calcEstimate(); }
        function submitRecharge() {
            const val = parseFloat(document.getElementById('recharge-amount').value) || 0;
            if (val < 10) { alert('最低充值 10 元'); return; }
            alert('充值接口尚未接入，未创建真实充值订单，也未到账。请勿向页面中的演示地址转账。');
        }
        function closeModal() {
            document.getElementById('pay-modal').classList.remove('active');
        }
    </script>
<script id="safe-ui-notice-policy">
(function(){
 function clean(v){return String(v??'操作未完成').replace(/Bearer\s+\S+/gi,'[凭据已隐藏]').replace(/\b(access[_-]?token|refresh[_-]?token|api[_-]?key|secret|password|authorization)\s*[:=]\s*["']?[^,\s"';&]+/gi,'$1=[凭据已隐藏]').replace(/(?:\b[0-9a-f]{1,4}:){2,}[0-9a-f:.]{1,}/gi,'[IP地址已隐藏]').replace(/https?:\/\/[^\s"'<>]+/gi,'[链接已隐藏]').replace(/\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}(?::\d+)?\b/gi,'[地址已隐藏]').replace(/\b(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?\b/g,'[地址已隐藏]').replace(/(?:^|\n)\s*at\s+[^\n]+/g,'').replace(/\s{2,}/g,' ').trim().slice(0,240)||'操作未完成，请稍后重试。'}
 window.safeUiMessage=clean;
 window.alert=function(message){var n=document.getElementById('safe-ui-notice');if(!n){n=document.createElement('div');n.id='safe-ui-notice';n.setAttribute('role','status');n.setAttribute('aria-live','polite');n.style.cssText='position:fixed;z-index:100001;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;border-radius:12px;background:#142b43;color:#fff;box-shadow:0 12px 36px #0005';document.body.appendChild(n)}n.textContent=clean(message);n.hidden=false;clearTimeout(window.__safeUiNoticeTimer);window.__safeUiNoticeTimer=setTimeout(function(){n.hidden=true},4200)};
 var nativeConfirm=window.confirm.bind(window);window.confirm=function(message){return nativeConfirm(clean(message))};
})();
</script>
<script src="/js/global-video-bg.js" defer></script></body>
</html>
