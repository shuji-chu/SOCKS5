<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOCKS5 商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css?v=7">
</head>
<body>
    <header class="app-header">
        <img src="/logo.jpg" class="app-logo">
        <h1 class="app-title">SOCKS5</h1>
    </header>
    <main class="content-wrap">
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-6 text-white mb-6 card-shadow relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500 rounded-full blur-2xl opacity-40"></div>
            <h2 class="text-2xl font-bold mb-2">企业级安全资产</h2>
            <p class="text-slate-300 text-sm">原生纯净环境 / 全自动极速发货 / 售后无忧</p>
        </div>
        
        <h3 class="font-bold text-slate-800 mb-3 text-lg">全部分类</h3>
        <div class="grid grid-cols-2 gap-4">
            <!-- TG 账号入口 -->
            <a href="/list-tg.html" class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex flex-col items-center justify-center text-center active:scale-95 transition-transform">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-800">TG 账号</h4>
                <p class="text-xs text-slate-400 mt-1">旗舰防封 / 直登号</p>
            </a>
            
            <!-- 代理节点入口 -->
            <a href="/list-node.html" class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex flex-col items-center justify-center text-center active:scale-95 transition-transform">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-800">专线节点</h4>
                <p class="text-xs text-slate-400 mt-1">住宅IP / 高速中转</p>
            </a>

            <!-- 企业邮箱入口 -->
            <a href="/list-email.html" class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex flex-col items-center justify-center text-center active:scale-95 transition-transform">
                <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <h4 class="font-bold text-slate-800">企业邮箱</h4>
                <p class="text-xs text-slate-400 mt-1">Gmail / 纯净老号</p>
            </a>

            <!-- 苹果 ID 入口 -->
            <a href="/list-apple.html" class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex flex-col items-center justify-center text-center active:scale-95 transition-transform">
                <div class="w-12 h-12 bg-slate-100 text-slate-800 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.21-.93 3.57-.8 1.53.1 2.77.81 3.58 2.02-3.07 1.73-2.54 5.76.54 6.94-.72 1.89-1.63 3.76-2.77 5.07zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                </div>
                <h4 class="font-bold text-slate-800">苹果 ID</h4>
                <p class="text-xs text-slate-400 mt-1">美区高权重 / 独享</p>
            </a>
        </div>
    </main>

    <nav class="app-tab-bar">
        <a href="/index.html" class="tab-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></a>
        <a href="/orders.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>订单</span></a>
        <a href="/profile.html" class="tab-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>我的</span></a>
    </nav>
    <script src="/app.js?v=7"></script>
</body>
</html>
