<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册 - SOCKS5</title>
    <link rel="icon" href="../assets/logo.jpg" type="image/jpeg">
    <link rel="shortcut icon" href="../assets/logo.jpg" type="image/jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; justify-content: center; position: relative; }
        .header { text-align: center; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; }
        .header h2 { font-size: 22px; font-weight: 700; }
        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); width: 100%; max-width: 380px; margin: 0 auto; }
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; }
        .code-row { display: flex; gap: 10px; }
        .code-row input { flex: 1; min-width: 0; }
        .btn-code { width: 110px; flex-shrink: 0; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .agreement { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 12px; color: #64748b; }
        .agreement input { margin-top: 2px; width: 14px; height: 14px; accent-color: #2563eb; }
        .agreement a { color: #2563eb; text-decoration: none; }
        
        .footer { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #94a3b8; }
        .footer-links { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .footer-links button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-body { font-size: 13px; color: #475569; line-height: 1.6; overflow-y: auto; }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(30,41,59,0.95); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; transition: all 0.3s; z-index: 99999; }
        #toast.show { top: 30px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#f8f9fa]">
    <div id="toast"></div>
    <div class="header"><img src="../assets/logo.jpg"><h2>创建新账号</h2><p>请使用真实邮箱完成验证</p></div>
    <div class="card">
        <form id="reg-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group code-row">
                <input type="text" id="code" required placeholder="验证码">
                <button type="button" id="send-code-btn" class="btn-code">获取验证码</button>
            </div>
            <div class="input-group"><input type="password" id="password" required placeholder="设置密码"></div>
            <label class="agreement">
                <input type="checkbox" id="agree-check">
                <span>我已阅读并同意 <a href="javascript:void(0)" onclick="openModal('terms')">《用户协议》</a> 和 <a href="javascript:void(0)" onclick="openModal('privacy')">《隐私政策》</a></span>
            </label>
            <button type="submit" class="btn-primary" id="submit-btn">立即注册</button>
        </form>
        <div class="link-text"><a href="./login.html">已有账号？返回登录</a></div>
    </div>
    
    <div class="footer">
        <div>客服邮箱：boss@lynli.me</div>
        <div class="footer-links">
            <button onclick="openModal('terms')">《用户协议》</button>
            <span>|</span>
            <button onclick="openModal('privacy')">《隐私政策》</button>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modal-title" style="font-size:18px;font-weight:700;">标题</h3><button onclick="closeModal()" style="border:none;background:none;font-size:20px;color:#94a3b8;">✕</button></div>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>
    <script>
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }
        
        const API_BASE = '/api';
        document.getElementById('send-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            if(!email || !email.includes('@')) { showToast('请输入正确邮箱'); return; }
            this.disabled = true; this.innerText = '发送中...';
            try {
                const res = await fetch(API_BASE + '/auth/send-code', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('验证码已发送');
                    let cd = 60; const btn = this;
                    const timer = setInterval(() => { cd--; btn.innerText = `${cd}s`; if(cd <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; } }, 1000);
                } else { showToast(data.message || '发送失败'); this.disabled = false; this.innerText = '获取验证码'; }
            } catch (e) { showToast('网络错误'); this.disabled = false; this.innerText = '获取验证码'; }
        });
                if (res.ok) {
                    showToast('验证码已发送');
                    let cd = 60; const btn = this;
                    const timer = setInterval(() => { cd--; btn.innerText = `${cd}s`; if(cd <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; } }, 1000);
                } else { showToast('发送失败'); this.disabled = false; this.innerText = '获取验证码'; }
            } catch (e) { showToast('网络错误'); this.disabled = false; this.innerText = '获取验证码'; }
        });
        
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!document.getElementById('agree-check').checked) { showToast('请先同意协议'); return; }
            const btn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;
            if(!code) { showToast('请输入验证码'); return; }
            btn.innerText = '正在进入...'; btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, code: code, password: password })
                });
                const data = await res.json();
                if (data.ok && data.token) {
                    localStorage.setItem('tgx_token', data.token);
                    localStorage.setItem('tgx_user', JSON.stringify(data.user));
                    showToast('注册成功');
                    setTimeout(() => { window.location.href = '../index.html'; }, 600);
                } else {
                    showToast(data.message || '注册异常'); btn.innerText = '立即注册'; btn.disabled = false;
                }
            } catch (err) {
                showToast('网络错误'); btn.innerText = '立即注册'; btn.disabled = false;
            }
        });
                const data = await res.json();
                if (res.ok && data.data) {
                    localStorage.setItem('socks5_email', data.data.email);
                    localStorage.setItem('socks5_token', data.data.token);
                    localStorage.setItem('socks5_nickname', data.data.nickname);
                    localStorage.setItem('socks5_user_id', data.data.user_id);
                    localStorage.setItem('socks5_app_secret', data.data.app_secret);
                    localStorage.setItem('socks5_user_id', data.data.user_id);
                    localStorage.setItem('socks5_app_secret', data.data.app_secret);
                    localStorage.setItem('socks5_avatar', data.data.avatar);
                    
                    // 直接跳转主页
                    window.location.href = '/index.html';
                } else { 
                    showToast('注册异常'); btn.innerText = '立即注册'; btn.disabled = false; 
                }
            } catch (err) { 
                showToast('网络错误'); btn.innerText = '立即注册'; btn.disabled = false; 
            }
        });
        
        const modalContent = {
            'privacy': { title: '隐私政策', text: '我们深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。未经您的同意，我们绝不会向任何第三方提供您的个人信息。' },
            'terms': { title: '用户协议', text: '欢迎使用 SOCKS5 服务。本协议是您与 SOCKS5 之间关于您使用本服务所订立的协议。您在使用本服务时，必须遵守相关法律法规。' }
        };
        
        function openModal(type) {
            const data = modalContent[type]; if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body-content').innerText = data.text;
            document.getElementById('info-modal').classList.add('active');
        }
        function closeModal() { document.getElementById('info-modal').classList.remove('active'); }
    </script>
<script src="../js/ai-widget.js"></script>


<script src="../js/notice.js"></script>
</body>
</html>
