<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>邮箱账号 - SOCKS5</title>
    <link rel="icon" href="./logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #ffffff; color: #1e293b; }
        .seamless-item { border-bottom: 1px solid #f1f5f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="./index.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-lg font-bold text-slate-800">邮箱账号</h1>
    </header>

    <main>
        <div class="px-4 py-3 bg-white sticky top-[56px] z-30 border-b border-slate-100">
            <div class="flex-1 bg-slate-50 rounded-lg flex items-center px-3 py-2 border border-slate-100">
                <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" oninput="renderProducts()" placeholder="搜索 Gmail, Outlook 等..." class="bg-transparent outline-none text-[14px] w-full text-slate-700">
            </div>
        </div>

        <div id="product-list" class="px-4 pb-10"></div>
    </main>

    <div id="custom-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative">
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center justify-center gap-2"><img src="./logo.jpg" class="w-5 h-5 rounded"> <span id="modal-title">提示</span></h3>
                <p id="modal-desc" class="text-sm text-slate-500 mb-6 leading-relaxed text-left bg-slate-50 p-4 rounded-lg">内容</p>
                <button onclick="closeGlobalAlert()" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-xl text-sm shadow-sm">我知道了</button>
            </div>
        </div>
    </div>

    <script>
        const allProducts = [
            { id: 1, title: '[库存号] 谷歌 Gmail 白号 | 2019年老号 | 纯手工注册', price: '12.35', stock: 120 },
            { id: 2, title: '[库存号] 微软 Outlook 邮箱 | 批量注册专用 | 带辅助邮箱', price: '0.05', stock: 8631 },
            { id: 3, title: '[库存号] 企业邮箱 | 域名后缀 | 支持 SMTP 发信', price: '35.00', stock: 50 },
            { id: 4, title: '[库存号] ProtonMail 加密邮箱 | 极高隐私保护', price: '8.50', stock: 88 }
        ];

        function renderProducts() {
            const listEl = document.getElementById('product-list');
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            listEl.innerHTML = '';

            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(keyword));

            if(filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">没有找到相关商品</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach(p => {
                const a = document.createElement('a');
                a.href = "javascript:void(0)";
                a.onclick = () => { 
                    if(!localStorage.getItem('socks5_token')) { window.location.href = '/login.html'; return; }
                    window.location.href = '/product-detail.html';
                };
                a.className = "block py-4 seamless-item active:bg-slate-50";
                
                a.innerHTML = `
                    <div class="flex items-start gap-3.5">
                        <div class="w-10 h-10 rounded-xl bg-pink-50 text-pink-500 flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14.5px] font-semibold text-slate-800 leading-snug line-clamp-2">${p.title}</h3>
                            <div class="flex justify-between items-end mt-3.5">
                                <span class="text-[18px] font-bold text-red-500">¥${p.price}</span>
                                <span class="text-xs text-slate-400">库存: <span class="text-green-500 font-medium">${p.stock}</span></span>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(a);
            });
            listEl.appendChild(fragment);
        }

        function showGlobalAlert(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeGlobalAlert() { document.getElementById('custom-modal').classList.remove('active'); }

        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
<script src="./ai-widget.js"></script>


<script src="./notice.js"></script>
</body>
</html>
