<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061326">
<title>登录｜SOSKS5</title>
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/pages.css">
</head>
<body class="user-page">
<header class="site-header">
<a class="brand" href="./index.html"><img src="./assets/images/logo.svg" alt="SOSKS5 全球数字商业平台" width="180" height="48" style="width:160px;height:auto;max-height:48px;border-radius:0"></a>
<a class="button button-small" href="./index.html">返回首页</a>
</header>
<main class="user-shell">
<section class="panel" style="max-width:520px;margin:8vh auto;padding:clamp(22px,5vw,38px)">
<span class="eyebrow">WELCOME BACK</span>
<h1 style="margin:12px 0 8px">登录 SOSKS5</h1>
<p style="color:var(--muted);line-height:1.8">登录后查看真实账户、邀请统计与订阅信息。</p>
<form id="login-form" style="display:grid;gap:14px;margin-top:24px">
<label style="display:grid;gap:7px">邮箱地址<input id="login-email" type="email" autocomplete="username" required placeholder="输入注册邮箱地址" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)"></label>
<label style="display:grid;gap:7px">密码<input id="login-password" type="password" autocomplete="current-password" required placeholder="输入账户密码" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)"></label>
<button id="login-submit" class="button" type="submit">登录</button>
</form>
<p style="color:var(--muted);font-size:12px;margin-top:16px">登录请求通过统一 API 模块发送。请勿在公共设备保存账户凭据。</p>
</section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/api.js" defer></script>
<script src="./js/ui.js" defer></script>
<script src="./js/main.js" defer></script>
</body>
</html>
