<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGX Store - 专业数字资产平台</title>
    <link rel="icon" href="./logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-gray-900 font-sans antialiased pb-16">
    
    <!-- 顶部公告 -->
    <div class="bg-black text-white text-[11px] text-center py-2 tracking-wide">
        ⚠️ 订单卡密仅保留30天，逾期自动清除，请及时备份！ | 平台实时在线 · 即时发货
    </div>

    <!-- 顶部 Header -->
    <header class="bg-white px-4 py-4 sticky top-0 z-20 border-b border-gray-100">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-bold text-lg">T</div>
                <h1 class="text-xl font-bold tracking-tight">TGX Store</h1>
            </div>
            <a href="./profile.html" class="text-gray-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
        </div>
        
        <!-- 搜索框 -->
        <div class="relative">
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索 Telegram, Gmail, 节点..." class="w-full bg-gray-100 border-none rounded-lg py-2.5 pl-10 pr-4 text-sm focus:ring-1 focus:ring-black focus:bg-white transition">
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
    </header>

    <!-- 信任背书 -->
    <div class="grid grid-cols-3 gap-2 text-center text-[11px] text-gray-500 py-3 bg-white border-b border-gray-100">
        <div><span class="block text-sm font-bold text-gray-900">30,000+</span>累计服务用户</div>
        <div><span class="block text-sm font-bold text-gray-900">即时发货</span>下单秒出</div>
        <div><span class="block text-sm font-bold text-gray-900">安全保障</span>专业售后</div>
    </div>

    <!-- 横向分类滑动 -->
    <div class="bg-white px-4 py-3 mb-2 sticky top-[105px] z-10 border-b border-gray-100 overflow-x-auto whitespace-nowrap scrollbar-hide" id="filter-options">
        <!-- 由 JS 动态生成 -->
    </div>

    <!-- 商品列表 -->
    <main class="px-4 mt-2">
        <div id="product-list" class="grid grid-cols-1 gap-3">
            <!-- 由 JS 动态生成 -->
        </div>
    </main>

    <!-- 底部导航 -->
    <div class="fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around py-2 z-50">
        <a href="./index.html" class="flex flex-col items-center text-black">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] mt-1 font-medium">首页</span>
        </a>
        <a href="./profile.html" class="flex flex-col items-center text-gray-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] mt-1">我的</span>
        </a>
    </div>

    <script>
        let products = [];
        let currentCategory = '全部';
        let searchQuery = '';

        function renderFilterOptions() {
            const container = document.getElementById('filter-options');
            const defaultCategories = ['全部', 'TG账号', '邮箱账号', '代理节点', '接码服务'];
            const allCats = [...new Set([...defaultCategories, ...products.map(p => p.category)])];

            container.innerHTML = allCats.map(cat => `
                <button onclick="selectCategory('${cat}')" class="px-4 py-1.5 rounded-full text-[13px] mr-2 transition ${currentCategory === cat ? 'bg-black text-white font-medium' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderFilterOptions();
            renderProducts();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            renderProducts();
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            const filtered = products.filter(p => {
                const matchCategory = currentCategory === '全部' || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(searchQuery) || p.category.toLowerCase().includes(searchQuery);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">没有找到相关商品</div>';
                return;
            }

            list.innerHTML = filtered.map(p => `
                <a href="./product-detail.html?id=${p.id}" class="block bg-white rounded-xl border border-gray-200 p-4 active:bg-gray-50 transition">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-[15px] font-semibold text-gray-900 leading-snug line-clamp-2 pr-4">${p.title}</h3>
                        <span class="text-[11px] text-gray-400 whitespace-nowrap mt-0.5">库存 ${p.stock}</span>
                    </div>
                    
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        ${(p.tags || []).map(t => `<span class="text-[10px] bg-gray-50 text-gray-500 px-1.5 py-0.5 rounded border border-gray-100">${t}</span>`).join('')}
                    </div>
                    
                    <div class="flex items-end justify-between mt-2 pt-3 border-t border-gray-50">
                        <div class="flex items-baseline">
                            <span class="text-[18px] font-bold text-gray-900">¥${p.price}</span>
                            <span class="text-[10px] text-gray-400 ml-1">起</span>
                        </div>
                        <span class="text-[12px] font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded">立即购买</span>
                    </div>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch("https://lynli.kz.ci/api/products");
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    products = data;
                } else if (data && Array.isArray(data.data)) {
                    products = data.data;
                } else if (data && Array.isArray(data.list)) {
                    products = data.list;
                } else {
                    products = [];
                }

                renderFilterOptions();
                renderProducts();
            } catch(e) {
                console.error('获取数据失败:', e);
                document.getElementById('product-list').innerHTML = '<div class="text-center py-10 text-red-500 text-sm">网络加载失败，请刷新重试</div>';
            }
        });
    </script>
    <script src="./ai-widget.js"></script>
    <script src="./notice.js"></script>
</body>
</html>
