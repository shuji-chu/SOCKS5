<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的推广 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { 
            background: white; width: 100%; max-width: 400px; border-radius: 24px 24px 0 0; 
            padding: 16px 24px calc(24px + env(safe-area-inset-bottom)); 
            max-height: 85vh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            animation: slideUp 0.3s ease-out; 
        }
        .modal-drag-bar { width: 40px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto 16px auto; flex-shrink: 0; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="pb-10">

    <div class="bg-[#3b82f6] p-4 flex items-center gap-3 text-white sticky top-0 z-50">
        <a href="/profile.html" class="font-bold text-xl px-2">←</a>
        <h1 class="text-lg font-bold flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> 我的推广</h1>
    </div>

    <div class="p-3">
        <!-- 四个数据卡片 (点击弹窗) -->
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer" onclick="openDetail('注册明细', '暂无注册用户数据')">
                <div class="w-10 h-10 bg-blue-500 rounded-lg text-white flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
                <div><p class="text-xl font-bold text-slate-800">0</p><p class="text-xs text-slate-500">注册数</p></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer" onclick="openDetail('有效订单明细', '暂无有效订单')">
                <div class="w-10 h-10 bg-green-500 rounded-lg text-white flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></div>
                <div><p class="text-xl font-bold text-slate-800">0</p><p class="text-xs text-slate-500">有效订单数</p></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer" onclick="openDetail('点击明细', '暂无点击记录')">
                <div class="w-10 h-10 bg-orange-400 rounded-lg text-white flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></div>
                <div><p class="text-xl font-bold text-slate-800">0</p><p class="text-xs text-slate-500">点击数</p></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer" onclick="openDetail('即将有效佣金明细', '暂无即将生效的佣金')">
                <div class="w-10 h-10 bg-red-400 rounded-lg text-white flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <div><p class="text-xl font-bold text-slate-800 text-red-500">¥ 0.00</p><p class="text-xs text-slate-500">即将有效佣金</p></div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-3">
            <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> 佣金管理</h3>
            <div class="bg-slate-50 rounded-lg p-3 flex justify-between text-center mb-4">
                <div><p class="text-xs text-slate-500 mb-1">当前佣金余额</p><p class="text-lg font-bold text-slate-800">¥ 0.00</p></div>
                <div><p class="text-xs text-slate-500 mb-1">即将有效佣金</p><p class="text-lg font-bold text-orange-500">¥ 0.00</p></div>
                <div><p class="text-xs text-slate-500 mb-1">累计提现金额</p><p class="text-lg font-bold text-slate-800">¥ 0.00</p></div>
            </div>
            <!-- 申请提现改为卡片弹窗 -->
            <button onclick="openWithdrawModal()" class="w-full py-2 bg-blue-500 text-white font-bold rounded-lg text-sm">申请提现</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-3">
            <h3 class="text-sm font-bold text-slate-800 mb-2 flex items-center gap-2"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg> 推广链接</h3>
            <p class="text-xs text-slate-500 mb-2">分享您的专属推广链接</p>
            <div class="flex gap-2">
                <input type="text" id="invite-link" readonly class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-600 outline-none">
                <button class="bg-slate-100 text-slate-600 px-3 rounded-lg text-xs" onclick="copyLink()">复制链接</button>
            </div>
        </div>
    </div>

    <!-- 通用明细弹窗 (带滑动条) -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-drag-bar"></div>
            <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                <h3 id="detail-title" class="text-lg font-bold text-slate-800">明细</h3>
                <button onclick="closeDetail()" class="text-slate-400 text-xl font-bold px-2">✕</button>
            </div>
            <div class="flex flex-col items-center justify-center text-slate-400 py-10">
                <svg class="w-12 h-12 mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p id="detail-text">暂无数据</p>
            </div>
        </div>
    </div>

    <!-- 提现弹窗 (带滑动条) -->
    <div id="withdraw-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-drag-bar"></div>
            <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800">申请提现</h3>
                <button onclick="closeWithdrawModal()" class="text-slate-400 text-xl font-bold px-2">✕</button>
            </div>
            <div class="bg-slate-50 rounded-lg p-3 flex justify-between items-center mb-4">
                <span class="text-sm text-slate-500">当前佣金余额：</span>
                <span class="text-lg font-bold text-red-500">¥0.00</span>
            </div>
            <div class="mb-4">
                <label class="block text-xs text-slate-500 mb-2">提现类型</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-1 text-sm"><input type="radio" name="w-type" checked class="accent-blue-500"> 佣金提现</label>
                    <label class="flex items-center gap-1 text-sm"><input type="radio" name="w-type" class="accent-blue-500"> 佣金转余额</label>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-xs text-slate-500 mb-2">提现金额</label>
                <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden">
                    <button class="px-4 py-2 bg-slate-50 text-slate-500 border-r border-slate-200" onclick="changeAmount(-10)">-</button>
                    <input type="number" id="w-amount" value="10.00" class="flex-1 text-center py-2 outline-none text-sm font-bold">
                    <button class="px-4 py-2 bg-slate-50 text-slate-500 border-l border-slate-200" onclick="changeAmount(10)">+</button>
                </div>
                <p class="text-[10px] text-slate-400 mt-2">• 最低提现金额：¥10.00</p>
            </div>
            <div class="mb-6">
                <label class="block text-xs text-slate-500 mb-2">提现地址</label>
                <textarea id="w-address" placeholder="请输入USDT-TRC20收款地址" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm outline-none resize-none" rows="3" maxlength="200"></textarea>
            </div>
            <div class="flex gap-3">
                <button onclick="closeWithdrawModal()" class="flex-1 py-2.5 border border-slate-300 text-slate-600 font-bold rounded-lg">取消</button>
                <button onclick="submitWithdraw()" class="flex-1 py-2.5 bg-blue-500 text-white font-bold rounded-lg">确认提现</button>
            </div>
        </div>
    </div>

    <script>
        const isBoss = localStorage.getItem('socks5_email') === 'boss@lynli.me';
        const uid = localStorage.getItem('socks5_user_id') || (isBoss ? '10001' : '');
        document.getElementById('invite-link').value = `https://web.lynli.me/?from=${uid}`;
        
        function copyLink() { navigator.clipboard.writeText(document.getElementById('invite-link').value).then(() => alert('已复制')); }

        // 明细弹窗
        function openDetail(title, text) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-text').innerText = text;
            document.getElementById('detail-modal').classList.add('active');
        }
        function closeDetail() { document.getElementById('detail-modal').classList.remove('active'); }

        // 提现弹窗
        function openWithdrawModal() { document.getElementById('withdraw-modal').classList.add('active'); }
        function closeWithdrawModal() { document.getElementById('withdraw-modal').classList.remove('active'); }
        
        function changeAmount(val) {
            const input = document.getElementById('w-amount');
            let current = parseFloat(input.value) || 0;
            current += val;
            if (current < 10) current = 10;
            input.value = current.toFixed(2);
        }
        
        function submitWithdraw() {
            const address = document.getElementById('w-address').value;
            if(!address || address.length < 10) return alert('请输入正确的USDT收款地址');
            alert('提现申请已提交，等待管理员审核');
            closeWithdrawModal();
        }
    </script>
</body>
</html>
