<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fc"><title>用户中心 · 晴天节点</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./css/style.css"></head>
<body data-page="user"><header class="topbar"><a class="brand" href="./index.html"><img src="./logo.png" alt=""><span>晴天节点</span></a><nav class="top-actions"><a class="text-link" href="./index.html">套餐商城</a><button class="button button-small button-light" id="logoutButton" type="button">退出登录</button></nav></header>
<main class="dashboard shell"><div class="dashboard-heading"><div><span class="eyebrow">ACCOUNT OVERVIEW</span><h1>用户中心</h1><p id="userEmail">正在读取账户信息…</p></div><a class="button button-small" href="./index.html#plans">选购套餐</a></div>
<section class="stats-grid"><article class="stat-card"><span>当前套餐</span><strong id="planName">读取中</strong><small id="planStatus">套餐状态</small></article><article class="stat-card"><span>已用流量</span><strong id="usedTraffic">—</strong><small id="totalTraffic">总流量 —</small></article><article class="stat-card"><span>到期时间</span><strong id="expireAt">—</strong><small id="remainingDays">有效期</small></article></section>
<section class="panel"><div class="panel-heading"><div><span class="eyebrow">TRAFFIC USAGE</span><h2>流量使用情况</h2></div><strong id="usagePercent">—</strong></div><div class="progress-track"><span id="usageBar"></span></div><div class="progress-labels"><span id="usageLeft">剩余流量 —</span><span id="usageRight">总流量 —</span></div></section>
<section class="panel"><div class="panel-heading"><div><span class="eyebrow">SUBSCRIPTION</span><h2>一键订阅</h2><p>选择客户端，复制对应订阅链接并导入。</p></div></div><div class="subscription-grid"><article class="subscription-card"><div class="client-mark">C</div><div><strong>Clash</strong><small>Clash / Mihomo 客户端</small></div><button class="button button-outline copy-sub" data-client="clash" type="button">复制链接</button></article><article class="subscription-card"><div class="client-mark">V</div><div><strong>V2Ray</strong><small>V2Ray / v2rayN 客户端</small></div><button class="button button-outline copy-sub" data-client="v2ray" type="button">复制链接</button></article><article class="subscription-card"><div class="client-mark">S</div><div><strong>sing-box</strong><small>sing-box 客户端</small></div><button class="button button-outline copy-sub" data-client="singbox" type="button">复制链接</button></article></div><p class="security-note">订阅链接等同于账户凭证，请勿分享给他人。</p></section>
<div id="userMessage" class="notice" hidden></div></main><footer class="footer shell"><a class="brand" href="./index.html"><img src="./logo.png" alt=""><span>晴天节点</span></a><span>© <span id="year"></span> 晴天节点</span></footer><div id="toast" class="toast" role="status"></div><script src="./js/api.js"></script><script src="./js/main.js"></script></body></html>
