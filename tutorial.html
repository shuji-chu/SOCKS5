<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录教程中心 - SOCKS5</title>
    <link rel="icon" href="./logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 20px; }
        .platform-btn { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; transition: all 0.2s; cursor: pointer; }
        .platform-btn:active { transform: scale(0.98); background: #f8fafc; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="./profile.html" class="text-slate-600 text-xl font-bold px-2">←</a>
            <h1 class="text-[17px] font-bold text-slate-800">登录教程中心</h1>
        </div>
    </header>

    <main class="px-4 py-4 max-w-lg mx-auto">
        <div class="mb-6">
            <h2 class="text-[22px] font-bold text-slate-800 mb-2">请选择平台查看教程</h2>
            <p class="text-[13px] text-slate-500">首次使用请仔细阅读对应平台的使用教程，避免操作失误。</p>
        </div>

        <div class="space-y-3">
            <a href="./tutorial-telegram.html" class="platform-btn">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center font-bold text-[16px]">TG</div>
                    <span class="text-[15px] font-bold text-slate-800">Telegram 教程</span>
                </div>
                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="./tutorial-twitter.html" class="platform-btn">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-800 flex items-center justify-center font-bold text-[16px]">X</div>
                    <span class="text-[15px] font-bold text-slate-800">Twitter / X 教程</span>
                </div>
                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="./tutorial-facebook.html" class="platform-btn">
                <div class="flex items-center gap-3">

                    <span class="text-[15px] font-bold text-slate-800">Facebook 教程</span>
                </div>
                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="./tutorial-instagram.html" class="platform-btn">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center font-bold text-[16px]">IG</div>
                    <span class="text-[15px] font-bold text-slate-800">Instagram 教程</span>
                </div>
                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            </a>

                <div class="flex items-center gap-3">
