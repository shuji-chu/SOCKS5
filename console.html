<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>开发者控制台 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.active { max-height: 2500px; transition: max-height 0.4s ease-in; }
        .rotate-180 { transform: rotate(180deg); }
        .status-btn { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .status-pending { background: #eff6ff; color: #2563eb; }
        .status-review { background: #fffbeb; color: #d97706; cursor: default; }
        .status-active { background: #ecfdf5; color: #059669; cursor: default; }
        .key-card { transition: all 0.2s; }
        .key-body { display: none; }
        .key-card.expanded .key-body { display: block; }
        .key-card.expanded .arrow-icon { transform: rotate(180deg); }
        #toast { visibility: hidden; min-width: 200px; background-color: #334155; color: #fff; text-align: center; border-radius: 8px; padding: 10px 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 13px; opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
        .btn-press { transition: transform 0.1s, background-color 0.2s; }
        .btn-press:active { transform: scale(0.97); background-color: #f1f5f9; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 0 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; width: 100%; max-width: 340px; border-radius: 16px; padding: 20px; text-align: left; }
        .input-flat { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
        <a href="/profile.html" class="text-slate-600 text-xl font-bold px-2">←</a>
        <h1 class="text-[17px] font-bold text-slate-800">开发者控制台</h1>
    </header>

    <main class="pb-12">
        <!-- 头部 -->
        <div class="bg-white px-5 py-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div id="user-avatar-container" class="w-[52px] h-[52px] rounded-full bg-slate-100 flex items-center justify-center border border-slate-200 overflow-hidden"><span class="text-blue-500 font-bold text-xl">B</span></div>
                <div>
                    <h2 class="text-[19px] font-bold text-slate-800">boss</h2>
                    <p class="text-[12px] text-slate-400 mt-0.5">ID: 10001</p>
                </div>
            </div>
            <div class="bg-blue-50 px-4 py-2 rounded-xl text-right min-w-[100px]">
                <p class="text-[11px] text-blue-500 mb-0.5">当前余额</p>
                <p class="text-[20px] font-bold text-blue-600">¥ 120.00</p>
            </div>
        </div>

        <!-- 账户详情 (折叠) -->
        <div class="bg-white mt-2">
            <button onclick="toggleAccordion('accordion-1', 'icon-1')" class="w-full px-5 py-4 flex justify-between items-center border-b border-slate-100">
                <span class="font-bold text-slate-800 text-[14px]">账户详情</span>
                <svg id="icon-1" class="w-4 h-4 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div id="accordion-1" class="accordion-content bg-white">
                <div class="px-5 pb-5 pt-1 border-b border-slate-100">
                    <div id="api-list" class="space-y-1"></div>
                    <button onclick="showCustomAlert('提示', '已退出登录')" class="mt-4 w-full py-2.5 bg-slate-50 text-slate-600 font-bold rounded-lg text-[14px]">退出登录</button>
                </div>
            </div>
        </div>

        <!-- 工作台 -->
        <div class="bg-white mt-2 pt-5 pb-6">
            <div class="px-5 mb-4"><h3 class="text-[16px] font-bold text-slate-800">账户工作台</h3></div>
            <div class="grid grid-cols-2 gap-3 px-5">
                <div class="bg-white rounded-xl p-4 border border-slate-100 shadow-sm cursor-pointer btn-press"><p class="text-[13px] text-slate-500">今日消费</p><p class="text-[22px] font-bold text-slate-800">¥ 0.00</p></div>
                <div class="bg-white rounded-xl p-4 border border-slate-100 shadow-sm cursor-pointer btn-press"><p class="text-[13px] text-slate-500">今日充值</p><p class="text-[22px] font-bold text-slate-800">¥ 0.00</p></div>
                <div class="bg-white rounded-xl p-4 border border-slate-100 shadow-sm"><p class="text-[13px] text-slate-500">调用资格</p><p class="text-[18px] font-bold mt-1 text-green-600" id="dash-call-status">可以调用</p></div>
                <div class="bg-white rounded-xl p-4 border border-slate-100 shadow-sm"><p class="text-[13px] text-slate-500">专属 Key</p><p class="text-[18px] font-bold mt-1 text-green-600" id="dash-key-status">启用中</p></div>
            </div>
            <div class="grid grid-cols-2 gap-3 px-5 mt-4">
                <button onclick="openRechargeModal()" class="py-2.5 bg-blue-600 text-white font-bold rounded-xl text-[14px]">+ 在线充值</button>
                <a href="/guide.html" class="py-2.5 bg-slate-50 text-slate-600 font-bold rounded-xl text-[14px] flex items-center justify-center">开发文档</a>
            </div>
        </div>

        <!-- 秘钥 -->
        <div class="bg-white mt-2">
            <button onclick="toggleAccordion('accordion-2', 'icon-2')" class="w-full px-5 py-4 flex justify-between items-center border-b border-slate-100">
                <span class="font-bold text-slate-800 text-[14px]">秘钥与白名单</span>
                <svg id="icon-2" class="w-4 h-4 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div id="accordion-2" class="accordion-content bg-white">
                <div class="px-5 pb-5 pt-3 border-b border-slate-100">
                    <div id="key-list" class="space-y-3 mb-5"></div>
                    <textarea rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-[13px]" placeholder="IP 白名单..."></textarea>
                    <button onclick="showToast('白名单已更新')" class="mt-3 w-full py-2.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-[14px]">保存白名单</button>
                </div>
            </div>
        </div>

        <!-- 账单 -->
        <div id="bill-tab-container" class="bg-white mt-2">
            <div class="flex border-b border-slate-100">
                <button onclick="switchBillTab('bill')" id="tab-btn-bill" class="flex-1 py-3.5 text-[14px] font-bold text-blue-600 border-b-2 border-blue-600 bg-white">收支明细</button>
                <button onclick="switchBillTab('request')" id="tab-btn-request" class="flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent">消费记录</button>
            </div>
            <div class="bg-white">
                <div id="bill-list-container" class="text-left p-4">账单数据加载中...</div>
                <div id="request-list-container" class="text-left p-4 hidden">请求数据加载中...</div>
            </div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box text-center">
            <h3 class="text-[17px] font-bold text-slate-800 mb-3" id="modal-title">提示</h3>
            <div class="text-[14px] text-slate-600 mb-5" id="modal-desc"></div>
            <div class="flex gap-3" id="modal-btns"></div>
        </div>
    </div>
    <div id="toast">提示内容</div>

    <script>
        const apis = [
            { id: 'account', prefix: 'tg', name: '账号接口' },
            { id: 'node', prefix: 'jd', name: '节点接口' },
            { id: 'sms', prefix: 'sms', name: '接码接口' },
            { id: 'query', prefix: 'cx', name: '查询接口' },
            { id: 'pay', prefix: 'zf', name: '支付接口' }
        ];
        let apiStatus = { account: 1, node: 0, sms: 1, query: 0, pay: 1 };
        let apiKeys = { account: 'sk_tg_123', node: 'sk_jd_456', sms: 'sk_sms_789', query: 'sk_cx_000', pay: 'sk_zf_999' };

        function renderApis() {
            document.getElementById('api-list').innerHTML = apis.map(a => `
                <div class="flex justify-between items-center py-3 border-b border-slate-50">
                    <p class="text-[14px] font-medium text-slate-800">${a.name}</p>
                    <button class="status-btn status-pending" onclick="showCustomAlert('申请', '已提交申请，请等待审核')">申请调用</button>
                </div>
            `).join('');
        }

        function renderKeys() {
            document.getElementById('key-list').innerHTML = apis.map(a => `
                <div class="p-3 bg-slate-50 border rounded-lg">
                    <p class="text-[12px] font-bold mb-1">${a.name} Key</p>
                    <div class="font-mono text-[12px] text-slate-600">${apiKeys[a.id]}</div>
                </div>
            `).join('');
        }

        function toggleAccordion(id, iconId) {
            const el = document.getElementById(id);
            const ic = document.getElementById(iconId);
            if(el.classList.contains('active')){el.classList.remove('active'); el.style.maxHeight = null; ic.classList.remove('rotate-180');}
            else {el.classList.add('active'); el.style.maxHeight = el.scrollHeight + 'px'; ic.classList.add('rotate-180');}
        }

        function switchBillTab(tab) {
            document.getElementById('tab-btn-bill').className = tab === 'bill' ? 'flex-1 py-3.5 text-[14px] font-bold text-blue-600 border-b-2 border-blue-600 bg-white' : 'flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent';
            document.getElementById('tab-btn-request').className = tab === 'request' ? 'flex-1 py-3.5 text-[14px] font-bold text-blue-600 border-b-2 border-blue-600 bg-white' : 'flex-1 py-3.5 text-[14px] font-bold text-slate-500 border-b-2 border-transparent';
            document.getElementById('bill-list-container').className = tab === 'bill' ? 'text-left p-4' : 'hidden';
            document.getElementById('request-list-container').className = tab === 'request' ? 'text-left p-4' : 'hidden';
        }

        function openRechargeModal() {
            showCustomAlert('在线充值', '<div class="text-center p-4"><p class="mb-2">请扫码支付</p><div class="w-32 h-32 bg-slate-200 mx-auto rounded"></div></div>');
        }

        function showCustomAlert(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('modal-btns').innerHTML = '<button onclick="closeModal()" class="w-full py-2 bg-blue-600 text-white font-bold rounded-lg">我知道了</button>';
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeModal() { document.getElementById('custom-modal').classList.remove('active'); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'show'; setTimeout(() => t.className = '', 2000); }

        document.addEventListener('DOMContentLoaded', () => {
            renderApis(); renderKeys();
            document.getElementById('bill-list-container').innerHTML = '<div class="p-4 text-center text-slate-400">暂无流水</div>';
            document.getElementById('request-list-container').innerHTML = '<div class="p-4 text-center text-slate-400">暂无记录</div>';
        });
    </script>
</body>
</html>
