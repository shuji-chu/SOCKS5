<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061326"><title>数字商城 · SOSKS5</title><style>
:root{color-scheme:dark;--bg:#061326;--panel:rgba(12,31,54,.82);--panel2:#102944;--line:rgba(110,190,230,.17);--cyan:#55e8ff;--blue:#589cff;--text:#f3f8ff;--muted:#8ea8c4;--green:#5be2b1;--red:#ff758f;--gold:#ffd27c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,#16416b 0,transparent 42%),radial-gradient(ellipse at -10% 70%,#102c50 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.wrap{width:min(1160px,100% - 32px);margin:auto}.header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 max(16px,calc((100% - 1160px)/2));background:#061326cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:850;letter-spacing:.5px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#4779ff);color:#061326;font-weight:900;box-shadow:0 0 25px #55e8ff33}.nav{display:flex;gap:8px;align-items:center}.nav a{padding:9px 13px;border-radius:10px;color:var(--muted)}.nav a:hover,.nav a.active{background:#55e8ff12;color:var(--cyan)}.btn{border:1px solid #55e8ff40;border-radius:12px;padding:10px 15px;background:#55e8ff12;color:var(--cyan);font-weight:750;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px #55e8ff18}.btn.primary{background:linear-gradient(135deg,#55e8ff,#659bff);border:0;color:#061326}.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}.muted{color:var(--muted)}.eyebrow{color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase}.title{font-size:clamp(28px,4vw,44px);line-height:1.15;letter-spacing:-1px;margin:8px 0 12px}.lead{font-size:15px;color:var(--muted);max-width:650px}.page-head{padding:38px 0 24px}.panel,.card{background:linear-gradient(145deg,rgba(17,43,70,.9),rgba(8,24,43,.86));border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 50px #0002;min-width:0}.panel{padding:22px}.grid{display:grid;gap:16px}.grid.products{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.section{margin:24px 0 40px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}.section-head h2{margin:0;font-size:21px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#ffffff06;color:var(--muted);font-size:12px}.pill.live{color:var(--green);border-color:#5be2b144}.price{font-size:25px;font-weight:850;color:var(--cyan);letter-spacing:-.5px}.price small{font-size:12px;color:var(--muted);font-weight:500}.input,select,textarea{width:100%;padding:12px 13px;border-radius:11px;background:#061629;border:1px solid var(--line);color:var(--text);outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e8ff12}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#b8cbe0;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;letter-spacing:.7px;color:var(--muted);background:#ffffff05}tr:last-child td{border-bottom:0}.empty,.error-state{padding:36px 16px;text-align:center;color:var(--muted)}.empty .symbol,.error-state .symbol{font-size:28px;margin-bottom:8px}.skeleton{height:220px;border-radius:18px;background:linear-gradient(100deg,#10263e 20%,#1c3a58 38%,#10263e 56%);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}.bottom-nav{display:none}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#102d46;border:1px solid #55e8ff55;border-radius:12px;padding:12px 18px;z-index:90;box-shadow:0 10px 35px #0008}.modal-backdrop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:#020914b8;backdrop-filter:blur(14px)}.modal-backdrop.show{display:flex}.modal{width:min(580px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#112b47f5,#071629f7);border:1px solid #75cfff3d;border-radius:22px;padding:22px;box-shadow:0 30px 90px #0009}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head h3{margin:0}.footer{border-top:1px solid var(--line);padding:26px 16px 100px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:820px){.nav{display:none}.grid.products{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two{grid-template-columns:1fr}.header{height:62px}.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#07172bea;border-top:1px solid var(--line);backdrop-filter:blur(20px)}.bottom-nav a{display:grid;place-items:center;gap:2px;color:var(--muted);font-size:10px}.bottom-nav a span{font-size:18px}.bottom-nav a.active{color:var(--cyan)}.footer{padding-bottom:100px}}@media(max-width:420px){.wrap{width:calc(100% - 24px)}.grid.products{gap:10px}.panel{padding:16px}.product-card .cover{height:115px}.btn{padding:9px 11px}.title{font-size:29px}}


</style></head><body>
<header class="header"><a class="brand" href="./index.html"><span class="brand-mark">S</span><span>SOSKS5 <small class="muted" style="font-size:10px;display:block;line-height:1">GLOBAL DIGITAL</small></span></a><nav class="nav"><a href="./index.html">首页</a><a class="active" href="./shop.html">商城</a><a class="" href="./promo.html">引流中心</a><a class="" href="./user.html">个人中心</a></nav><a class="btn" href="./login.html">登录 / 注册</a></header>
<main class="wrap"><section class="page-head"><div class="eyebrow">DIGITAL ASSET MARKET</div><h1 class="title">发现你的下一项数字资产</h1><p class="lead">精选账号、全球高速节点与流量方案。商品信息清晰呈现，购买路径简单直接。</p><div class="actions" style="margin-top:20px"><span class="pill live">● 服务状态正常</span><span class="pill">安全交付 · 全天候服务</span></div></section>
<section class="section"><div class="section-head"><h2>商品目录</h2><span class="muted" id="resultCount">正在整理商品…</span></div><div class="actions" id="tabs" style="margin-bottom:18px"><button class="btn primary" data-kind="全部">全部</button><button class="btn ghost" data-kind="节点">节点</button><button class="btn ghost" data-kind="账号">账号</button><button class="btn ghost" data-kind="流量包">流量包</button></div><div id="products" class="grid products"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="networkError" class="error-state" hidden><div class="symbol">⌁</div><b>商品暂时无法加载</b><p>这是演示数据页面，网络失败时仍可重新尝试。</p><button class="btn" onclick="renderProducts()">重新加载</button></div></section></main>
<div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h3 id="detailTitle">商品详情</h3><button class="btn ghost" onclick="closeDetail()">✕</button></div><div id="detailContent"></div></div></div><footer class="footer">SOSKS5 · 让数字服务简单可靠</footer>
<nav class="bottom-nav"><a href="./index.html"><span>⌂</span>首页</a><a class="active" href="./shop.html"><span>▦</span>商城</a><a class="" href="./promo.html"><span>⌁</span>引流</a><a class="" href="./user.html"><span>◉</span>我的</a></nav><div id="toast" class="toast" hidden></div>
<script>
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.hidden=true,2200)}
function copyText(s){if(!s){toast('当前暂无可复制内容');return}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){let e=document.createElement('textarea');e.value=s;e.style.position='fixed';e.style.opacity='0';document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch(_){toast('复制失败，请手动选择复制')}e.remove()}

const productsData=[
{id:1,kind:'节点',icon:'🌐',name:'全球高速节点 · 月度',price:19.9,sales:1280,stock:86,desc:'覆盖多地区的高速网络线路，适合日常浏览与多设备使用。',tutorial:'购买后进入个人中心查看订阅信息，按客户端提示导入配置。',notice:'线路体验受本地网络环境影响；请勿公开分享个人订阅链接。'},
{id:2,kind:'账号',icon:'◈',name:'精选数字账号 · 标准版',price:29,sales:846,stock:32,desc:'人工检查交付状态，提供清晰的交付说明与售后指引。',tutorial:'完成订单后在订单详情中查看交付说明。',notice:'请在使用前阅读对应平台规则，并妥善保管登录凭据。'},
{id:3,kind:'流量包',icon:'⇧',name:'高速流量包 · 100GB',price:12,sales:2136,stock:240,desc:'适合轻量使用的流量补充方案，额度和有效期清楚可查。',tutorial:'购买成功后额度将显示在个人中心（演示界面）。',notice:'流量包有效期与适用范围以订单说明为准。'},
{id:4,kind:'节点',icon:'✧',name:'低延迟专线 · 月度',price:35,sales:652,stock:41,desc:'为对延迟较敏感的使用场景提供独立线路选项。',tutorial:'在客户端新增订阅并更新配置即可查看节点。',notice:'不同运营商和地区的延迟表现可能不同。'},
{id:5,kind:'账号',icon:'▣',name:'专业账号资源包',price:49,sales:398,stock:17,desc:'适合进阶用户的资源组合，配套说明文档齐全。',tutorial:'进入个人中心订单列表查看后续指引。',notice:'请勿将账号用于违反平台服务条款的用途。'},
{id:6,kind:'流量包',icon:'↗',name:'轻量流量包 · 30GB',price:5.9,sales:1740,stock:180,desc:'低门槛流量补充方案，适合短期体验。',tutorial:'支付完成后查看账户额度状态。',notice:'流量与余额均为演示数据，当前页面不执行真实交易。'}
];
function renderProducts(kind='全部'){const root=document.getElementById('products');document.getElementById('networkError').hidden=true;root.innerHTML='';let list=productsData.filter(p=>kind==='全部'||p.kind===kind);document.getElementById('resultCount').textContent='共 '+list.length+' 件商品';if(!list.length){root.innerHTML='<div class="panel empty" style="grid-column:1/-1"><div class="symbol">⌕</div><b>暂无商品</b><p>这个分类暂时没有可展示的商品，试试其他分类。</p></div>';return}root.innerHTML=list.map(p=>'<article class="card product-card" tabindex="0" role="button" aria-label="查看'+p.name+'" onclick="openDetail('+p.id+')"><div class="cover"><span>'+p.icon+'</span><span class="pill" style="position:absolute;left:12px;top:12px;z-index:1">'+p.kind+'</span></div><div class="product-body"><div class="muted" style="font-size:11px">SOSKS5 SELECTED</div><h3>'+p.name+'</h3><div class="price">¥'+p.price.toFixed(2)+' <small>/ 套</small></div><div class="product-meta"><span>已售 '+p.sales+'</span><span>库存 '+p.stock+'</span></div><button class="btn primary" style="width:100%" onclick="event.stopPropagation();openDetail('+p.id+')">查看详情 ↗</button></div></article>').join('')}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-kind]').forEach(x=>x.className='btn ghost');b.className='btn primary';renderProducts(b.dataset.kind)}));
function openDetail(id){let p=productsData.find(x=>x.id===id);document.getElementById('detailTitle').textContent=p.name;document.getElementById('detailContent').innerHTML='<div class="cover" style="border-radius:14px;margin:16px 0;height:175px">'+p.icon+'</div><div class="price">¥'+p.price.toFixed(2)+'</div><p>'+p.desc+'</p><div class="panel" style="margin:12px 0"><b>使用教程</b><p class="muted">'+p.tutorial+'</p><b>注意事项</b><p class="muted">'+p.notice+'</p><div class="product-meta"><span>销量 '+p.sales+'</span><span>库存 '+p.stock+'</span></div></div><button class="btn primary" style="width:100%" onclick="toast(\'演示模式：暂未接入下单接口\')">立即购买</button>';document.getElementById('detailModal').classList.add('show')}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
setTimeout(()=>renderProducts(),650);

</script></body></html>
