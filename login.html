<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f4f8">
  <meta name="description" content="登录 Lynli 账户，管理您的服务与订单。">
  <title>登录 · Lynli</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="auth-brand" href="./shop.html" aria-label="返回商城">
      <span class="auth-brand-mark">L</span>
      <span class="auth-brand-copy"><strong id="siteName">Lynli</strong><small>ACCOUNT CENTER</small></span>
    </a>

    <section class="auth-card" aria-labelledby="pageTitle">
      <div class="auth-card-top">
        <span class="auth-eyebrow"><i></i> SECURE ACCOUNT</span>
        <div class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 4.6-2.9 8.1-7 10-4.1-1.9-7-5.4-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
      </div>

      <h1 id="pageTitle">欢迎回来</h1>
      <p class="auth-subtitle">登录您的账户，继续使用 Lynli 服务。</p>
      <div class="auth-notice" id="configNotice" role="status" hidden></div>

      <form id="loginForm" novalidate>
        <label class="auth-field">
          <span>邮箱地址</span>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="请输入注册邮箱" required>
        </label>
        <label class="auth-field">
          <span>登录密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </label>

        <p class="auth-error" id="formError" role="alert" aria-live="polite"></p>
        <button class="auth-primary" id="submitButton" type="submit">
          <span>登录账户</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <div class="auth-switch">还没有账户？ <a href="./register.html">立即注册</a></div>
      <div class="auth-security"><span aria-hidden="true">⌑</span> 安全连接 · 账户信息仅用于身份验证</div>
    </section>

    <footer class="auth-footer">© <span id="year"></span> <span id="footerSiteName">Lynli</span>. All rights reserved.</footer>
  </main>

  <script src="./js/api.js"></script>
  <script>
    (function () {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const form = $('loginForm');
      const button = $('submitButton');
      const errorBox = $('formError');
      $('year').textContent = new Date().getFullYear();

      function showError(message) {
        errorBox.textContent = message || '登录失败，请稍后重试';
      }

      async function loadConfig() {
        const config = await window.LynliAuthAPI.getConfig();
        const name = String(config.siteName || 'Lynli');
        $('siteName').textContent = name;
        $('footerSiteName').textContent = name;
        document.title = '登录 · ' + name;
        if (config.maintenance) {
          $('configNotice').hidden = false;
          $('configNotice').textContent = '系统维护提示：部分服务可能暂时不可用，您仍可尝试登录。';
        }
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        errorBox.textContent = '';
        const email = $('email').value.trim();
        const password = $('password').value;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('请输入有效的邮箱地址');
        if (!password) return showError('请输入登录密码');

        button.disabled = true;
        button.classList.add('is-loading');
        button.querySelector('span:first-child').textContent = '正在登录…';
        try {
          await window.LynliAuthAPI.login(email, password);
          // C-end always enters the user center, including administrator accounts.
          window.location.href = './user.html';
        } catch (error) {
          showError(error.message || '登录失败，请稍后重试');
          button.disabled = false;
          button.classList.remove('is-loading');
          button.querySelector('span:first-child').textContent = '登录账户';
        }
      });

      loadConfig();
    })();
  </script>
</body>
</html>
