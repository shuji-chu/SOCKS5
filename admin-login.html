<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>管理员登录 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 360px; }
        .input-dark { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <h1 class="text-[22px] font-bold mb-1">SYSTEM ADMIN</h1>
        </div>
        <div class="space-y-4">
            <input type="text" id="admin-user" class="input-dark" placeholder="管理员账号" value="boss@lynli.me">
            <input type="password" id="admin-pass" class="input-dark" placeholder="安全密钥" value="admin888">
            <button onclick="doLogin()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl mt-2">授权登录</button>
        </div>
    </div>
    <script>
        function doLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            if (user === 'boss@lynli.me' && pass === 'admin888') {
                localStorage.setItem('admin_token', 'tk_boss_' + Date.now());
                localStorage.setItem('user_role', 'boss'); // 确保角色被设置
                window.location.href = '/admin.html';
            } else {
                alert('密码错误，请重试');
            }
        }
    </script>
</body>
</html>
