<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的账户 - SOCKS5</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 80px; }
        .app-card { background: white; border-radius: 12px; margin: 12px; padding: 16px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
        .asset-box { display: flex; flex-direction: column; justify-content: center; background: #ffffff; border-radius: 10px; padding: 16px; border: 1px solid #f1f5f9; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02); }
        .asset-box:active { background: #f8fafc; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: white; border-bottom: 1px solid #f1f5f9; cursor: pointer; text-decoration: none; color: inherit; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f8fafc; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>

    <!-- 主页顶部导航：带公告 -->
    <header class="bg-white px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">我的账户</h1>
        <div class="relative cursor-pointer p-1 text-slate-500" onclick="openAdModal()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
        </div>
    </header>

    <a href="/settings.html" class="app-card flex items-center gap-4 mt-4 hover:bg-slate-50 transition-colors">
        <img id="user-avatar" src="/logo.jpg" class="w-16 h-16 rounded-full object-cover border border-slate-200">
        <div class="flex-1">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2"><span id="user-nickname">加载中...</span><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></div>
            </h2>
            <p class="text-[13px] text-slate-500 mt-1">用户ID：<span id="user-id" class="text-slate-500 font-mono"></span></p>
            <p class="text-[13px] text-slate-500 mt-0.5">邮箱：<span id="user-email-sub"></span></p>
        </div>
        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </a>

    <div class="grid grid-cols-2 gap-3 mx-3 mt-4">
        <div class="asset-box" onclick="openDetail('账户余额明细', '暂无资金变动记录')">
            <div class="flex items-center gap-2 mb-1"><div class="w-6 h-6 bg-blue-50 text-blue-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div><span class="text-xs text-slate-500">账户余额</span></div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('佣金余额明细', '暂无佣金变动记录')">
            <div class="flex items-center gap-2 mb-1"><div class="w-6 h-6 bg-orange-50 text-orange-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div><span class="text-xs text-slate-500">佣金余额</span></div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('消费总额明细', '暂无消费记录')">
            <div class="flex items-center gap-2 mb-1"><div class="w-6 h-6 bg-green-50 text-green-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div><span class="text-xs text-slate-500">消费总额</span></div>
            <p class="text-xl font-bold text-slate-800">¥ 0.00</p>
        </div>
        <div class="asset-box" onclick="openDetail('订单数量明细', '暂无订单记录')">
            <div class="flex items-center gap-2 mb-1"><div class="w-6 h-6 bg-slate-100 text-slate-500 rounded flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></div><span class="text-xs text-slate-500">订单数量</span></div>
            <p class="text-xl font-bold text-slate-800">0</p>
        </div>
    </div>

    <div class="app-card p-0 mt-4 overflow-hidden">
        <!-- 新增：使用说明 入口放在这里 -->
        <a href="/guide.html" class="menu-item">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <div><p class="text-sm font-bold text-slate-800">使用说明</p><p class="text-[11px] text-slate-400">查看购物流程与常见问题</p></div>
            </div>
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="/api-config.html" class="menu-item">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-50 text-indigo-500 rounded-lg flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg></div>
                <div><p class="text-sm font-bold text-slate-800">API 配置</p><p class="text-[11px] text-slate-400">用于对接第三方系统与外部发卡</p></div>
            </div>
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="/invite.html" class="menu-item">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-orange-50 text-orange-500 rounded-lg flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 2 2 0 018 0z"></path></svg></div>
                <div><p class="text-sm font-bold text-slate-800">邀请好友</p><p class="text-[11px] text-slate-400">分享专属链接，赚取高额佣金</p></div>
            </div>
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
    </div>

    <!-- 双Tab -->
    <div class="fixed bottom-0 left-0 right-0 bg-white flex justify-around py-3 border-t border-slate-200 z-50 pb-[calc(10px+env(safe-area-inset-bottom))]">
        <a href="/index.html" class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px]">首页</span>
        </a>
        <a href="/profile.html" class="flex flex-col items-center gap-1 text-blue-500">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="text-[10px] font-medium">我的</span>
        </a>
    </div>

    <div id="ad-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative">
            <button onclick="closeAdModal()" class="absolute top-3 right-3 text-slate-400 text-lg">✕</button>
            <div class="text-center">
                <h3 class="text-lg font-bold text-slate-800 mb-2">平台公告</h3>
                <p class="text-sm text-slate-500 mb-5 leading-relaxed">欢迎使用 SOCKS5 商城！目前 TG 旗舰号及高速节点均已补货。</p>
                <button onclick="closeAdModal()" class="w-full py-2.5 bg-blue-500 text-white font-bold rounded-xl text-sm">我知道了</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="bg-white rounded-2xl p-6 w-[85%] max-w-[320px] relative">
            <button onclick="closeDetail()" class="absolute top-3 right-3 text-slate-400 text-lg">✕</button>
            <div class="text-center">
                <h3 id="detail-title" class="text-lg font-bold text-slate-800 mb-2">明细</h3>
                <p id="detail-text" class="text-sm text-slate-500 mb-5 leading-relaxed">暂无数据</p>
                <button onclick="closeDetail()" class="w-full py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const email = localStorage.getItem('socks5_email');
        if (!email) window.location.href = '/login.html';
        const isBoss = email === 'boss@lynli.me';
        
        document.getElementById('user-email-sub').innerText = email;
        document.getElementById('user-nickname').innerText = localStorage.getItem('socks5_nickname') || email.split('@')[0];
        document.getElementById('user-id').innerText = localStorage.getItem('socks5_user_id') || (isBoss ? '10001' : '---');
        document.getElementById('user-avatar').src = localStorage.getItem('socks5_avatar') || '/logo.jpg';

        function openAdModal() { document.getElementById('ad-modal').classList.add('active'); }
        function closeAdModal() { document.getElementById('ad-modal').classList.remove('active'); }
        function openDetail(title, text) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-text').innerText = text;
            document.getElementById('detail-modal').classList.add('active');
        }
        function closeDetail() { document.getElementById('detail-modal').classList.remove('active'); }
    </script>
</body>
</html>
