<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 - SOCKS5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; justify-content: center;}
        .header { text-align: center; margin-bottom: 32px; }
        .header img { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; object-fit: cover; }
        .header h2 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; color: #64748b; margin-top: 6px; }
        .card { background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); width: 100%; max-width: 380px; margin: 0 auto; }
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; color: #64748b; }
        .options label { display: flex; align-items: center; gap: 6px; }
        .options a { color: #2563eb; text-decoration: none; cursor: pointer; }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .link-text { text-align: center; margin-top: 24px; }
        .link-text a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(30,41,59,0.95); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; transition: all 0.3s; z-index: 99999; }
        #toast.show { top: 30px; }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div class="header"><img src="/logo.jpg"><h2>欢迎回来</h2><p>登录以继续使用 SOCKS5 服务</p></div>
    <div class="card">
        <form id="login-form">
            <div class="input-group"><input type="email" id="email" required placeholder="工作邮箱"></div>
            <div class="input-group"><input type="password" id="password" required placeholder="密码"></div>
            <div class="options">
                <label><input type="checkbox" checked> 记住密码</label>
                <a onclick="showToast('请前往注册页使用邮箱验证码登录')">忘记密码？</a>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">安全登录</button>
        </form>
        <div class="link-text"><a href="/register.html">没有账号？立即注册</a></div>
    </div>

    <script>
        // 【核心逻辑】页面一打开，如果发现已经有 Token 了，直接秒进主页！
        if (localStorage.getItem('socks5_token')) {
            window.location.href = '/index.html';
        }

        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = '登录中...'; btn.disabled = true;
            
            const email = document.getElementById('email').value;
            
            try {
                // 为了让你能顺畅走通，这里直接调用真实后端的静默授权接口换 Token
                const res = await fetch('https://api.lynli.me/api/v1/auth/sso-login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ platform: 'email', open_id: email, nickname: email.split('@')[0] })
                });
                const data = await res.json();
                
                if (res.ok && data.code === 200) {
                    // 拿到真 Token 存下来
                    localStorage.setItem('socks5_email', email);
                    localStorage.setItem('socks5_token', data.data.token);
                    window.location.href = '/index.html';
                } else { 
                    showToast('登录失败，请重试'); 
                    btn.innerText = '安全登录'; btn.disabled = false;
                }
            } catch (err) { 
                showToast('网络连接失败'); 
                btn.innerText = '安全登录'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
